<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jetpack Platformer</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #071827;
      color: white;
      font-family: Arial, sans-serif;
    }

    #app {
      width: min(900px, 100%);
      padding: 16px;
      border: 2px solid #22c55e;
      border-radius: 14px;
      background: #020617;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }

    h1 {
      margin: 0 0 12px;
      color: #bbf7d0;
      font-size: 26px;
      text-align: center;
    }

    #game {
      display: block;
      width: 100%;
      height: auto;
      border: 2px solid #166534;
      border-radius: 10px;
      background: #061827;
    }

    #hud {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
      color: #e5e7eb;
      font-weight: bold;
      font-size: 14px;
    }

    #help {
      margin: 10px 0 0;
      color: #a5b4c5;
      font-size: 13px;
      text-align: center;
    }

    #mobileControls {
      display: none;
      justify-content: space-between;
      margin-top: 12px;
      gap: 10px;
    }

    .controlGroup {
      display: flex;
      gap: 10px;
    }

    .controlButton {
      width: 58px;
      height: 58px;
      border: 1px solid #86efac;
      border-radius: 12px;
      color: white;
      background: #166534;
      font-size: 22px;
      font-weight: bold;
      touch-action: none;
    }

    #jetButton {
      width: 70px;
      color: #1f1300;
      background: #fde047;
      font-size: 13px;
    }

    @media (max-width: 700px), (pointer: coarse) {
      #mobileControls {
        display: flex;
      }

      #help {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <h1>Jetpack Platformer</h1>

    <canvas id="game" width="800" height="450"></canvas>

    <div id="hud">
      <span id="scoreText">Score: 0</span>
      <span id="fuelText">Fuel: 5.0s</span>
      <span id="statusText">Reach the purple portal!</span>
    </div>

    <p id="help">
      A/D or Arrow Keys: move · W/Up: jump · Hold Space: jetpack
    </p>

    <div id="mobileControls">
      <div class="controlGroup">
        <button class="controlButton" id="leftButton" type="button">◀</button>
        <button class="controlButton" id="rightButton" type="button">▶</button>
      </div>

      <div class="controlGroup">
        <button class="controlButton" id="jumpButton" type="button">↑</button>
        <button class="controlButton" id="jetButton" type="button">JET</button>
      </div>
    </div>
  </div>

  <script>
    var canvas = document.getElementById("game");
    var ctx = canvas.getContext("2d");

    var scoreText = document.getElementById("scoreText");
    var fuelText = document.getElementById("fuelText");
    var statusText = document.getElementById("statusText");

    var keys = {
      left: false,
      right: false,
      jet: false
    };

    var player = {
      x: 70,
      y: 322,
      width: 28,
      height: 38,
      vx: 0,
      vy: 0,
      onGround: true,
      jumps: 0
    };

    var fuel = 5;
    var maxFuel = 5;
    var score = 0;

    var gravity = 0.65;
    var moveSpeed = 4.5;
    var jumpForce = -12;
    var jetForce = -0.42;

    var platforms = [
      { x: 0, y: 360, width: 180, height: 90, solid: true },
      { x: 285, y: 320, width: 185, height: 130, solid: true },
      { x: 555, y: 350, width: 245, height: 100, solid: true },

      { x: 185, y: 280, width: 95, height: 12, solid: false },
      { x: 385, y: 225, width: 105, height: 12, solid: false },
      { x: 530, y: 270, width: 95, height: 12, solid: false }
    ];

    var spikes = [
      { x: 180, y: 420, width: 105, height: 30 },
      { x: 470, y: 420, width: 85, height: 30 }
    ];

    var coins = [
      { x: 230, y: 250, taken: false },
      { x: 438, y: 195, taken: false },
      { x: 577, y: 240, taken: false },
      { x: 700, y: 316, taken: false }
    ];

    var portal = {
      x: 735,
      y: 288,
      width: 36,
      height: 62
    };

    function overlap(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    function resetPlayer() {
      player.x = 70;
      player.y = 322;
      player.vx = 0;
      player.vy = 0;
      player.onGround = true;
      player.jumps = 0;
      fuel = maxFuel;
      statusText.textContent = "Try again!";
    }

    function jump() {
      if (player.jumps < 2) {
        player.vy = jumpForce;
        player.jumps += 1;
        player.onGround = false;
      }
    }

    function update() {
      if (keys.left) {
        player.vx = -moveSpeed;
      } else if (keys.right) {
        player.vx = moveSpeed;
      } else {
        player.vx *= 0.75;
      }

      player.x += player.vx;

      if (keys.jet && fuel > 0) {
        player.vy += jetForce;
        fuel -= 0.02;
      } else {
        player.vy += gravity;
      }

      if (player.vy > 14) {
        player.vy = 14;
      }

      var oldBottom = player.y + player.height;
      player.y += player.vy;
      player.onGround = false;

      for (var i = 0; i < platforms.length; i++) {
        var platform = platforms[i];
        var newBottom = player.y + player.height;
        var playerCenterX = player.x + player.width / 2;

        var isAbovePlatform =
          playerCenterX >= platform.x &&
          playerCenterX <= platform.x + platform.width;

        if (
          player.vy >= 0 &&
          isAbovePlatform &&
          oldBottom <= platform.y + 12 &&
          newBottom >= platform.y
        ) {
          player.y = platform.y - player.height;
          player.vy = 0;
          player.onGround = true;
          player.jumps = 0;
        }
      }

      if (player.onGround && !keys.jet) {
        fuel += 0.025;
      }

      if (fuel > maxFuel) fuel = maxFuel;
      if (fuel < 0) fuel = 0;

      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) {
        player.x = canvas.width - player.width;
      }

      for (var s = 0; s < spikes.length; s++) {
        if (overlap(player, spikes[s])) {
          resetPlayer();
        }
      }

      for (var c = 0; c < coins.length; c++) {
        var coin = coins[c];

        if (!coin.taken) {
          var coinBox = {
            x: coin.x - 9,
            y: coin.y - 9,
            width: 18,
            height: 18
          };

          if (overlap(player, coinBox)) {
            coin.taken = true;
            score += 10;
            statusText.textContent = "+10 coin!";
          }
        }
      }

      if (overlap(player, portal)) {
        score += 100;
        statusText.textContent = "Portal reached! +100";

        for (var r = 0; r < coins.length; r++) {
          coins[r].taken = false;
        }

        resetPlayer();
      }

      if (player.y > canvas.height + 60) {
        resetPlayer();
      }

      scoreText.textContent = "Score: " + score;
      fuelText.textContent = "Fuel: " + fuel.toFixed(1) + "s";
    }

    function drawBackground() {
      var gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, "#061827");
      gradient.addColorStop(0.65, "#064e3b");
      gradient.addColorStop(1, "#02130d");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (var i = 0; i < 45; i++) {
        var starX = (i * 91) % canvas.width;
        var starY = (i * 47) % 190;

        ctx.fillStyle = i % 3 === 0 ? "#bbf7d0" : "#dbeafe";
        ctx.fillRect(starX, starY, 2, 2);
      }
    }

    function drawPlatforms() {
      for (var i = 0; i < platforms.length; i++) {
        var platform = platforms[i];

        if (platform.solid) {
          var groundGradient = ctx.createLinearGradient(
            0,
            platform.y,
            0,
            canvas.height
          );

          groundGradient.addColorStop(0, "#22c55e");
          groundGradient.addColorStop(0.08, "#166534");
          groundGradient.addColorStop(1, "#052e16");

          ctx.fillStyle = groundGradient;
          ctx.fillRect(
            platform.x,
            platform.y,
            platform.width,
            platform.height
          );

          ctx.strokeStyle = "#86efac";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(platform.x, platform.y + 1);
          ctx.lineTo(platform.x + platform.width, platform.y + 1);
          ctx.stroke();
        } else {
          ctx.fillStyle = "#22c55e";
          ctx.fillRect(
            platform.x,
            platform.y,
            platform.width,
            platform.height
          );

          ctx.fillStyle = "#14532d";
          ctx.fillRect(
            platform.x + 5,
            platform.y + 5,
            platform.width - 10,
            4
          );
        }
      }
    }

    function drawSpikes() {
      for (var i = 0; i < spikes.length; i++) {
        var spikeArea = spikes[i];

        ctx.fillStyle = "rgba(239, 68, 68, 0.25)";
        ctx.fillRect(
          spikeArea.x,
          spikeArea.y,
          spikeArea.width,
          spikeArea.height
        );

        ctx.fillStyle = "#ef4444";

        for (var x = spikeArea.x; x < spikeArea.x + spikeArea.width; x += 16) {
          ctx.beginPath();
          ctx.moveTo(x, spikeArea.y + spikeArea.height);
          ctx.lineTo(x + 8, spikeArea.y + 4);
          ctx.lineTo(x + 16, spikeArea.y + spikeArea.height);
          ctx.fill();
        }
      }
    }

    function drawCoins() {
      var time = Date.now() / 250;

      for (var i = 0; i < coins.length; i++) {
        var coin = coins[i];
        if (coin.taken) continue;

        var bobY = coin.y + Math.sin(time + i) * 3;

        ctx.fillStyle = "#fde047";
        ctx.beginPath();
        ctx.arc(coin.x, bobY, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#a16207";
        ctx.fillRect(coin.x - 2, bobY - 5, 4, 10);
      }
    }

    function drawPortal() {
      var pulse = Math.sin(Date.now() / 180) * 4;

      ctx.shadowColor = "#a855f7";
      ctx.shadowBlur = 20 + pulse;
      ctx.fillStyle = "#7e22ce";
      ctx.fillRect(portal.x, portal.y, portal.width, portal.height);

      ctx.shadowBlur = 0;
      ctx.fillStyle = "#c084fc";
      ctx.fillRect(
        portal.x + 7,
        portal.y + 7,
        portal.width - 14,
        portal.height - 14
      );

      ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
      ctx.beginPath();
      ctx.arc(
        portal.x + portal.width / 2,
        portal.y + portal.height / 2,
        8 + pulse / 4,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }

    function drawPlayer() {
      ctx.save();

      ctx.shadowColor = "#bbf7d0";
      ctx.shadowBlur = 12;
      ctx.fillStyle = "#e5e7eb";
      ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
      );

      ctx.shadowBlur = 0;

      ctx.fillStyle = "#22c55e";
      ctx.fillRect(
        player.x - 5,
        player.y + 12,
        7,
        18
      );

      ctx.fillStyle = "#1f2937";
      ctx.fillRect(
        player.x + 17,
        player.y + 8,
        10,
        8
      );

      ctx.fillStyle = "#334155";
      ctx.fillRect(player.x + 4, player.y + 35, 6, 6);
      ctx.fillRect(player.x + 18, player.y + 35, 6, 6);

      if (keys.jet && fuel > 0) {
        var flame = ctx.createLinearGradient(
          0,
          player.y + player.height,
          0,
          player.y + player.height + 30
        );

        flame.addColorStop(0, "#fef3c7");
        flame.addColorStop(0.4, "#f97316");
        flame.addColorStop(1, "rgba(239, 68, 68, 0)");

        ctx.fillStyle = flame;
        ctx.beginPath();
        ctx.moveTo(player.x + 8, player.y + player.height);
        ctx.lineTo(player.x + 14, player.y + player.height + 28);
        ctx.lineTo(player.x + 21, player.y + player.height);
        ctx.fill();
      }

      ctx.restore();
    }

    function draw() {
      drawBackground();
      drawPlatforms();
      drawSpikes();
      drawCoins();
      drawPortal();
      drawPlayer();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("keydown", function(event) {
      if (
        event.code === "ArrowLeft" ||
        event.code === "ArrowRight" ||
        event.code === "ArrowUp" ||
        event.code === "Space"
      ) {
        event.preventDefault();
      }

      if (event.code === "KeyA" || event.code === "ArrowLeft") {
        keys.left = true;
      }

      if (event.code === "KeyD" || event.code === "ArrowRight") {
        keys.right = true;
      }

      if (event.code === "Space") {
        keys.jet = true;
      }

      if (
        (event.code === "KeyW" || event.code === "ArrowUp") &&
        !event.repeat
      ) {
        jump();
      }
    });

    window.addEventListener("keyup", function(event) {
      if (event.code === "KeyA" || event.code === "ArrowLeft") {
        keys.left = false;
      }

      if (event.code === "KeyD" || event.code === "ArrowRight") {
        keys.right = false;
      }

      if (event.code === "Space") {
        keys.jet = false;
      }
    });

    function holdButton(buttonId, actionName) {
      var button = document.getElementById(buttonId);

      function start(event) {
        event.preventDefault();
        keys[actionName] = true;
        button.classList.add("active");
      }

      function end(event) {
        event.preventDefault();
        keys[actionName] = false;
        button.classList.remove("active");
      }

      button.addEventListener("touchstart", start, { passive: false });
      button.addEventListener("touchend", end, { passive: false });
      button.addEventListener("touchcancel", end, { passive: false });

      button.addEventListener("mousedown", start);
      button.addEventListener("mouseup", end);
      button.addEventListener("mouseleave", end);
    }

    holdButton("leftButton", "left");
    holdButton("rightButton", "right");
    holdButton("jetButton", "jet");

    document.getElementById("jumpButton").addEventListener("click", function() {
      jump();
    });

    draw();
    gameLoop();
  </script>
</body>
</html>
