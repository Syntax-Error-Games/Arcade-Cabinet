  const reserve=isTouch?140:0;
  const s=Math.max(1,Math.floor(Math.min(innerWidth/W,(innerHeight-reserve)/H)));
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
}

function drawText(str,x,y,col){
  ctx.fillStyle=col||'#fff';
  for(let i=0;i<str.length;i++){
    let ch=str[i]; let g=FONT[ch]||FONT[ch.toUpperCase()]; if(!g)continue;
    for(let r=0;r<5;r++){const v=+g[r];
      if(v&4)ctx.fillRect(x+i*8,y+r*2,2,2);
      if(v&2)ctx.fillRect(x+i*8+2,y+r*2,2,2);
      if(v&1)ctx.fillRect(x+i*8+4,y+r*2,2,2);
    }
  }
}
function textW(str){return str.length*8-2;}
function drawTextC(str,y,col){drawText(str,Math.floor((W-textW(str))/2),y,col);}

/* ---------------- pixel-map sprite builder ---------------- */
function art(rows,pal,w){
  w=w||16;const h=rows.length;const [c,x]=mkCanvas(w,h);
  for(let r=0;r<h;r++){const s=rows[r];for(let i=0;i<w;i++){const ch=s[i];const col=ch&&pal[ch];if(col){x.fillStyle=col;x.fillRect(i,r,1,1);}}}
  return c;
}
function flipH(c){const [f,x]=mkCanvas(c.width,c.height);x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return f;}
function circ(x,cx,cy,r,col){x.fillStyle=col;for(let yy=-r;yy<=r;yy++)for(let xx=-r;xx<=r;xx++)if(xx*xx+yy*yy<=r*r+r*0.5)x.fillRect(cx+xx,cy+yy,1,1);}

let AC=null,muted=false;
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
function audioResume(){if(AC&&AC.state==='suspended')AC.resume();}
function tone(freq,dur,type,vol,slide,delay){
  if(!AC||muted)return;const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';
  o.frequency.setValueAtTime(freq,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t0+dur);
  g.gain.setValueAtTime(vol||0.1,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+0.02);
}
let noiseBuf=null;
function noise(dur,vol,delay){
  if(!AC||muted)return;
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const t0=AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=noiseBuf;const g=AC.createGain();
  g.gain.setValueAtTime(vol||0.1,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);s.connect(g);g.connect(AC.destination);s.start(t0);s.stop(t0+dur+0.02);
}

/* a small original loop: lead + bass, eighth-note grid */
const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function nf(n){if(n==='-'||n==='.')return 0;const s=NOTE[n[0]]+(n[1]==='#'?1:0);const oct=+n[n.length-1];return 440*Math.pow(2,(s+(oct-4)*12-9)/12);}
const LEAD='G4 - B4 D5 - B4 G4 - A4 - C5 E5 - C5 A4 - F4 - A4 C5 - A4 F4 - G4 A4 B4 C5 D5 - - - E5 - D5 C5 - D5 E5 - C5 - B4 A4 - B4 C5 - D5 - C5 B4 - A4 G4 - G4 - - - - - - -'.split(' ');
const BASS='G2 - G2 - D3 - D3 - A2 - A2 - E3 - E3 - F2 - F2 - C3 - C3 - G2 - G2 - G2 - G2 - C3 - C3 - G2 - G2 - A2 - A2 - E3 - E3 - D3 - D3 - D3 - D3 - G2 - G2 - G2 - G2 -'.split(' ');
const music={on:true,step:0,next:0,playing:false,rate:0.17};
function musicUpdate(){
  if(!AC||muted||!music.on||!music.playing){if(AC)music.next=AC.currentTime;return;}
  if(music.next<AC.currentTime-0.25)music.next=AC.currentTime;
  while(music.next<AC.currentTime+0.12){
    const i=music.step%LEAD.length;const l=LEAD[i],b=BASS[i];const t=music.next-AC.currentTime;
    if(l!=='-')tone(nf(l),music.rate*0.9,'square',0.035,0,t);
    if(b!=='-')tone(nf(b),music.rate*1.6,'triangle',0.09,0,t);
    music.next+=music.rate;music.step++;
  }
}
function musicStart(){music.playing=true;music.step=0;if(AC)music.next=AC.currentTime+0.05;}
function musicStop(){music.playing=false;}

function tget(wd,x,y){if(x<0||x>=wd.w)return (y>=0&&y<ROWS)?(x<0?GND:0):0;if(y<0||y>=ROWS)return 0;return wd.tiles[y*wd.w+x];}

  Object.assign(M,{x,y,vx:0,vy:0,ground:false,jumpHeld:false,state:'normal',stateT:0,inv:0,star:0,animT:0,frame:'stand',
    crouch:false,skid:false,combo:0,behind:false,throwT:0});
  M.h=16;setSize();
}

/* ---------------- Mario ---------------- */
function marioUpdate(){
  const wd=G.world;M.stateT++;
  if(M.inv>0)M.inv--;
  if(M.star>0){M.star--;if(M.star===0)music.rate=G.hurry?0.13:0.17;}
  if(M.throwT>0)M.throwT--;
  const st=M.state;
  if(st==='grow'||st==='shrink'){
    if(M.stateT>=50){M.state='normal';if(st==='shrink')M.inv=160;}
    return;
  }
  if(st==='die'){
    if(M.stateT===30)M.vy=-4.5;
    if(M.stateT>30){M.y+=M.vy;M.vy=Math.min(M.vy+0.25,5);}
    if(M.stateT>210)afterDeath();
    return;
  }
  if(st==='pipeDown'){M.y+=0.6;if(M.stateT>=54){enterBonus();}return;}
  if(st==='pipeIn'){M.x+=0.5;M.frame=walkFrame();if(M.stateT>=40){exitBonus();}return;}
  if(st==='pipeUp'){M.y-=0.6;if(M.stateT>=54){M.y=11*T-M.h;M.state='normal';M.behind=false;}return;}
  if(st==='drop'){M.vy=Math.min(M.vy+0.4375,4);M.y+=M.vy;M.frame='jump';if(M.y>=3*T){M.state='normal';}return;}
  if(st==='flag'){
    let done=true;
    if(M.y+M.h<12*T){M.y=Math.min(M.y+2,12*T-M.h);done=false;}
    if(M.flagY<12*T-14){M.flagY=Math.min(M.flagY+2,12*T-14);done=false;}
    M.frame=(M.stateT>>3)&1?'walk3':'walk1';
    if(done){M.state='flagHop';M.stateT=0;M.x=POLE_X+2;M.dir=-1;M.frame='walk1';}
    return;
  }
  if(st==='flagHop'){if(M.stateT>=30){M.state='walk';M.stateT=0;M.dir=1;M.vy=0;}return;}
  if(st==='walk'){
    M.vx=1.3;M.x+=M.vx;M.vy=Math.min(M.vy+0.4375,4);M.y+=M.vy;collideY();
    M.frame=walkFrame();
    if(M.x+M.w/2>=CASTLE_DOOR){M.state='win';M.stateT=0;G.mode='win';G.modeT=0;G.winT=0;G.cleared=false;musicStop();SFX.clear();
      const d=G.time%10;G.fireworks=d===1?1:d===3?3:d===6?6:0;}
    return;
  }
  if(st==='win')return;

  /* ---- normal control ---- */
  const jumpPressed=(keys.jump&&!prev.jump)||press.jump;
  if(M.big&&M.ground&&keys.down&&!M.crouch){M.crouch=true;setSize();}
  if(M.crouch&&(!keys.down||!M.big)){M.crouch=false;setSize();if(headBlocked()){M.crouch=true;setSize();}}
  const run=keys.run,maxV=run?2.5:1.5;
  let want=(keys.left?-1:0)+(keys.right?1:0);
  if(M.crouch&&M.ground)want=0;
  if(want!==0){
    if(M.ground&&M.vx*want<0){M.vx+=want*0.1;M.skid=true;M.dir=want;}
    else{M.vx+=want*(run?0.056:0.037)*(M.ground?1:0.85);M.skid=false;M.dir=want;}
  }else{
    M.skid=false;
    if(M.ground){const d=0.05;if(Math.abs(M.vx)<=d)M.vx=0;else M.vx-=Math.sign(M.vx)*d;}
  }
  if(Math.abs(M.vx)>maxV)M.vx=Math.sign(M.vx)*Math.max(maxV,Math.abs(M.vx)-0.06);
  if(jumpPressed&&M.ground){
    const s=Math.abs(M.vx);M.vy=s>=2.3?-5.1:-4.2;M.gHold=s<1?0.125:s<2.3?0.117:0.156;M.gFall=s<2.3?0.4375:0.5625;
    M.ground=false;M.jumpHeld=true;M.big?SFX.bigjump():SFX.jump();
  }
  if(!keys.jump)M.jumpHeld=false;
  const g=(M.jumpHeld&&keys.jump&&M.vy<0)?M.gHold:M.gFall;
  M.vy=Math.min(M.vy+g,4);
  /* fire */
  if(M.fire&&((keys.run&&!prev.run)||press.run)&&!M.crouch&&fireballCount()<2){
    wd.entities.push({type:'fire',x:M.dir>0?M.x+M.w:M.x-8,y:M.y+(M.big?10:4),w:8,h:8,vx:4*M.dir,vy:0,dir:M.dir,t:0});
    SFX.fire();M.throwT=8;
  }
  /* move */
  M.x+=M.vx;
  if(M.x<G.cam){M.x=G.cam;if(M.vx<0)M.vx=0;}
  if(M.x>wd.w*T-M.w){M.x=wd.w*T-M.w;M.vx=0;}
  collideX();
  M.y+=M.vy;
  const wasGround=M.ground;M.ground=false;
  collideY();
  if(M.ground){M.combo=0;if(!wasGround)M.gFall=0.4375;}
  collectCoins();
  if(!wd.bonus&&M.x>=LEVEL.checkpoint*T)G.checkpoint=true;
  if(M.y>H+8){die(false);return;}
  /* pipe down into bonus */
  if(!wd.bonus&&keys.down&&M.ground&&!M.crouch){
    const cx=M.x+M.w/2,px=LEVEL.bonusPipe*T;
    if(cx>px+2&&cx<px+30&&Math.abs(M.y+M.h-9*T)<1){M.state='pipeDown';M.stateT=0;M.behind=true;M.vx=0;M.crouch=false;setSize();M.x=px+10;SFX.pipe();M.frame='stand';return;}
  }
  /* bonus exit pipe */
  if(wd.bonus&&M.ground&&M.x+M.w>=14*T+2&&M.y+M.h>11*T+4&&keys.right){
    M.state='pipeIn';M.stateT=0;M.behind=true;M.vx=0;M.dir=1;SFX.pipe();return;
  }
  /* flag */
  if(!wd.bonus&&M.x+M.w>=POLE_X-8){
    M.x=POLE_X-M.w-4;M.vx=0;M.vy=0;M.state='flag';M.stateT=0;M.dir=1;M.crouch=false;setSize();
    const hp=12*T-(M.y+M.h);const pts=hp>=140?5000:hp>=104?2000:hp>=72?800:hp>=40?400:100;
    addScore(pts);popScore(POLE_X+8,M.y,pts);M.flagY=2*T+4;musicStop();SFX.flag();
    return;
  }
  /* animation frame */
  if(M.crouch)M.frame='crouch';
  else if(!M.ground)M.frame='jump';
  else if(M.skid)M.frame='skid';
  else if(Math.abs(M.vx)>0.1)M.frame=walkFrame();
  else{M.frame='stand';M.animT=0;}
}
function walkFrame(){
  M.animT+=Math.max(0.6,Math.abs(M.vx)*0.9)+0.4;
  const f=Math.floor(M.animT/6)%3;return ['walk1','walk2','walk3'][f];
}
function collideX(){
  const wd=G.world;const ys=[M.y+2,M.y+M.h/2,M.y+M.h-2];
  if(M.vx>0){const tx=Math.floor((M.x+M.w-1)/T);for(const y of ys)if(isSolid(tget(wd,tx,Math.floor(y/T)))){M.x=tx*T-M.w;M.vx=0;break;}}
  else if(M.vx<0){const tx=Math.floor(M.x/T);for(const y of ys)if(isSolid(tget(wd,tx,Math.floor(y/T)))){M.x=(tx+1)*T;M.vx=0;break;}}
}
function collideY(){
  const wd=G.world;
  if(M.vy>=0){
    const ty=Math.floor((M.y+M.h)/T);
    for(const px of [M.x+1,M.x+M.w/2,M.x+M.w-2])if(isSolid(tget(wd,Math.floor(px/T),ty))){M.y=ty*T-M.h;M.vy=0;M.ground=true;break;}
  }else{
    const ty=Math.floor(M.y/T);let best=-1,bd=1e9;const cx=M.x+M.w/2;
    for(const px of [M.x+2,M.x+M.w-3]){const tx=Math.floor(px/T);const id=tget(wd,tx,ty);
      if(isSolid(id)||id===HID){const d=Math.abs(tx*T+8-cx);if(d<bd){bd=d;best=tx;}}}
    if(best>=0){M.y=(ty+1)*T;M.vy=0;M.jumpHeld=false;hitBlock(best,ty);}
  }
}
function collectCoins(){
  const wd=G.world;const x0=Math.floor((M.x+2)/T),x1=Math.floor((M.x+M.w-3)/T),y0=Math.floor((M.y+2)/T),y1=Math.floor((M.y+M.h-2)/T);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(tget(wd,x,y)===COIN){tset(wd,x,y,E);giveCoin(x*T,y*T,false);G.world.effects.push({k:'sparkle',x:x*T,y:y*T,t:0});}
}
function fireballCount(){let n=0;for(const e of G.world.entities)if(e.type==='fire')n++;return n;}

/* ---------------- blocks ---------------- */
function bounceTile(tx,ty){G.world.bounces.push({x:tx,y:ty,t:0});}
function hitBlock(tx,ty){
  const wd=G.world;const id=tget(wd,tx,ty);const key=tx+','+ty;const c=wd.contents[key];
  if(id===BRK){
    if(c){
      if(c.k==='multi'){c.n--;giveCoin(tx*T,ty*T,true);if(c.n<=0){delete wd.contents[key];tset(wd,tx,ty,USED);}bounceTile(tx,ty);}
      else{spawnItem(c.k,tx,ty);delete wd.contents[key];tset(wd,tx,ty,USED);bounceTile(tx,ty);}
    }else if(M.big){breakBrick(tx,ty);}
    else{bounceTile(tx,ty);SFX.bump();}
    bumpAbove(tx,ty);
  }else if(id===QB||id===HID){
    const kind=c?c.k:'coin';delete wd.contents[key];tset(wd,tx,ty,USED);bounceTile(tx,ty);
    if(kind==='coin')giveCoin(tx*T,ty*T,true);else spawnItem(kind,tx,ty);
    bumpAbove(tx,ty);
  }else SFX.bump();
}
function spawnItem(kind,tx,ty){
  const type=kind==='power'?(M.big?'flower':'mushroom'):kind;
  G.world.entities.push({type,x:tx*T,y:ty*T,w:16,h:16,vx:0,vy:0,dir:1,emerge:16,t:0});
  tone(660,0.12,'square',0.05,1320);
}
function breakBrick(tx,ty){
  const wd=G.world;tset(wd,tx,ty,E);addScore(50);SFX.brick();
  const x=tx*T,y=ty*T;
  for(const [dx,dy,vx,vy] of [[0,0,-1.2,-6],[8,0,1.2,-6],[0,8,-1.2,-3.5],[8,8,1.2,-3.5]])wd.effects.push({k:'frag',x:x+dx,y:y+dy,vx,vy,t:0});
}
function bumpAbove(tx,ty){
  for(const e of G.world.entities){
    if(e.dead)continue;
    if(e.x+e.w>tx*T&&e.x<tx*T+T&&Math.abs(e.y+e.h-ty*T)<=3){
      if(e.type==='goomba'||e.type==='koopa'||e.type==='shell'){flipKill(e);addScore(100);popScore(e.x,e.y,100);}
      else if(e.type==='mushroom'||e.type==='1up'||e.type==='star'){e.vy=-3;e.dir=(e.x+e.w/2<tx*T+8)?-1:1;}
    }
  }
}

/* ---------------- entities ---------------- */
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function spawnEnemies(){
  const wd=G.world;
  for(const s of wd.spawns){
    if(s.done)continue;
    if(s.x<G.cam-T){s.done=true;continue;}
    if(s.x<G.cam+W+T){s.done=true;wd.entities.push(makeEnemy(s.type,s.x));}
  }
}
function makeEnemy(type,x){
  if(type==='koopa')return {type,state:'walk',x,y:13*T-24,w:16,h:24,vx:0,vy:0,dir:-1,t:0,speed:0.55};
  return {type:'goomba',state:'walk',x,y:12*T,w:16,h:16,vx:0,vy:0,dir:-1,t:0,speed:0.55};
}
function flipKill(e){
  if(e.state==='flip')return;
  e.state='flip';e.vy=-4;e.vx=e.type==='shell'?0:(e.dir||1)*-0.8;e.t=0;
  if(e.type==='koopa'){e.type='shell';e.h=16;e.y+=8;}
}
function entPhysics(e,grav,maxFall){
  const wd=G.world;e.hitWall=false;
  e.vy=Math.min(e.vy+grav,maxFall);
  e.x+=e.vx;
  if(e.vx>0){const tx=Math.floor((e.x+e.w-1)/T);for(const y of [e.y+2,e.y+e.h-2])if(isSolid(tget(wd,tx,Math.floor(y/T)))){e.x=tx*T-e.w;e.hitWall=true;break;}}
  else if(e.vx<0){const tx=Math.floor(e.x/T);for(const y of [e.y+2,e.y+e.h-2])if(isSolid(tget(wd,tx,Math.floor(y/T)))){e.x=(tx+1)*T;e.hitWall=true;break;}}
  e.y+=e.vy;e.ground=false;
  if(e.vy>=0){const ty=Math.floor((e.y+e.h)/T);for(const px of [e.x+1,e.x+e.w-2])if(isSolid(tget(wd,Math.floor(px/T),ty))){e.y=ty*T-e.h;e.vy=0;e.ground=true;break;}}
  else{const ty=Math.floor(e.y/T);for(const px of [e.x+1,e.x+e.w-2])if(isSolid(tget(wd,Math.floor(px/T),ty))){e.y=(ty+1)*T;e.vy=0;break;}}
}
function updateEntities(){
  const wd=G.world,ents=wd.entities;
  for(const e of ents){
    if(e.dead)continue;
    e.t++;
    if(e.state==='flip'){e.x+=e.vx;e.y+=e.vy;e.vy=Math.min(e.vy+0.3,5);if(e.y>H+16)e.dead=true;continue;}
    if(e.emerge>0){e.y-=0.5;e.emerge-=0.5;if(e.emerge<=0){e.emerge=0;if(e.type==='star')e.vy=-4.5;}continue;}
    switch(e.type){
      case 'goomba':
        if(e.state==='flat'){if(e.t>40)e.dead=true;break;}
        e.vx=e.dir*e.speed;entPhysics(e,0.35,4);if(e.hitWall)e.dir*=-1;break;
      case 'koopa':
        e.vx=e.dir*e.speed;entPhysics(e,0.35,4);if(e.hitWall)e.dir*=-1;break;
      case 'shell':
        if(e.kickT>0)e.kickT--;
        if(e.state==='idle'||e.state==='wake'){
          e.vx=0;entPhysics(e,0.35,4);
          if(e.state==='idle'&&e.t>330){e.state='wake';e.t=0;}
          if(e.state==='wake'&&e.t>100){e.type='koopa';e.state='walk';e.h=24;e.y-=8;e.t=0;e.dir=(M.x<e.x)?-1:1;}
        }else{ /* moving */
          e.vx=e.dir*3;entPhysics(e,0.35,4);
          if(e.hitWall){e.dir*=-1;SFX.bump();}
          for(const o of ents){
            if(o===e||o.dead||o.state==='flip'||o.emerge>0)continue;
            if((o.type==='goomba'||o.type==='koopa'||o.type==='shell')&&overlap(e,o)){flipKill(o);comboScore(SHELL_PTS,e.combo||0,o.x,o.y);e.combo=(e.combo||0)+1;SFX.kick();}
          }
        }
        break;
      case 'mushroom': case '1up':
        e.vx=e.dir*1;entPhysics(e,0.35,4);if(e.hitWall)e.dir*=-1;break;
      case 'flower':
        entPhysics(e,0.35,4);break;
      case 'star':
        e.vx=e.dir*1.3;entPhysics(e,0.2,4);if(e.hitWall)e.dir*=-1;if(e.ground)e.vy=-4.5;break;
      case 'fire':{
        e.x+=e.vx;const tx=Math.floor((e.vx>0?e.x+e.w-1:e.x)/T);
        if(isSolid(tget(wd,tx,Math.floor((e.y+4)/T)))){boom(e.x,e.y);e.dead=true;break;}
        e.vy=Math.min(e.vy+0.5,4);e.y+=e.vy;
        if(e.vy>0){const ty=Math.floor((e.y+e.h)/T);if(isSolid(tget(wd,Math.floor((e.x+4)/T),ty))){e.y=ty*T-e.h;e.vy=-3.7;}}
        else{const ty=Math.floor(e.y/T);if(isSolid(tget(wd,Math.floor((e.x+4)/T),ty))){boom(e.x,e.y);e.dead=true;break;}}
        for(const o of ents){
          if(o===e||o.dead||o.state==='flip'||o.emerge>0)continue;
          if((o.type==='goomba'||o.type==='koopa'||o.type==='shell')&&overlap(e,o)){flipKill(o);addScore(200);popScore(o.x,o.y,200);SFX.kick();boom(e.x,e.y);e.dead=true;break;}
        }
        if(e.x<G.cam-16||e.x>G.cam+W+16)e.dead=true;
        break;}
    }
    /* enemy-enemy turnarounds */
    if((e.type==='goomba'||e.type==='koopa')&&e.state==='walk'){
      for(const o of ents){
        if(o===e||o.dead||o.state!=='walk'||(o.type!=='goomba'&&o.type!=='koopa'))continue;
        if(overlap(e,o)){if(e.x<o.x){e.dir=-1;o.dir=1;}else{e.dir=1;o.dir=-1;}}
      }
    }
    if(e.y>H+32)e.dead=true;
    if(e.type!=='fire'&&(e.x<G.cam-80||e.x>G.cam+W+80))e.dead=true;
  }
  wd.entities=ents.filter(e=>!e.dead);
}
function boom(x,y){G.world.effects.push({k:'boom',x:Math.round(x)-4,y:Math.round(y)-4,t:0});}

function stomping(e){return M.vy>0&&(M.y+M.h)-e.y<=12;}
function stompBounce(){M.vy=-4;M.gHold=0.125;M.gFall=0.4375;M.jumpHeld=true;M.ground=false;}
function hurt(){
  if(M.inv>0||M.star>0||M.state!=='normal')return;
  if(M.big){M.big=false;M.fire=false;M.crouch=false;setSize();M.state='shrink';M.stateT=0;M.growKind='size';tone(500,0.3,'square',0.06,120);}
  else die(true);
}
function marioTouch(){
  if(M.state!=='normal')return;
  for(const e of G.world.entities){
    if(e.dead||e.emerge>0||e.state==='flip')continue;
    if(!overlap(M,e))continue;
    switch(e.type){
      case 'mushroom':
        e.dead=true;addScore(1000);popScore(e.x,e.y,1000);SFX.powerup();
        if(!M.big){M.big=true;setSize();if(headBlocked()){M.crouch=true;setSize();}M.state='grow';M.stateT=0;M.growKind='size';}
        break;
      case '1up':e.dead=true;addLife(e.x,e.y);break;
      case 'flower':
        e.dead=true;addScore(1000);popScore(e.x,e.y,1000);SFX.powerup();
        if(!M.big){M.big=true;setSize();if(headBlocked()){M.crouch=true;setSize();}M.state='grow';M.stateT=0;M.growKind='size';}
        else if(!M.fire){M.fire=true;M.state='grow';M.stateT=0;M.growKind='fire';}
        break;
      case 'star':e.dead=true;addScore(1000);popScore(e.x,e.y,1000);M.star=720;music.rate=0.12;SFX.powerup();break;
      case 'goomba':
        if(e.state!=='walk')break;
        if(M.star>0){flipKill(e);comboScore(STOMP_PTS,M.combo++,e.x,e.y);SFX.kick();}
        else if(stomping(e)){e.state='flat';e.t=0;e.vx=0;stompBounce();comboScore(STOMP_PTS,M.combo++,e.x,e.y);SFX.stomp();}
        else hurt();
        break;
      case 'koopa':
        if(M.star>0){flipKill(e);comboScore(STOMP_PTS,M.combo++,e.x,e.y);SFX.kick();}
        else if(stomping(e)){e.type='shell';e.state='idle';e.h=16;e.y+=8;e.t=0;e.vx=0;e.kickT=0;stompBounce();comboScore(STOMP_PTS,M.combo++,e.x,e.y);SFX.stomp();}
        else hurt();
        break;
      case 'shell':
        if(M.star>0){flipKill(e);comboScore(STOMP_PTS,M.combo++,e.x,e.y);SFX.kick();}
        else if(e.state==='idle'||e.state==='wake'){
          e.state='move';e.t=0;e.combo=0;e.kickT=12;e.dir=(M.x+M.w/2<e.x+e.w/2)?1:-1;
          e.x=e.dir>0?M.x+M.w+1:M.x-e.w-1;addScore(400);popScore(e.x,e.y,400);SFX.kick();
          if(stomping(e))stompBounce();
        }else if(stomping(e)){e.state='idle';e.t=0;e.vx=0;stompBounce();addScore(100);popScore(e.x,e.y,100);SFX.stomp();}
        else if(!(e.kickT>0))hurt();
        break;
    }
  }
}
function updateEffects(){
  const wd=G.world;
  for(const f of wd.effects){
    f.t++;
    if(f.k==='score'){f.y-=0.6;if(f.t>50)f.dead=true;}
    else if(f.k==='coinpop'){f.y+=f.vy;f.vy+=0.35;if(f.t>=32){f.dead=true;popScore(f.x+2,f.y-8,200);}}
    else if(f.k==='frag'){f.x+=f.vx;f.y+=f.vy;f.vy+=0.3;if(f.y>H)f.dead=true;}
    else if(f.k==='boom'||f.k==='sparkle'){if(f.t>18)f.dead=true;}
  }
  wd.effects=wd.effects.filter(f=>!f.dead);
  for(const b of wd.bounces)b.t++;
  wd.bounces=wd.bounces.filter(b=>b.t<=12);
}

/* ---------------- level flow ---------------- */
function newGame(){G.score=0;G.coins=0;G.lives=3;G.checkpoint=false;G.cleared=false;G.fireworks=0;G.mode='pre';G.modeT=0;musicStop();}
function startLevel(){
  G.main=buildMain();G.world=G.main;G.time=400;G.timeAcc=0;G.hurry=false;music.rate=0.17;
  const sx=G.checkpoint?LEVEL.checkpoint*T:40;
  M.big=false;M.fire=false;M.crouch=false;resetMario(sx,12*T);M.h=16;M.y=13*T-16;
  G.cam=clamp(sx-40,0,LEVEL.w*T-W);
  for(const s of G.main.spawns)if(s.x<G.cam+W+8)s.done=true;
  G.mode='play';G.paused=false;musicStart();
}
function enterBonus(){
  G.bonus=buildBonus();G.world=G.bonus;G.cam=0;
  const big=M.big,fire=M.fire;resetMario(24,-40);M.big=big;M.fire=fire;setSize();
  M.state='drop';M.behind=false;M.vy=0;
}
function exitBonus(){
  G.world=G.main;const px=LEVEL.exitPipe*T;
  const big=M.big,fire=M.fire;resetMario(px+10,11*T);M.big=big;M.fire=fire;M.h=16;M.y=11*T;setSize();M.y=11*T;
  M.state='pipeUp';M.behind=true;G.cam=clamp(px-64,0,LEVEL.w*T-W);SFX.pipe();
}
function die(anim){
  if(M.state==='die')return;
  M.state='die';M.stateT=anim?0:40;M.vy=anim?0:3;M.vx=0;M.big=false;M.fire=false;M.crouch=false;setSize();M.behind=false;
  musicStop();SFX.die();
}
function afterDeath(){
  G.lives--;
  if(G.lives<=0){G.mode='over';G.modeT=0;SFX.gameover();}
  else{G.mode='pre';G.modeT=0;}
}
function timerTick(){
  const s=M.state;
  if(s==='grow'||s==='shrink'||s==='die'||s==='flag'||s==='flagHop'||s==='walk'||s==='win')return;
  if(++G.timeAcc>=24){G.timeAcc=0;G.time--;
    if(G.time===100&&!G.hurry){G.hurry=true;music.rate=0.13;[880,880,880].forEach((f,i)=>tone(f,0.08,'square',0.06,0,i*0.12));}
    if(G.time<=0){G.time=0;die(true);}
  }
}
function cameraUpdate(){
  const wd=G.world;if(wd.bonus){G.cam=0;return;}
  if(M.state==='normal'||M.state==='drop'){const t=M.x+M.w/2-128;if(t>G.cam)G.cam=Math.min(t,wd.w*T-W);}
}

/* ---------------- step ---------------- */
function step(){
  G.frame++;
  const startP=(keys.start&&!prev.start)||press.start;
  switch(G.mode){
    case 'title':if(startP)newGame();break;
    case 'pre':if(++G.modeT>=110)startLevel();break;
    case 'play':{
      if(startP){G.paused=!G.paused;tone(660,0.08,'square',0.05);if(G.paused)musicStop();else music.playing=true;}
      if(G.paused)break;
      timerTick();
      marioUpdate();
      if(G.mode!=='play')break;
      const frozen=M.state==='grow'||M.state==='shrink'||M.state==='die';
      if(!frozen){spawnEnemies();updateEntities();marioTouch();}
      updateEffects();cameraUpdate();
      break;}
    case 'win':{
      G.modeT++;
      if(G.time>0){G.time=Math.max(0,G.time-2);addScore(100);if((G.modeT&3)===0)SFX.tick();G.winT=0;}
      else{
        G.winT=(G.winT||0)+1;
        if(G.fireworks>0&&G.winT%36===0){G.fireworks--;boom(G.cam+rnd(48,224),rnd(32,110));addScore(500);SFX.firework();}
        if(G.fireworks===0&&G.winT>150)G.cleared=true;
        if(G.cleared&&startP){G.mode='title';G.top=Math.max(G.top,G.score);musicStop();}
      }
      updateEffects();
      break;}
    case 'over':if(++G.modeT>=240||startP){G.mode='title';G.top=Math.max(G.top,G.score);}break;
  }
  prev.jump=keys.jump;prev.run=keys.run;prev.start=keys.start;press.jump=press.run=press.start=false;
  musicUpdate();
}

/* ---------------- render ---------------- */
function drawTile(id,sx,sy,tiles,f){
  switch(id){
    case GND:ctx.drawImage(tiles.ground,sx,sy);break;
    case BRK:ctx.drawImage(tiles.brick,sx,sy);break;
    case QB:ctx.drawImage(tiles.qblock[f.q],sx,sy);break;
    case USED:ctx.drawImage(tiles.used,sx,sy);break;
    case STR:ctx.drawImage(tiles.stair,sx,sy);break;
    case COIN:ctx.drawImage(SPR.coin[f.c],sx,sy);break;
    case PTL:ctx.drawImage(PIPE.top,sx,sy);break;
    case PBL:ctx.drawImage(PIPE.body,sx,sy);break;
  }
}
function drawEntity(e,cam){
  const sx=Math.round(e.x)-cam,sy=Math.round(e.y);let img=null;
  switch(e.type){
    case 'goomba':img=e.state==='flat'?SPR.goombaFlat:SPR.goomba[(e.t>>3)&1];break;
    case 'koopa':img=SPR.koopa[e.dir>0?0:1][(e.t>>3)&1];break;
    case 'shell':img=SPR.shell;break;
    case 'mushroom':img=SPR.mushroom;break;
    case '1up':img=SPR.oneup;break;
    case 'flower':img=SPR.flower[(G.frame>>2)&3];break;
    case 'star':img=SPR.star[(G.frame>>2)&3];break;
    case 'fire':ctx.save();ctx.translate(sx+4,sy+4);ctx.rotate(e.t*0.4*e.dir);ctx.drawImage(SPR.fire,-4,-4);ctx.restore();return;
  }
  if(!img)return;
  if(e.state==='flip'){ctx.save();ctx.translate(sx,sy+img.height);ctx.scale(1,-1);ctx.drawImage(img,0,0);ctx.restore();}
  else if(e.state==='wake'&&((e.t>>2)&1)){ctx.drawImage(img,sx+1,sy);}
  else ctx.drawImage(img,sx,sy);
}
function drawMario(cam){
  if(M.state==='win')return;
  if(M.inv>0&&((G.frame>>1)&1))return;
  let big=M.big,frame=M.frame,pal=M.fire?'fire':'normal',dir=M.dir;
  const st=M.state;
  if(st==='grow'||st==='shrink'){
    const ph=(M.stateT>>2)&1;frame='stand';
    if(M.growKind==='fire'){big=true;pal=ph?'fire':'normal';}
    else{big=(st==='grow')?!!ph:!ph;pal=M.fire?'fire':'normal';}
  }
  if(M.star>0&&(M.star>60||((G.frame>>2)&1)))pal='star'+((G.frame>>1)&3);
  if(st==='die'){frame='die';big=false;}
  if(st==='normal'&&M.skid)dir=-M.dir;
  if(st==='normal'&&M.throwT>0&&big)frame='skid',dir=-M.dir;
  const img=marioSprite(big,frame,pal,dir);
  ctx.drawImage(img,Math.round(M.x)-2-cam,Math.round(M.y+M.h)-img.height);
}
function pad(n,w){let s=String(n);while(s.length<w)s='0'+s;return s;}
function drawHUD(){
  drawText('MARIO',24,6);drawText(pad(G.score,6),24,18);
  ctx.fillStyle='#f8b800';ctx.fillRect(90,19,4,8);ctx.fillStyle='#a05000';ctx.fillRect(89,20,1,6);ctx.fillRect(94,20,1,6);ctx.fillRect(90,18,4,1);ctx.fillRect(90,27,4,1);
  drawText('x'+pad(G.coins,2),98,18);
  drawText('WORLD',144,6);drawText(' 1-1',144,18);
  drawText('TIME',208,6);drawText(pad(G.time,3),208,18);
}
function drawWorld(){
  const wd=G.world,cam=Math.floor(G.cam),th=THEMES[wd.theme],tiles=TILES[wd.theme];
  const f={q:[0,0,0,0,0,1,2,1][(G.frame>>3)&7],c:[0,0,1,2,1][Math.floor(G.frame/6)%5]};
  ctx.fillStyle=th.sky;ctx.fillRect(0,0,W,H);
  for(const d of wd.deco){const sx=d.x-cam;if(sx>W||sx<-96)continue;
    const img=d.k==='hillB'?HILL_BIG:d.k==='hillS'?HILL_SMALL:d.k==='bush'?BUSHES[d.n-1]:CLOUDS[d.n-1];ctx.drawImage(img,sx,d.y);}
  if(!wd.bonus){
    ctx.drawImage(CASTLE,LEVEL.castle*T-cam,8*T);
    const px=POLE_X-cam;ctx.fillStyle='#30a030';ctx.fillRect(px-1,T+8,2,11*T-8);ctx.fillStyle='#80d010';ctx.fillRect(px-1,T+8,1,11*T-8);
    circ(ctx,px,T+4,4,'#30a030');circ(ctx,px-1,T+3,2,'#80d010');
    const fy=(M.state==='flag'||M.state==='flagHop'||M.state==='walk'||M.state==='win')?M.flagY:2*T+4;
    ctx.drawImage(FLAG,px-15,fy);
  }
  for(const e of wd.entities)if(e.emerge>0)drawEntity(e,cam);
  if(M.behind)drawMario(cam);
  const x0=Math.max(0,Math.floor(cam/T)-1),x1=Math.min(wd.w-1,Math.floor((cam+W-1)/T));
  for(let ty=0;ty<ROWS;ty++)for(let tx=x0;tx<=x1;tx++){
    const id=wd.tiles[ty*wd.w+tx];if(!id||id===HID)continue;
    let b=false;for(const bb of wd.bounces)if(bb.x===tx&&bb.y===ty){b=true;break;}
    if(b)continue;drawTile(id,tx*T-cam,ty*T,tiles,f);
  }
  for(const bb of wd.bounces){const id=tget(wd,bb.x,bb.y);const off=Math.round(8*Math.sin(Math.PI*bb.t/12));drawTile(id,bb.x*T-cam,bb.y*T-off,tiles,f);}
  if(wd.bonus)ctx.drawImage(SPIPE,14*T-cam,11*T);
  for(const e of wd.entities)if(!(e.emerge>0))drawEntity(e,cam);
  if(!M.behind)drawMario(cam);
  for(const fx of wd.effects){const sx=Math.round(fx.x)-cam,sy=Math.round(fx.y);
    if(fx.k==='score')drawText(fx.text,sx,sy,'#fff');
    else if(fx.k==='coinpop')ctx.drawImage(SPR.coin[[0,1,2,1][(fx.t>>1)&3]],sx,sy);
    else if(fx.k==='frag')ctx.drawImage(wd.theme==='under'?SPR.fragU:SPR.frag,sx,sy);
    else if(fx.k==='boom'||fx.k==='sparkle')ctx.drawImage(SPR.boom[fx.t<6?0:fx.t<12?1:2],sx,sy);
  }
  drawHUD();
}
function render(){
  switch(G.mode){
    case 'title':{
      ctx.fillStyle='#5c94fc';ctx.fillRect(0,0,W,H);
      ctx.drawImage(HILL_BIG,0,13*T-42);ctx.drawImage(BUSHES[2],176,13*T-20);ctx.drawImage(CLOUDS[1],40,40);ctx.drawImage(CLOUDS[0],180,24);
      for(let x=0;x<16;x++){ctx.drawImage(TILES.over.ground,x*T,13*T);ctx.drawImage(TILES.over.ground,x*T,14*T);}
      ctx.fillStyle='#000';ctx.fillRect(30,50,196,72);ctx.fillStyle='#d83c28';ctx.fillRect(32,52,192,68);ctx.fillStyle='#f8b878';ctx.fillRect(36,56,184,60);
      drawText('SUPER',60,62,'#d83c28');drawText('PLUMBER',124,62,'#d83c28');drawTextC('WORLD 1-1',80,'#6a3a10');
      drawTextC('A FROM-SCRATCH TRIBUTE',98,'#6a3a10');
      ctx.drawImage(marioSprite(false,'stand','normal',1),56,12*T);ctx.drawImage(SPR.goomba[0],150,12*T);ctx.drawImage(TILES.over.qblock[0],112,9*T);
      if((G.frame>>4)&1)drawTextC(isTouch?'TAP TO START':'PRESS ENTER',136,'#fff');
      drawTextC('ARROWS/WASD MOVE  Z/SPACE JUMP',152,'#fff');drawTextC('X/SHIFT RUN OR FIRE  M MUTE',164,'#fff');
      drawTextC('DOWN ENTERS PIPES',176,'#fff');
      drawText('MARIO',24,6);drawText('TOP-'+pad(G.top,6),24,18);
      break;}
    case 'pre':{
      ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);drawHUD();
      drawTextC('WORLD 1-1',96,'#fff');ctx.drawImage(marioSprite(false,'stand','normal',1),96,118);drawText('x  '+G.lives,120,122,'#fff');
      break;}
    case 'over':{ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);drawHUD();drawTextC('GAME OVER',110,'#fff');break;}
    case 'play':case 'win':{
      drawWorld();
      if(G.paused)drawTextC('PAUSED',112,'#fff');
      if(G.mode==='win'&&G.cleared){ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(40,88,176,56);drawTextC('COURSE CLEAR!',100,'#fff');drawTextC('SCORE '+pad(G.score,6),114,'#f8d838');if((G.frame>>4)&1)drawTextC(isTouch?'TAP TO CONTINUE':'PRESS ENTER',128,'#fff');}
      break;}
  }
}

/* ---------------- main loop ---------------- */
let last=0,acc=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last)last=ts;let dt=(ts-last)/1000;last=ts;if(dt>0.25)dt=0.25;acc+=dt;
  let n=0;while(acc>=1/60&&n<4){step();acc-=1/60;n++;}if(n===4)acc=0;
  render();
}
G.fireworks=0;
requestAnimationFrame(loop);
</script>
