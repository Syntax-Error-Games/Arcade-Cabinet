<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Username Generator</title>

  <style>
    :root {
      --bg-1: #121826;
      --bg-2: #263e70;
      --card: rgba(20, 27, 43, 0.92);
      --card-light: #2a3653;
      --text: #f5f7ff;
      --muted: #b8c2da;
      --accent: #73e8a7;
      --accent-dark: #36b970;
      --border: rgba(255, 255, 255, 0.14);
      --danger: #ff6e7c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(115, 232, 167, 0.22), transparent 35%),
        radial-gradient(circle at bottom right, rgba(109, 134, 255, 0.30), transparent 40%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    #app {
      width: min(100%, 720px);
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.42);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 5vw, 2.3rem);
    }

    .subtitle {
      margin: 8px 0 24px;
      color: var(--muted);
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .select-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
    }

    select,
    input {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      color: var(--text);
      background: var(--card-light);
      font: inherit;
    }

    select:focus,
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(115, 232, 167, 0.16);
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-light);
      cursor: pointer;
    }

    .check-row input {
      width: auto;
      min-height: auto;
      accent-color: var(--accent);
    }

    .check-row label {
      color: var(--text);
      cursor: pointer;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      min-height: 44px;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      color: #092414;
      background: var(--accent);
      font: inherit;
      font-weight: 800;
      transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    }

    button:hover {
      background: #9af2bf;
      box-shadow: 0 8px 20px rgba(115, 232, 167, 0.2);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0) scale(0.97);
    }

    .secondary-btn {
      color: var(--text);
      background: #465577;
    }

    .secondary-btn:hover {
      background: #5b6f9c;
    }

    .danger-btn {
      color: white;
      background: #b94354;
    }

    .danger-btn:hover {
      background: var(--danger);
    }

    #output {
      display: grid;
      place-items: center;
      min-height: 82px;
      margin-top: 20px;
      padding: 14px;
      overflow-wrap: anywhere;
      border: 1px solid rgba(115, 232, 167, 0.42);
      border-radius: 12px;
      color: var(--accent);
      background: rgba(0, 0, 0, 0.22);
      font-size: clamp(1.25rem, 4vw, 1.9rem);
      font-weight: 800;
      text-align: center;
    }

    #message {
      min-height: 20px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
    }

    .results-title,
    .favorites-title {
      margin: 24px 0 10px;
      font-size: 1rem;
    }

    #extra-results,
    #favorites-list {
      display: grid;
      gap: 8px;
    }

    .result-item,
    .favorite-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .name-button {
      flex: 1;
      min-width: 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      color: inherit;
      background: transparent;
      box-shadow: none;
      font-weight: 700;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .name-button:hover {
      color: var(--accent);
      background: transparent;
      box-shadow: none;
      transform: none;
    }

    .small-btn {
      min-height: 32px;
      padding: 5px 9px;
      color: var(--text);
      background: #465577;
      font-size: 0.8rem;
    }

    .small-btn:hover {
      background: #5b6f9c;
      box-shadow: none;
      transform: none;
    }

    .empty-state {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    @media (max-width: 620px) {
      body {
        padding: 12px;
      }

      #app {
        padding: 18px;
      }

      .category-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main id="app">
    <h1>Username Generator</h1>
    <p class="subtitle">Pick up to four word categories, then generate a new username.</p>

    <div class="category-grid">
      <div class="select-group">
        <label for="choice1">Word 1</label>
        <select id="choice1"></select>
      </div>

      <div class="select-group">
        <label for="choice2">Word 2</label>
        <select id="choice2"></select>
      </div>

      <div class="select-group">
        <label for="choice3">Word 3</label>
        <select id="choice3"></select>
      </div>

      <div class="select-group">
        <label for="choice4">Word 4</label>
        <select id="choice4"></select>
      </div>
    </div>

    <div class="options">
      <div class="select-group">
        <label for="separator">Separator</label>
        <select id="separator">
          <option value="">No separator</option>
          <option value="_">Underscore _</option>
          <option value="-">Dash -</option>
          <option value=".">Dot .</option>
        </select>
      </div>

      <div class="select-group">
        <label for="number-style">Number style</label>
        <select id="number-style">
          <option value="random">Random number (0–999)</option>
          <option value="two-digit">Two digits (00–99)</option>
          <option value="none">No number</option>
        </select>
      </div>

      <div class="check-row">
        <input type="checkbox" id="capitalize" checked>
        <label for="capitalize">Capitalize words</label>
      </div>

      <div class="check-row">
        <input type="checkbox" id="avoid-duplicates" checked>
        <label for="avoid-duplicates">Avoid repeated words</label>
      </div>
    </div>

    <div class="button-row">
      <button id="generate-btn" type="button">Generate username</button>
      <button id="generate-five-btn" class="secondary-btn" type="button">Generate 5</button>
      <button id="copy-btn" class="secondary-btn" type="button">Copy</button>
      <button id="favorite-btn" class="secondary-btn" type="button">★ Save favorite</button>
    </div>

    <div id="output" aria-live="polite">Your username will appear here</div>
    <p id="message"></p>

    <h2 class="results-title">More ideas</h2>
    <div id="extra-results">
      <div class="empty-state">Press “Generate 5” for more suggestions.</div>
    </div>

    <h2 class="favorites-title">Saved favorites</h2>
    <div id="favorites-list">
      <div class="empty-state">No saved usernames yet.</div>
    </div>
  </main>

  <script>
    const categories = [
      "plant",
      "color",
      "weather",
      "speed",
      "animal",
      "people",
      "space",
      "gaming",
      "mood",
      "nothing"
    ];

    const words = {
      plant: ["grass", "tree", "flower", "eggplant", "rose", "fern", "cactus", "moss", "ivy"],
      color: ["red", "green", "blue", "white", "violet", "golden", "crimson", "silver"],
      weather: ["rain", "storm", "sun", "cloud", "thunder", "mist", "frost", "blizzard"],
      speed: ["fast", "slow", "sluggish", "lightspeed", "speedy", "turbo", "swift", "hyper"],
      animal: ["tortoise", "turtle", "crow", "fox", "otter", "wolf", "gecko", "raven"],
      people: ["johann", "milo", "benji", "charlie", "ramos", "herrick"],
      space: ["cosmic", "nova", "nebula", "orbit", "comet", "lunar", "stellar", "void"],
      gaming: ["pixel", "arcade", "quest", "glitch", "boss", "level", "respawn", "gamer"],
      mood: ["enigmatic", "grumpy", "funky", "chill", "chaotic", "sneaky", "mighty", "sleepy"],
      nothing: [""]
    };

    const selects = [
      document.getElementById("choice1"),
      document.getElementById("choice2"),
      document.getElementById("choice3"),
      document.getElementById("choice4")
    ];

    const separatorSelect = document.getElementById("separator");
    const numberStyleSelect = document.getElementById("number-style");
    const capitalizeCheckbox = document.getElementById("capitalize");
    const avoidDuplicatesCheckbox = document.getElementById("avoid-duplicates");

    const output = document.getElementById("output");
    const message = document.getElementById("message");
    const extraResults = document.getElementById("extra-results");
    const favoritesList = document.getElementById("favorites-list");

    let currentUsername = "";

    function fillCategoryMenus() {
      selects.forEach((select, selectIndex) => {
        select.innerHTML = "";

        categories.forEach((category) => {
          const option = document.createElement("option");
          option.value = category;
          option.textContent = category.charAt(0).toUpperCase() + category.slice(1);
          select.appendChild(option);
        });

        const defaults = ["gaming", "animal", "color", "nothing"];
        select.value = defaults[selectIndex];
      });
    }

    function randomItem(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function capitalizeWord(word) {
      if (!word) return "";
      return word.charAt(0).toUpperCase() + word.slice(1);
    }

    function createNumber() {
      const style = numberStyleSelect.value;

      if (style === "none") {
        return "";
      }

      if (style === "two-digit") {
        return String(Math.floor(Math.random() * 100)).padStart(2, "0");
      }

      return String(Math.floor(Math.random() * 1000));
    }

    function generateUsername() {
      const chosenWords = [];
      const selectedCategories = selects.map((select) => select.value);

      selectedCategories.forEach((category) => {
        const possibleWords = words[category];

        if (category === "nothing") {
          return;
        }

        let chosenWord = randomItem(possibleWords);
        let attempts = 0;

        while (
          avoidDuplicatesCheckbox.checked &&
          chosenWords.includes(chosenWord) &&
          attempts < 20
        ) {
          chosenWord = randomItem(possibleWords);
          attempts++;
        }

        chosenWords.push(chosenWord);
      });

      if (chosenWords.length === 0) {
        return "Choose at least one category";
      }

      const separator = separatorSelect.value;

      const formattedWords = chosenWords.map((word) => {
        return capitalizeCheckbox.checked ? capitalizeWord(word) : word.toLowerCase();
      });

      return formattedWords.join(separator) + createNumber();
    }

    function showUsername(username) {
      currentUsername = username;
      output.textContent = username;
      message.textContent = "Click Generate again for another result.";
    }

    function generateOne() {
      showUsername(generateUsername());
    }

    function generateFive() {
      extraResults.innerHTML = "";

      const generatedNames = new Set();

      while (generatedNames.size < 5) {
        generatedNames.add(generateUsername());
      }

      generatedNames.forEach((username) => {
        const row = document.createElement("div");
        row.className = "result-item";

        const chooseButton = document.createElement("button");
        chooseButton.className = "name-button";
        chooseButton.type = "button";
        chooseButton.textContent = username;
        chooseButton.title = "Use this username";

        chooseButton.addEventListener("click", () => {
          showUsername(username);
        });

        const copySmallButton = document.createElement("button");
        copySmallButton.className = "small-btn";
        copySmallButton.type = "button";
        copySmallButton.textContent = "Copy";

        copySmallButton.addEventListener("click", () => {
          copyText(username);
        });

        row.append(chooseButton, copySmallButton);
        extraResults.appendChild(row);
      });

      message.textContent = "Click a suggestion to use it.";
    }

    async function copyText(text) {
      if (!text || text === "Your username will appear here") {
        message.textContent = "Generate a username first.";
        return;
      }

      try {
        await navigator.clipboard.writeText(text);
        message.textContent = `Copied “${text}” to your clipboard.`;
      } catch {
        message.textContent = "Could not copy automatically. Select and copy the text manually.";
      }
    }

    function getFavorites() {
      try {
        return JSON.parse(localStorage.getItem("usernameFavorites")) || [];
      } catch {
        return [];
      }
    }

    function saveFavorites(favorites) {
      localStorage.setItem("usernameFavorites", JSON.stringify(favorites));
    }

    function addFavorite() {
      if (!currentUsername || currentUsername === "Choose at least one category") {
        message.textContent = "Generate a valid username first.";
        return;
      }

      const favorites = getFavorites();

      if (favorites.includes(currentUsername)) {
        message.textContent = "That username is already saved.";
        return;
      }

      favorites.unshift(currentUsername);
      saveFavorites(favorites);
      renderFavorites();
      message.textContent = `Saved “${currentUsername}” as a favorite.`;
    }

    function renderFavorites() {
      const favorites = getFavorites();
      favoritesList.innerHTML = "";

      if (favorites.length === 0) {
        favoritesList.innerHTML = '<div class="empty-state">No saved usernames yet.</div>';
        return;
      }

      favorites.forEach((username) => {
        const row = document.createElement("div");
        row.className = "favorite-item";

        const nameButton = document.createElement("button");
        nameButton.className = "name-button";
        nameButton.type = "button";
        nameButton.textContent = username;
        nameButton.title = "Use this username";

        nameButton.addEventListener("click", () => {
          showUsername(username);
        });

        const deleteButton = document.createElement("button");
        deleteButton.className = "small-btn";
        deleteButton.type = "button";
        deleteButton.textContent = "Remove";

        deleteButton.addEventListener("click", () => {
          const updatedFavorites = getFavorites().filter((name) => name !== username);
          saveFavorites(updatedFavorites);
          renderFavorites();
          message.textContent = `Removed “${username}”.`;
        });

        row.append(nameButton, deleteButton);
        favoritesList.appendChild(row);
      });
    }

    document.getElementById("generate-btn").addEventListener("click", generateOne);
    document.getElementById("generate-five-btn").addEventListener("click", generateFive);
    document.getElementById("copy-btn").addEventListener("click", () => copyText(currentUsername));
    document.getElementById("favorite-btn").addEventListener("click", addFavorite);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && document.activeElement.tagName !== "SELECT") {
        generateOne();
      }
    });

    fillCategoryMenus();
    renderFavorites();
    generateOne();
  </script>
</body>
</html>
