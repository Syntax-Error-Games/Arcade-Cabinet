// ============================================================================
//  Hollowmere - a Terraria-style sandbox in one file.
//  World: 1600x400 tiles of 16px. Rendered at half resolution into a pixel
//  canvas, lit with a per-tile colour map, then scaled up with no smoothing.
// ============================================================================
const TILE=16, W=1600, H=400, ZOOM=2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, sstep=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
const SEED=(Math.random()*1e9)|0;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng=mulberry32(SEED);
const R=()=>rng(), RI=(a,b)=>a+Math.floor(rng()*(b-a+1)), RF=(a,b)=>a+rng()*(b-a);
function hash2(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul((s|0)+SEED,1274126177))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function noise2(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,sx=xf*xf*(3-2*xf),sy=yf*yf*(3-2*yf);return lerp(lerp(hash2(xi,yi,s),hash2(xi+1,yi,s),sx),lerp(hash2(xi,yi+1,s),hash2(xi+1,yi+1,s),sx),sy)}
function fbm2(x,y,o,s){let v=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){v+=noise2(x*f,y*f,s+i*7)*a;n+=a;a*=.5;f*=2}return v/n}
const noise1=(x,s)=>noise2(x,0.37,s), fbm1=(x,o,s)=>fbm2(x,0.37,o,s);
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return [c,g]}
function px(rows,pal){const h=rows.length,w=rows[0].length;const [c,g]=mkCanvas(w,h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=rows[y][x];if(ch!=='.'&&pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1)}}return c}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=clamp(Math.round(r*f),0,255);g=clamp(Math.round(g*f),0,255);b=clamp(Math.round(b*f),0,255);return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}
const rectsOverlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

const ATLAS={}, WALLTEX={}, SPR={};
function texVariant(id,v){
  const [c,g]=mkCanvas(16,16); const r=mulberry32(id*977+v*31+SEED);
  const fill=col=>{g.fillStyle=col;g.fillRect(0,0,16,16)};
  const speck=(col,n,w,h)=>{g.fillStyle=col;for(let i=0;i<n;i++)g.fillRect(Math.floor(r()*16),Math.floor(r()*16),w||1,h||1)};
  const blobs=(cols,n)=>{for(let i=0;i<n;i++){const bx=1+Math.floor(r()*11),by=1+Math.floor(r()*11);g.fillStyle=cols[1];g.fillRect(bx,by,3,3);g.fillStyle=cols[0];g.fillRect(bx,by,2,1);g.fillRect(bx,by+1,1,1);g.fillStyle=cols[2];g.fillRect(bx+2,by+2,1,1);g.fillRect(bx+1,by+2,1,1)}};
  switch(id){
    case T.DIRT: case T.GRASS: fill('#8a5a30');speck('#6e4423',14,2,1);speck('#a06c3a',8);speck('#5d3a1c',4);break;
    case T.STONE: fill('#7a7a84');speck('#62626c',12,2,1);speck('#8e8e98',8);speck('#55555e',4,1,2);break;
    case T.SAND: fill('#dcc77c');speck('#c9b066',10);speck('#ede0a0',6);speck('#b89c50',3);break;
    case T.SNOW: fill('#eef3f8');speck('#d8e2ec',8);speck('#ffffff',5);speck('#c4d0dc',3);break;
    case T.ICE: fill('#a6d8f0');speck('#8cc4e4',8,2,1);g.fillStyle='#d6f0ff';for(let i=0;i<3;i++){const sx=Math.floor(r()*12);g.fillRect(sx,i*5+1,1,1);g.fillRect(sx+1,i*5+2,1,1);g.fillRect(sx+2,i*5+3,1,1)}break;
    case T.WOOD: fill('#a3763f');g.fillStyle='#7d5630';for(let y=3;y<16;y+=4)g.fillRect(0,y,16,1);g.fillStyle='#8a6236';for(let y=0;y<4;y++)g.fillRect((y*5+v*3)%14,y*4,1,3);speck('#b98a4c',4);break;
    case T.SANDSTONE: fill('#b8925a');g.fillStyle='#9a7644';g.fillRect(0,5,16,1);g.fillRect(0,11,16,1);g.fillRect(4+v*2,0,1,5);g.fillRect(11+v,6,1,5);g.fillRect(2+v*3,12,1,4);speck('#c9a46a',5);break;
    case T.COPPER: fill('#7a7a84');speck('#62626c',10,2,1);blobs(TIER.copper,3);break;
    case T.IRON: fill('#7a7a84');speck('#62626c',10,2,1);blobs(TIER.iron,3);break;
    case T.GOLD: fill('#7a7a84');speck('#62626c',10,2,1);blobs(TIER.gold,3);break;
    case T.DEMONITE: fill('#3a2a55');speck('#2a1d40',10,2,1);blobs(TIER.demonite,3);break;
  }
  return c;
}
function buildTextures(){

const tiles=new Uint8Array(W*H), walls=new Uint8Array(W*H), liq=new Uint8Array(W*H), tvar=new Uint8Array(W*H);
const surface=new Int16Array(W);
const OCEAN=150, DESERT0=Math.floor(W*.60), DESERT1=Math.floor(W*.84), SNOW0=Math.floor(W*.12), SNOW1=Math.floor(W*.30);
let SURF_LIM=200, spawnX=0, spawnY=0;
const desertF=x=>sstep((x-(DESERT0-25))/50)*(1-sstep((x-(DESERT1-25))/50));
const snowF=x=>sstep((x-(SNOW0-25))/50)*(1-sstep((x-(SNOW1-25))/50));
function biomeName(tx,ty){
  const d=ty-surface[clamp(tx,0,W-1)];
  if(d>110)return 'Caverns'; if(d>28)return 'Underground';
  if(tx<OCEAN||tx>=W-OCEAN)return 'Ocean';
  if(desertF(tx)>.5)return 'Desert'; if(snowF(tx)>.5)return 'Snow';
  return 'Forest';
}
const tileAt=(x,y)=>(x<0||x>=W)?T.STONE:(y<0)?T.AIR:(y>=H)?T.STONE:tiles[x+y*W];
const solidAt=(x,y)=>TI[tileAt(x,y)].solid;
const wallAt=(x,y)=>(x<0||x>=W||y<0||y>=H)?0:walls[x+y*W];
const liqAt=(x,y)=>(x<0||x>=W||y<0||y>=H)?0:liq[x+y*W];
function setTile(x,y,t){if(x<0||x>=W||y<0||y>=H)return;tiles[x+y*W]=t;tvar[x+y*W]=(hash2(x,y,5)*4)|0;if(t!==T.AIR)liq[x+y*W]=0;markMap(x,y)}

function genWorld(){
  // heights
  for(let x=0;x<W;x++){
    let h=155+(fbm1(x*0.006,3,1)-.5)*70+(fbm1(x*0.03,2,2)-.5)*14+(noise1(x*0.15,3)-.5)*3;
    h=lerp(h,152+(fbm1(x*0.01,2,4)-.5)*18,desertF(x));
    h=lerp(h,142+(fbm1(x*0.008,3,5)-.5)*80,snowF(x));
    surface[x]=Math.round(h);
  }
  for(let x=0;x<OCEAN;x++){const t=sstep(x/OCEAN);surface[x]=Math.round(lerp(surface[OCEAN]+42,surface[OCEAN],t));surface[W-1-x]=Math.round(lerp(surface[W-1-OCEAN]+42,surface[W-1-OCEAN],t))}
  SURF_LIM=0;for(let x=0;x<W;x++)SURF_LIM=Math.max(SURF_LIM,surface[x]);SURF_LIM+=30;
  // fill columns
  for(let x=0;x<W;x++){
    const s=surface[x],d=desertF(x),sn=snowF(x),ocean=(x<OCEAN+8||x>=W-OCEAN-8);
    const stoneStart=20+(fbm1(x*0.05,2,6)-.5)*14;
    for(let y=s;y<H;y++){

      const blend=noise2(x*0.1,y*0.1,9);
      if(ocean){t=depth<14?T.SAND:(fbm2(x*.06,y*.06,2,8)>.6?T.SAND:T.STONE);w=depth<14?WL.SAND:WL.STONE}

  // surface lakes

    const rad=RI(7,12);for(let dx=-rad;dx<=rad;dx++){const depth=Math.round(Math.sqrt(1-(dx/rad)**2)*RI(4,7));const cx=x+dx;const top=Math.min(surface[cx],s-1);for(let y=top;y<=s+depth;y++){const i=cx+y*W;if(y>=s-1){tiles[i]=T.AIR;liq[i]=255}else{tiles[i]=T.AIR}}
      for(let fl=s+depth+1;fl<s+depth+4&&fl<H;fl++){const i=cx+fl*W;if(!TI[tiles[i]].solid){tiles[i]=T.DIRT;liq[i]=0}}
    }lakes++}
  // underground pools: fill bounded pockets
  for(let tries=0;tries<260;tries++){const x=RI(20,W-20),y=RI(surface[x]+35,H-12);if(tiles[x+y*W]!==T.AIR||!solidAt(x,y+1))continue;
    const seen=new Set(),st=[[x,y]],cells=[];let ok=true;

// ---------------------------------------------------------------- water ----
let waterFlip=0;
function updateWater(cx,cy){
  waterFlip^=1;
  const x0=clamp(cx-120,1,W-2),x1=clamp(cx+120,1,W-2),y0=clamp(cy-80,1,H-2),y1=clamp(cy+80,1,H-2);
  for(let y=y1;y>=y0;y--){
    for(let k=x0;k<=x1;k++){const x=waterFlip?k:x1-(k-x0);const i=x+y*W;let a=liq[i];if(!a)continue;
      const bi=i+W;
      if(!TI[tiles[bi]].solid){const room=255-liq[bi];if(room>0){const m=a<room?a:room;liq[bi]+=m;a-=m}}
      if(a>0){
        const li=i-1,ri=i+1;
        const ls=TI[tiles[li]].solid,rs=TI[tiles[ri]].solid;
        if(!ls){const n=liq[li];if(n<a){const f=Math.max(1,(a-n)>>2);const m=Math.min(f,a);liq[li]=n+m;a-=m}}
        if(a>0&&!rs){const n=liq[ri];if(n<a){const f=Math.max(1,(a-n)>>2);const m=Math.min(f,a);liq[ri]=n+m;a-=m}}
      }

}

  const svx=e.vx/steps,svy=e.vy/steps;e.hitWall=false;e.onGround=false;

    if(svx!==0){const y0=Math.floor(e.y/TILE),y1=Math.floor((e.y+e.h-0.01)/TILE);
      if(svx>0){const tx=Math.floor((nx+e.w)/TILE);for(let ty=y0;ty<=y1;ty++)if(solidAt(tx,ty)){nx=tx*TILE-e.w-0.01;e.vx=0;e.hitWall=true;break}}
      else{const tx=Math.floor(nx/TILE);for(let ty=y0;ty<=y1;ty++)if(solidAt(tx,ty)){nx=(tx+1)*TILE+0.01;e.vx=0;e.hitWall=true;break}}
    }
    e.x=nx;
    let ny=e.y+svy;const x0=Math.floor(e.x/TILE),x1=Math.floor((e.x+e.w-0.01)/TILE);
    if(svy>0){const ty=Math.floor((ny+e.h)/TILE);const pb=e.y+e.h;for(let tx=x0;tx<=x1;tx++){const t=tileAt(tx,ty);if(TI[t].solid||(TI[t].plat&&!e.drop&&pb<=ty*TILE+0.5)){ny=ty*TILE-e.h-0.01;e.vy=0;e.onGround=true;break}}}
    else if(svy<0){const ty=Math.floor(ny/TILE);for(let tx=x0;tx<=x1;tx++)if(solidAt(tx,ty)){ny=(ty+1)*TILE+0.01;e.vy=0;break}}
    e.y=ny;

  }
  if(e.x<TILE)e.x=TILE;if(e.x>(W-1)*TILE-e.w)e.x=(W-1)*TILE-e.w;if(e.y>(H-2)*TILE-e.h){e.y=(H-2)*TILE-e.h;e.vy=0;e.onGround=true}
  const cx=Math.floor((e.x+e.w/2)/TILE),cy=Math.floor((e.y+e.h/2)/TILE);e.inWater=liqAt(cx,cy)>60||liqAt(cx,Math.floor((e.y+e.h-2)/TILE))>60;

function respawn(){const p=player;p.dead=false;p.hp=p.maxHp;p.mana=p.maxMana;p.x=spawnX*TILE+2;p.y=spawnY*TILE;p.vx=p.vy=0;p.inv_t=90;unstick(p);p.fallStart=0}

// ---------------------------------------------------------------- hook ----
function fireHook(){const p=player;if(!hasHook())return;releaseHook();const ang=Math.atan2(mouse.wy-(p.y+p.h/2),mouse.wx-(p.x+p.w/2));p.hook={x:p.x+p.w/2,y:p.y+p.h/2,vx:Math.cos(ang)*13,vy:Math.sin(ang)*13,latched:false,pinned:false,dist:0};sfx('hook')}
function hasHook(){for(const s of player.inv)if(s&&ITEMS[s.id].kind==='hook')return true;return false}
function releaseHook(){player.hook=null}
function updateHook(){const p=player,h=p.hook;if(!h)return;
  if(!h.latched){for(let s=0;s<4;s++){h.x+=h.vx/4;h.y+=h.vy/4;h.dist+=Math.hypot(h.vx,h.vy)/4;const tx=Math.floor(h.x/TILE),ty=Math.floor(h.y/TILE);if(solidAt(tx,ty)){h.latched=true;h.tx=tx;h.ty=ty;sfx('hooklatch');break}}
    if(!h.latched&&h.dist>TILE*22)releaseHook()}
  else{if(!solidAt(h.tx,h.ty)||Math.hypot(h.x-p.x,h.y-p.y)>TILE*40)releaseHook()}
}
function updateHookPull(){const p=player,h=p.hook;const px=p.x+p.w/2,py=p.y+p.h/2;const dx=h.x-px,dy=h.y-py;const d=Math.hypot(dx,dy);
  if(d<14||h.pinned){h.pinned=true;p.vx=0;p.vy=0;p.fallStart=0;const left=keys['KeyA']||keys['ArrowLeft'],right=keys['KeyD']||keys['ArrowRight'];if(left||right){p.vx=(left?-1:1)*1.2}return}
  p.vx=dx/d*10;p.vy=dy/d*10;
}

function damageEnemy(e,dmg,kdir,crit){dmg=Math.max(1,Math.round((dmg-e.def*0.5)*RF(0.9,1.1)*(crit?2:1)));e.hp-=dmg;e.hitT=8;if(!e.boss){e.vx=kdir*e.kb*4;e.vy=-e.kb*3}
  texts.push({x:e.x+e.w/2+RF(-4,4),y:e.y-4,txt:''+dmg,col:crit?'#ff9a2a':'#ffd23c',life:50,vy:-0.9,scale:crit?1.4:1});
  const col=e.blood||'#c02020';for(let k=0;k<6;k++)parts.push({x:e.x+RF(0,e.w),y:e.y+RF(0,e.h),vx:RF(-2,2)+kdir,vy:RF(-2.5,0),life:30,col,size:2,grav:1});
  sfx(e.boss?'bosshit':'hit');
  if(e.hp<=0)killEnemy(e)}
function killEnemy(e){e.dead=true;G.kills++;const col=e.blood||'#c02020';for(let k=0;k<18;k++)parts.push({x:e.x+RF(0,e.w),y:e.y+RF(0,e.h),vx:RF(-3,3),vy:RF(-4,0),life:50,col,size:3,grav:1});
  if(e.drops)for(const [key,a,b,ch]of e.drops)if(R()<ch)spawnDrop(e.x+e.w/2,e.y+e.h/2,I[key],RI(a,b));
  if(R()<0.1&&!e.boss)spawnDrop(e.x+e.w/2,e.y+e.h/2,I.HEART,1);
  sfx('kill');
  if(e.boss)bossDied(e)}
function meleeCheck(){const p=player,s=p.swing;const it=ITEMS[s.item];const reach=it.kind==='short'?34:48;const r={x:p.dir>0?p.x+p.w/2:p.x+p.w/2-reach,y:p.y-14,w:reach,h:p.h+22};
  for(const e of enemies){if(e.dead||s.hit.has(e))continue;if(rectsOverlap(r,e)){s.hit.add(e);damageEnemy(e,it.dmg,p.dir,R()<0.05)}}
  if(boss&&!boss.dead&&!s.hit.has(boss)&&rectsOverlap(r,boss)){s.hit.add(boss);damageEnemy(boss,it.dmg,p.dir,R()<0.05)}
  // swords also cut tall grass
  if(it.kind==='sword'){const tx0=Math.floor(r.x/TILE),tx1=Math.floor((r.x+r.w)/TILE),ty0=Math.floor(r.y/TILE),ty1=Math.floor((r.y+r.h)/TILE);for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++)if(tileAt(tx,ty)===T.TALLGRASS){setTile(tx,ty,T.AIR);for(let k=0;k<3;k++)parts.push({x:tx*TILE+8,y:ty*TILE+10,vx:RF(-1,1),vy:RF(-1.5,0),life:25,col:'#5cb849',size:2,grav:1})}}
}

function spawnEnemy(type,x,y){const d=ENEMY[type];const e={type,name:d.name,x,y,w:d.w,h:d.h,vx:0,vy:0,hp:d.hp,maxHp:d.hp,dmg:d.dmg,def:d.def,kind:d.kind,speed:d.speed||1,kb:d.kb,drops:d.drops,blood:d.blood,dir:1,t:RI(0,60),anim:0,hitT:0,dead:false,life:0,servant:!!d.servant,col:d.col,col2:d.col2,erratic:d.erratic,wanderT:0,wx:0,wy:0};enemies.push(e);return e}
function trySpawnEnemies(){
  const p=player;if(p.dead)return;
  const night=!isDay();
  const ptx=Math.floor(p.x/TILE),pty=Math.floor(p.y/TILE);
  const under=pty-surface[clamp(ptx,0,W-1)]>20;
  const cap=boss?3:(under?6:(night?7:4));
  let n=0;for(const e of enemies)if(!e.servant)n++;
  if(n>=cap||R()>(night?0.045:0.03))return;
  const side=R()<0.5?-1:1;const halfW=IW/2/TILE;const tx=ptx+side*RI(Math.floor(halfW)+6,Math.floor(halfW)+30);if(tx<3||tx>=W-3)return;
  const ty=pty+RI(-Math.floor(IH/2/TILE)-4,Math.floor(IH/2/TILE)+4);if(ty<2||ty>=H-3)return;
  const bx=tx;const bio=biomeName(bx,ty);
  let type;
  if(under){type=R()<0.5?'bat':(pty-surface[ptx]>90?'skeleton':(R()<0.5?'slime_blue':'zombie'))}
  else if(night){type=R()<0.55?'zombie':'demon_eye'}
  else{type=bio==='Desert'?'slime_sand':bio==='Snow'?'slime_ice':(R()<0.7?'slime_green':'slime_blue')}
  const d=ENEMY[type];
  if(d.kind==='flyer'){let ok=true;for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++)if(solidAt(tx+dx,ty+dy))ok=false;if(!ok)return;if(liqAt(tx,ty))return;spawnEnemy(type,tx*TILE,ty*TILE);return}
  // ground spawn: find floor below
  for(let y=ty;y<Math.min(H-3,ty+40);y++){if(solidAt(tx,y+1)&&!solidAt(tx,y)&&!solidAt(tx,y-1)&&!solidAt(tx+1,y)&&!solidAt(tx+1,y-1)&&!liqAt(tx,y)){if(!under&&y>surface[tx]+25)return;spawnEnemy(type,tx*TILE+1,(y+1)*TILE-d.h-0.1);return}}
}
function updateEnemies(){
  const p=player;
  for(const e of enemies){if(e.dead)continue;e.life++;e.t++;if(e.hitT>0)e.hitT--;
    const dx=(p.x+p.w/2)-(e.x+e.w/2),dy=(p.y+p.h/2)-(e.y+e.h/2),dist=Math.hypot(dx,dy);
    if(dist>TILE*110||(e.servant&&!boss)){e.dead=true;continue}
    if(e.kind==='slime'){
      e.vy+=0.36;if(e.vy>10)e.vy=10;if(e.inWater){e.vy*=0.8}
      if(e.onGround){e.vx*=0.7;if(e.t>RI(50,90)&&!p.dead){e.t=0;const big=R()<0.3;e.vx=Math.sign(dx||1)*(big?3.2:2)*RF(0.8,1.2);e.vy=big?-7.5:-5.5;e.dir=e.vx>0?1:-1}}
      moveEntity(e);
    } else if(e.kind==='walker'){
      e.vy+=0.36;if(e.vy>10)e.vy=10;if(e.inWater)e.vy*=0.85;
      if(!p.dead&&(dist<TILE*40||e.life>60)){e.dir=dx>0?1:-1;const tgt=e.dir*e.speed;e.vx+=(tgt-e.vx)*0.1}else e.vx*=0.9;
      if(e.onGround&&(e.hitWall||(Math.abs(e.vx)<0.2&&Math.abs(dx)>20))){const tx=Math.floor((e.x+e.w/2)/TILE)+e.dir;const ty=Math.floor((e.y+e.h)/TILE);if(solidAt(tx,ty-1)||solidAt(tx,ty-2))e.vy=-7.5}
      if(e.onGround&&dy<-TILE*3&&Math.abs(dx)<TILE*3&&R()<0.02)e.vy=-7.5;
      moveEntity(e);e.anim+=Math.abs(e.vx)*0.15;
    } else if(e.kind==='flyer'){
      e.gravity=0;
      if(e.erratic){e.wanderT--;if(e.wanderT<=0){e.wanderT=RI(15,40);e.wx=RF(-1,1);e.wy=RF(-1,1)}
        e.vx+=e.wx*0.25+Math.sign(dx)*0.12;e.vy+=e.wy*0.25+Math.sign(dy)*0.12;}
      else{const ax=dx/(dist||1),ay=dy/(dist||1);const acc=e.servant?0.22:0.09;e.vx+=ax*acc+Math.sin(e.t*0.1)*0.05;e.vy+=ay*acc+Math.cos(e.t*0.13)*0.05}
      const sp=Math.hypot(e.vx,e.vy);if(sp>e.speed){e.vx*=e.speed/sp;e.vy*=e.speed/sp}
      const ovx=e.vx,ovy=e.vy;moveEntity(e);if(e.vx===0&&ovx!==0)e.vx=-ovx*0.8;if(e.vy===0&&ovy!==0)e.vy=-ovy*0.8;
      e.dir=e.vx>0?1:-1;e.anim+=0.25;
    }
    // contact damage
    if(!p.dead&&p.inv_t===0&&rectsOverlap({x:e.x+1,y:e.y+1,w:e.w-2,h:e.h-2},p))hurtPlayer(e.dmg,e.name,Math.sign((p.x+p.w/2)-(e.x+e.w/2))||1);
  }
  for(let i=enemies.length-1;i>=0;i--)if(enemies[i].dead)enemies.splice(i,1);
}

// ----------------------------------------------------------------- boss ----
function summonBoss(){const p=player;boss={boss:true,name:'Eye of Cthulhu',x:p.x+RF(-1,1)*400,y:p.y-380,w:72,h:72,vx:0,vy:0,hp:1600,maxHp:1600,def:12,dmg:15,phase:1,state:'hover',t:0,charges:0,angle:0,spin:0,side:1,hitT:0,dead:false,kb:0,blood:'#c02020',servT:0,fleeing:false};
  G.bossSummoned=true;banner('Eye of Cthulhu has awoken!','It watches you from the dark');sfx('roar');G.shake=30}
function updateBoss(){const b=boss;if(!b)return;const p=player;if(b.hitT>0)b.hitT--;b.t++;
  const px=p.x+p.w/2,py=p.y+p.h/2,bx=b.x+b.w/2,by=b.y+b.h/2;const dx=px-bx,dy=py-by,dist=Math.hypot(dx,dy)||1;
  if(isDay()&&!b.fleeing){b.fleeing=true;b.state='flee';toast('The Eye of Cthulhu flees from the sunlight')}
  const p2=b.phase===2;
  if(b.state==='hover'){
    if(b.t%180===0)b.side*=-1;
    const tx=px+b.side*(p2?170:210),ty=py-(p2?120:150);const ax=(tx-bx)*0.012,ay=(ty-by)*0.012;b.vx=(b.vx+ax)*0.95;b.vy=(b.vy+ay)*0.95;const cap=p2?8:5.5;const sp=Math.hypot(b.vx,b.vy);if(sp>cap){b.vx*=cap/sp;b.vy*=cap/sp}
    b.angle=Math.atan2(dy,dx);
    if(!p2){b.servT++;if(b.servT>=70){b.servT=0;let n=0;for(const e of enemies)if(e.servant)n++;if(n<8&&!p.dead){const e=spawnEnemy('servant',bx-6,by-6);e.vx=RF(-3,3);e.vy=RF(-3,3);sfx('spawn')}}}
    if(b.t>(p2?150:240)){b.state='aim';b.t=0;b.charges=p2?5:3}
  } else if(b.state==='aim'){
    b.vx*=0.9;b.vy*=0.9;b.angle=Math.atan2(dy,dx);
    if(b.t>(p2?20:35)){b.state='dash';b.t=0;const sp=p2?15:11;b.vx=dx/dist*sp;b.vy=dy/dist*sp;b.dashAng=Math.atan2(dy,dx);sfx('dash')}
  } else if(b.state==='dash'){
    b.angle=b.dashAng;
    if(b.t>(p2?32:40)){b.charges--;b.t=0;if(b.charges>0)b.state='aim';else{b.state='hover';b.t=0}}
  } else if(b.state==='transform'){
    b.vx*=0.95;b.vy*=0.95;b.spin+=0.35;b.angle=b.spin;
    if(b.t%6===0)parts.push({x:bx+RF(-30,30),y:by+RF(-30,30),vx:RF(-2,2),vy:RF(-2,2),life:30,col:'#c02020',size:3});
    if(b.t>110){b.phase=2;b.def=0;b.dmg=23;b.state='hover';b.t=0;banner('The Eye of Cthulhu is enraged!','Phase 2');sfx('roar');G.shake=25}
  } else if(b.state==='flee'){
    b.vy-=0.3;b.vx*=0.98;if(b.y<-800){boss=null;return}
  }
  b.x+=b.vx;b.y+=b.vy;
  if(b.hp<=b.maxHp*0.5&&b.phase===1&&b.state!=='transform'){b.state='transform';b.t=0;b.spin=b.angle}
  // contact
  if(!p.dead&&p.inv_t===0&&b.state!=='transform'&&rectsOverlap({x:b.x+10,y:b.y+10,w:b.w-20,h:b.h-20},p))hurtPlayer(b.dmg,'the Eye of Cthulhu',Math.sign(dx)*-1||1);
  // trail particles when dashing
  if(b.state==='dash'&&b.t%2===0)parts.push({x:bx+RF(-20,20),y:by+RF(-20,20),vx:-b.vx*0.1,vy:-b.vy*0.1,life:20,col:'#7a1a1a',size:3});
}
function bossDied(b){boss=null;G.bossDefeated=true;banner('Eye of Cthulhu has been defeated!','The night feels a little lighter');G.shake=40;sfx('roar');
  for(let k=0;k<60;k++)parts.push({x:b.x+RF(0,b.w),y:b.y+RF(0,b.h),vx:RF(-5,5),vy:RF(-6,2),life:80,col:k%3?'#c02020':'#e8e0d8',size:4,grav:1});
  const n=RI(36,54);for(let k=0;k<n;k+=6)spawnDrop(b.x+RF(0,b.w),b.y+RF(0,b.h),I.DEMONITE_ORE,Math.min(6,n-k),RF(-3,3),RF(-5,-1));
  for(let k=0;k<3;k++)spawnDrop(b.x+RF(0,b.w),b.y+RF(0,b.h),I.LENS,1,RF(-3,3),RF(-5,-1));
  spawnDrop(b.x+b.w/2,b.y+b.h/2,I.LESSER_HEALING_POTION,3,0,-4);spawnDrop(b.x+b.w/2,b.y+b.h/2,I.GOLD_BAR,RI(3,6),1,-4);
  for(const e of enemies)if(e.servant)killEnemy(e);
}
function damageBossFromProj(pr){if(!boss||boss.dead||boss.state==='transform')return false;if(rectsOverlap(pr,boss)){damageEnemy(boss,pr.dmg,Math.sign(pr.vx)||1,R()<0.05);return true}return false}

// ---------------------------------------------------- projectiles & misc ----
function updateProjs(){
  for(const pr of projs){if(pr.dead)continue;pr.life--;if(pr.life<=0){pr.dead=true;continue}
    if(pr.grav)pr.vy+=pr.grav;
    const steps=Math.ceil(Math.max(Math.abs(pr.vx),Math.abs(pr.vy))/6)||1;
    for(let s=0;s<steps&&!pr.dead;s++){pr.x+=pr.vx/steps;pr.y+=pr.vy/steps;
      const tx=Math.floor((pr.x+pr.w/2)/TILE),ty=Math.floor((pr.y+pr.h/2)/TILE);
      if(solidAt(tx,ty)){pr.dead=true;if(pr.type==='arrow'&&R()<0.5)spawnDrop(pr.x,pr.y,I.WOODEN_ARROW,1,0,0);for(let k=0;k<4;k++)parts.push({x:pr.x,y:pr.y,vx:RF(-1.5,1.5),vy:RF(-1.5,1.5),life:15,col:pr.type==='spark'?'#ffb020':'#c8b898',size:2});break}
      if(pr.friendly){
        for(const e of enemies){if(e.dead)continue;if(rectsOverlap(pr,e)){damageEnemy(e,pr.dmg,Math.sign(pr.vx)||1,R()<0.05);pr.pierce--;if(pr.pierce<0){pr.dead=true;break}}}
        if(!pr.dead&&damageBossFromProj(pr)){pr.pierce--;if(pr.pierce<0)pr.dead=true}
      }
    }
    if(pr.type==='spark'&&G.frame%2===0)parts.push({x:pr.x+pr.w/2,y:pr.y+pr.h/2,vx:RF(-.5,.5),vy:RF(-.5,.5),life:12,col:R()<0.5?'#ffd040':'#ff7020',size:2});
  }
  for(let i=projs.length-1;i>=0;i--)if(projs[i].dead)projs.splice(i,1);
}
function updateDrops(){const p=player;
  for(const d of drops){if(d.dead)continue;d.life++;if(d.noPick>0)d.noPick--;
    const dx=(p.x+p.w/2)-(d.x+4),dy=(p.y+p.h/2)-(d.y+4),dist=Math.hypot(dx,dy);
    if(!p.dead&&d.noPick===0&&dist<56){d.vx+=dx/dist*0.8;d.vy+=dy/dist*0.8;const sp=Math.hypot(d.vx,d.vy);if(sp>7){d.vx*=7/sp;d.vy*=7/sp}}
    else{d.vy+=0.3;if(d.vy>8)d.vy=8;if(d.onGround)d.vx*=0.8;if(d.inWater){d.vy*=0.7;d.vy-=0.15}}
    moveEntity(d);
    if(!p.dead&&d.noPick===0&&dist<18){const it=ITEMS[d.id];
      if(it.kind==='instant'){p.hp=Math.min(p.maxHp,p.hp+20);texts.push({x:p.x+p.w/2,y:p.y,txt:'+20',col:'#4ae05a',life:50,vy:-0.7,scale:1});d.dead=true;sfx('pickup');continue}
      const left=addItem(d.id,d.n);if(left<d.n){const got=d.n-left;pickupText(it.name,got);sfx('pickup')}d.n=left;if(d.n<=0)d.dead=true}
    if(d.life>60*60*3)d.dead=true;
  }
  for(let i=drops.length-1;i>=0;i--)if(drops[i].dead)drops.splice(i,1);
}
function pickupText(name,n){const p=player;for(const t of texts)if(t.pick===name&&t.life>20){t.n+=n;t.txt=name+' ('+t.n+')';t.life=70;return}texts.push({x:p.x+p.w/2,y:p.y-6,txt:name+' ('+n+')',col:'#ffffff',life:70,vy:-0.4,scale:0.85,pick:name,n})}
function updateParts(){for(const q of parts){q.life--;if(q.grav){q.vy+=0.25;if(q.vy>6)q.vy=6}q.x+=q.vx;q.y+=q.vy;if(q.grav&&solidAt(Math.floor(q.x/TILE),Math.floor(q.y/TILE))){q.vy=0;q.vx*=0.5}}
  for(let i=parts.length-1;i>=0;i--)if(parts[i].life<=0)parts.splice(i,1);
  for(const t of texts){t.life--;t.y+=t.vy;t.vy*=0.96}for(let i=texts.length-1;i>=0;i--)if(texts[i].life<=0)texts.splice(i,1)}

const mining={tx:-1,ty:-1,dmg:0,cool:0};
function reachOK(tx,ty){const p=player;const dx=(tx+0.5)*TILE-(p.x+p.w/2),dy=(ty+0.5)*TILE-(p.y+p.h/2);return Math.abs(dx)<=TILE*6.5&&Math.abs(dy)<=TILE*6}
function useItemTick(){const p=player;const s=p.inv[p.sel];if(!s||p.dead||inv.open&&inv.overPanel)return;const it=ITEMS[s.id];
  if(p.useT>0)return;
  const tx=mouse.tx,ty=mouse.ty;
  const kind=it.kind;
  if(kind==='tool'||kind==='axe'||kind==='hammer'){
    if(!reachOK(tx,ty))return;p.useT=it.use;p.dir=mouse.wx>p.x+p.w/2?1:-1;p.swing={t:it.use,dur:it.use,item:it.id,hit:new Set(),tool:true};
    if(kind==='hammer'){const w=wallAt(tx,ty);if(w&&(!TI[tileAt(tx,ty)].solid)){walls[tx+ty*W]=0;markMap(tx,ty);dropTileItem(tx,ty,WALLINFO[w].drop,1);sfx('dig');for(let k=0;k<4;k++)parts.push({x:tx*TILE+8,y:ty*TILE+8,vx:RF(-1,1),vy:RF(-1,1),life:15,col:WALLINFO[w].col,size:2})}return}
    const t=tileAt(tx,ty);if(t===T.AIR)return;const ti=TI[t];
    let can=false;
    if(ti.axe)can=(kind==='axe')||(t===T.CACTUS);
    else if(kind==='tool')can=it.pick>=ti.req;
    if(!can){if(kind==='tool'&&ti.axe&&t===T.TREE)toast('Use an axe on trees');else if(kind==='tool')toast('Your pickaxe is too weak');return}
    if(ty>=H-3){toast('The bedrock will not budge');return}
    if(mining.tx!==tx||mining.ty!==ty){mining.tx=tx;mining.ty=ty;mining.dmg=0}
    mining.dmg+=kind==='axe'?45:it.pick;mining.cool=30;
    const col=ti.col||'#888';for(let k=0;k<4;k++)parts.push({x:tx*TILE+RF(2,14),y:ty*TILE+RF(2,14),vx:RF(-1.5,1.5),vy:RF(-2,-.5),life:20,col,size:2,grav:1});
    sfx(ti.axe?'chop':'dig');
    if(mining.dmg>=ti.hard){breakTile(tx,ty);mining.dmg=0;mining.tx=-1}
  } else if(kind==='block'){
    if(!reachOK(tx,ty))return;if(!canPlaceTile(tx,ty,it.tile))return;
    setTile(tx,ty,it.tile);s.n--;if(s.n<=0)p.inv[p.sel]=null;p.useT=8;sfx('place');if(it.tile===T.WORKBENCH)G.placedBench=true;if(it.tile===T.FURNACE)G.placedFurnace=true;if(it.tile===T.ANVIL)G.placedAnvil=true;
    if(it.tile===T.SAPLING)tvar[tx+ty*W]=0;
  } else if(kind==='wall'){
    if(!reachOK(tx,ty))return;if(wallAt(tx,ty)||tx<=0||tx>=W-1||ty<=0||ty>=H-1)return;
    if(!(wallAt(tx-1,ty)||wallAt(tx+1,ty)||wallAt(tx,ty-1)||wallAt(tx,ty+1)||solidAt(tx-1,ty)||solidAt(tx+1,ty)||solidAt(tx,ty-1)||solidAt(tx,ty+1)||solidAt(tx,ty)))return;
    walls[tx+ty*W]=it.wall;markMap(tx,ty);s.n--;if(s.n<=0)p.inv[p.sel]=null;p.useT=6;sfx('place');
  } else if(kind==='sword'||kind==='short'){
    p.useT=it.use;p.dir=mouse.wx>p.x+p.w/2?1:-1;p.swing={t:it.use,dur:it.use,item:it.id,hit:new Set()};sfx('swing');
  } else if(kind==='bow'){
    let ai=-1;for(let i=0;i<50;i++){const q=p.inv[i];if(q&&ITEMS[q.id].kind==='ammo'){ai=i;break}}if(ai<0){toast('No arrows');p.useT=20;return}
    const am=p.inv[ai];const ammo=ITEMS[am.id];am.n--;if(am.n<=0)p.inv[ai]=null;
    p.useT=it.use;p.dir=mouse.wx>p.x+p.w/2?1:-1;const ang=Math.atan2(mouse.wy-(p.y+p.h/2),mouse.wx-(p.x+p.w/2));
    projs.push({x:p.x+p.w/2-3,y:p.y+p.h/2-3,w:6,h:6,vx:Math.cos(ang)*10,vy:Math.sin(ang)*10,dmg:it.dmg+ammo.dmg,friendly:true,type:'arrow',life:120,grav:0.09,pierce:0,ang});sfx('arrow');
    p.swing={t:it.use,dur:it.use,item:it.id,hit:new Set(),tool:true};
  } else if(kind==='magic'){
    if(p.mana<it.mana){toast('Not enough mana');p.useT=15;return}p.mana-=it.mana;p.manaT=-40;
    p.useT=it.use;p.dir=mouse.wx>p.x+p.w/2?1:-1;const ang=Math.atan2(mouse.wy-(p.y+p.h/2),mouse.wx-(p.x+p.w/2))+RF(-0.08,0.08);
    projs.push({x:p.x+p.w/2-3,y:p.y+p.h/2-3,w:6,h:6,vx:Math.cos(ang)*7,vy:Math.sin(ang)*7,dmg:it.dmg,friendly:true,type:'spark',life:70,grav:0,pierce:1,light:[1,.6,.2]});sfx('spark');
    p.swing={t:it.use,dur:it.use,item:it.id,hit:new Set(),tool:true};
  } else if(kind==='potion'){if(!mouse.click)return;usePotion(p.sel);p.useT=20}
  else if(kind==='use'){if(!mouse.click)return;
    if(it.key==='LIFE_CRYSTAL'){if(p.maxHp>=400){toast('Your life is already at its peak');return}p.maxHp+=20;p.hp+=20;s.n--;if(s.n<=0)p.inv[p.sel]=null;sfx('potion');texts.push({x:p.x+p.w/2,y:p.y,txt:'+20 max life',col:'#ff6a9a',life:70,vy:-0.6,scale:1});for(let k=0;k<14;k++)parts.push({x:p.x+RF(0,p.w),y:p.y+RF(0,p.h),vx:RF(-1,1),vy:RF(-2,-.5),life:40,col:'#ff5c9c',size:2})}
    else if(it.key==='MANA_CRYSTAL'){if(p.maxMana>=200){toast('Your mana is already at its peak');return}p.maxMana+=20;p.mana+=20;s.n--;if(s.n<=0)p.inv[p.sel]=null;sfx('potion');texts.push({x:p.x+p.w/2,y:p.y,txt:'+20 max mana',col:'#60a0ff',life:70,vy:-0.6,scale:1})}
    p.useT=20}
  else if(kind==='summon'){if(!mouse.click)return;p.useT=30;
    if(isDay()){toast('The eye only answers at night');return}if(boss){toast('The eye is already awake');return}
    s.n--;if(s.n<=0)p.inv[p.sel]=null;summonBoss()}
  else if(kind==='hook'){if(!mouse.click)return;fireHook();p.useT=10}
}
function canPlaceTile(tx,ty,t){
  if(tx<=0||tx>=W-1||ty<=0||ty>=H-2)return false;
  const cur=tileAt(tx,ty);if(cur!==T.AIR&&!(cur===T.TALLGRASS&&TI[t].solid))return false;
  const ti=TI[t];
  if(ti.solid||ti.plat){const r={x:tx*TILE,y:ty*TILE,w:TILE,h:TILE};if(rectsOverlap(r,player)&&ti.solid)return false;for(const e of enemies)if(rectsOverlap(r,e)&&ti.solid)return false}
  if(ti.needsFloor)return solidAt(tx,ty+1);
  if(t===T.TORCH)return solidAt(tx,ty+1)||solidAt(tx-1,ty)||solidAt(tx+1,ty)||wallAt(tx,ty)>0;
  if(t===T.SAPLING){const b=tileAt(tx,ty+1);return b===T.GRASS||b===T.SNOW}
  return solidAt(tx-1,ty)||solidAt(tx+1,ty)||solidAt(tx,ty-1)||solidAt(tx,ty+1)||wallAt(tx,ty)>0||tileAt(tx,ty+1)===T.PLATFORM||tileAt(tx-1,ty)===T.PLATFORM||tileAt(tx+1,ty)===T.PLATFORM;
}
function breakTile(tx,ty){const t=tileAt(tx,ty);if(t===T.AIR)return;const ti=TI[t];
  if(t===T.TREE){// fell everything above
    let n=0;for(let y=ty;y>=0;y--){const tt=tileAt(tx,y);if(tt!==T.TREE)break;setTile(tx,y,T.AIR);n++;for(let k=0;k<3;k++)parts.push({x:tx*TILE+8,y:y*TILE+8,vx:RF(-1.5,1.5),vy:RF(-2,0),life:30,col:k?'#5a3d20':'#4f9a3a',size:2,grav:1})}
    dropTileItem(tx,ty,'WOOD',n+RI(0,2));if(R()<0.5+n*0.03)dropTileItem(tx,ty-2,'ACORN',RI(1,2));sfx('treefall');return}
  if(t===T.CACTUS){let n=0;for(let y=ty;y>=0;y--){if(tileAt(tx,y)!==T.CACTUS)break;setTile(tx,y,T.AIR);n++}dropTileItem(tx,ty,'CACTUS',n);return}
  setTile(tx,ty,T.AIR);
  if(t===T.GRASS&&R()<0.5)dropTileItem(tx,ty,'DIRT',1);else if(t===T.GRASS){dropTileItem(tx,ty,'DIRT',1)}
  else if(ti.drop)dropTileItem(tx,ty,ti.drop,1);
  // things standing on it fall away
  const above=tileAt(tx,ty-1);if(TI[above].needsFloor||above===T.TORCH&&!wallAt(tx,ty-1)&&!solidAt(tx-1,ty-1)&&!solidAt(tx+1,ty-1)||above===T.TALLGRASS||above===T.MUSHROOM||above===T.SAPLING){breakTile(tx,ty-1)}
  if(above===T.CACTUS)breakTile(tx,ty-1);
  if(above===T.TREE)breakTile(tx,ty-1);
  for(let k=0;k<6;k++)parts.push({x:tx*TILE+RF(2,14),y:ty*TILE+RF(2,14),vx:RF(-2,2),vy:RF(-3,-.5),life:25,col:ti.col||'#888',size:2,grav:1});
  sfx('break');
}

function nearStations(){const p=player;const set=new Set();const cx=Math.floor((p.x+p.w/2)/TILE),cy=Math.floor((p.y+p.h/2)/TILE);for(let y=cy-5;y<=cy+5;y++)for(let x=cx-7;x<=cx+7;x++){const st=TI[tileAt(x,y)].station;if(st)set.add(st)}return set}
function craftable(r){for(const [id,n]of r.ins)if(countItem(id)<n)return false;return true}
function craft(r){if(!craftable(r))return false;const out=ITEMS[r.out];let room=0;for(const s of player.inv){if(!s)room+=out.stack;else if(s.id===r.out)room+=out.stack-s.n}if(room<r.n){toast('Inventory full');return false}
  for(const [id,n]of r.ins)removeItem(id,n);addItem(r.out,r.n);sfx('craft');pickupText(out.name,r.n);return true}
function visibleRecipes(){const st=nearStations();const list=RECIPES.filter(r=>!r.st||st.has(r.st));list.sort((a,b)=>(craftable(b)?1:0)-(craftable(a)?1:0));return list}

const DAY_SECONDS=480;
const isDay=()=>G.hour>=4.5&&G.hour<19.5;
function daylight(){const h=G.hour;if(h<4)return 0;if(h<6.5)return sstep((h-4)/2.5);if(h<17.5)return 1;if(h<20)return 1-sstep((h-17.5)/2.5);return 0}
function skyLight(){const d=daylight();const dusk=Math.sin(d*Math.PI);const r=lerp(0.16,1,d)+dusk*0.05,g=lerp(0.18,1,d)-dusk*0.08,b=lerp(0.32,1,d)-dusk*0.22;const rain=1-G.rain*0.35;return [r*rain,g*rain,b*rain]}
function updateTime(){G.hour+=24/(DAY_SECONDS*60);if(G.hour>=24){G.hour-=24;G.day++;toast('Day '+G.day)}
  if(Math.abs(G.hour-19.5)<0.0005)toast('Night falls. Stay near the light');
  if(Math.abs(G.hour-4.5)<0.0005)toast('Dawn breaks');
  G.weatherT--;if(G.weatherT<=0){G.weatherT=RI(60,200)*60;const r=R();const prev=G.weather;G.weather=r<0.45?'Clear':r<0.7?'Cloudy':r<0.9?'Rain':'Windy';if(G.weather!==prev&&G.frame>10)toast(G.weather==='Rain'?'Rain rolls in':G.weather==='Windy'?'The wind picks up':G.weather==='Cloudy'?'Clouds gather':'The sky clears');G.windTarget=RF(-1,1)*(G.weather==='Windy'?1.6:0.6)}
  const cloudT=G.weather==='Clear'?0.25:G.weather==='Cloudy'?0.7:G.weather==='Rain'?1:0.5;G.cloud+=(cloudT-G.cloud)*0.002;G.rain+=((G.weather==='Rain'?1:0)-G.rain)*0.003;G.wind+=((G.windTarget||0.3)-G.wind)*0.002;
}
function weatherName(){const bio=biomeName(Math.floor(player.x/TILE),Math.floor(player.y/TILE));if(G.rain>0.5)return bio==='Desert'?'Sandstorm':bio==='Snow'?'Blizzard':'Rain';return G.weather==='Rain'?'Drizzle':G.weather}
function clockText(){let h=Math.floor(G.hour),m=Math.floor((G.hour-h)*60);m=Math.floor(m/5)*5;const ap=h>=12?'PM':'AM';let hh=h%12;if(hh===0)hh=12;return hh+':'+(m<10?'0':'')+m+' '+ap}

function updateAmbience(){const p=player;const ptx=Math.floor(p.x/TILE),pty=Math.floor(p.y/TILE);const bio=biomeName(ptx,pty);const surfaceLevel=pty<surface[clamp(ptx,0,W-1)]+12;
  // rain
  if(G.rain>0.05&&surfaceLevel){const n=Math.round(G.rain*6);for(let k=0;k<n;k++){const x=cam.x+RF(-40,IW+40),y=cam.y-RF(0,40);rainDrops.push({x,y,vx:G.wind*3,vy:bio==='Snow'?RF(1,2):RF(9,12),life:200,kind:bio==='Desert'?'sand':bio==='Snow'?'snow':'rain'})}}
  for(const r of rainDrops){r.life--;r.x+=r.vx+(r.kind==='snow'?Math.sin(G.frame*0.05+r.y)*0.5:0);r.y+=r.vy;const tx=Math.floor(r.x/TILE),ty=Math.floor(r.y/TILE);if(solidAt(tx,ty)||liqAt(tx,ty)>100){r.life=0;if(r.kind==='rain'&&R()<0.3)parts.push({x:r.x,y:ty*TILE-1,vx:RF(-.7,.7),vy:RF(-1,-.3),life:10,col:'#9ec8ff',size:1,grav:1})}}
  for(let i=rainDrops.length-1;i>=0;i--)if(rainDrops[i].life<=0)rainDrops.splice(i,1);
  // critters
  if(critters.length<7&&R()<0.02&&surfaceLevel&&isDay()){const x=cam.x+(R()<0.5?-30:IW+30);const tx=Math.floor(x/TILE);if(tx>3&&tx<W-3){const s=surface[tx];if(tileAt(tx,s)===T.GRASS||tileAt(tx,s)===T.SNOW){const kind=R()<0.5?'bird':'bunny';critters.push({kind,x:tx*TILE+4,y:s*TILE-8,vx:0,vy:0,w:8,h:6,t:RI(0,100),dir:1,fly:false,life:0})}}}
  for(const c of critters){c.life++;c.t++;const dx=(p.x+p.w/2)-c.x,dist=Math.abs(dx);
    if(c.kind==='bird'){if(!c.fly&&dist<70){c.fly=true;c.vy=-2;c.dir=dx>0?-1:1}if(c.fly){c.vx=c.dir*2.2;c.vy-=0.05;c.x+=c.vx;c.y+=c.vy;if(c.life>600||c.y<cam.y-100)c.dead=true}else{c.vy+=0.3;moveEntity(c);if(c.onGround&&R()<0.01){c.vx=RF(-1,1);c.dir=c.vx>0?1:-1}}}
    else{c.vy+=0.36;if(c.onGround){c.vx*=0.7;if(dist<60&&R()<0.1){c.vx=Math.sign(-dx)*2.2;c.vy=-4;c.dir=c.vx>0?1:-1}else if(R()<0.01){c.vx=RF(-1.5,1.5);c.vy=-3;c.dir=c.vx>0?1:-1}}moveEntity(c);if(c.life>1500||Math.abs(c.x-p.x)>IW)c.dead=true}
  }
  for(let i=critters.length-1;i>=0;i--)if(critters[i].dead)critters.splice(i,1);
  // fireflies at night, butterflies by day, leaves near trees
  if(surfaceLevel&&bio==='Forest'){if(!isDay()&&R()<0.15&&parts.length<400){parts.push({x:cam.x+RF(0,IW),y:(surface[clamp(Math.floor((cam.x+IW/2)/TILE),0,W-1)]-RF(1,7))*TILE,vx:RF(-.4,.4),vy:RF(-.3,.3),life:RI(120,300),col:'#d8ff60',size:1,fly:true,glow:true})}
    if(isDay()&&R()<0.05&&parts.length<400){const x=cam.x+RF(0,IW);parts.push({x,y:(surface[clamp(Math.floor(x/TILE),0,W-1)]-RF(1,5))*TILE,vx:RF(-.5,.5),vy:0,life:RI(200,400),col:['#ff9cd0','#ffe066','#9cd0ff'][RI(0,2)],size:2,fly:true,flutter:true})}}
  for(const q of parts)if(q.fly){q.vx+=RF(-.1,.1);q.vy+=RF(-.1,.1);q.vx=clamp(q.vx,-.8,.8);q.vy=clamp(q.vy,-.5,.5);if(q.flutter)q.vy+=Math.sin(G.frame*0.3)*0.1}
  // falling stars at night
  if(!isDay()&&R()<0.0025&&surfaceLevel){const x=cam.x+RF(-100,IW+100);fallingStars.push({x,y:cam.y-200,vx:RF(-2,2),vy:RF(4,6),life:600})}
  for(const s of fallingStars){s.life--;s.x+=s.vx;s.y+=s.vy;parts.push({x:s.x,y:s.y,vx:RF(-.3,.3),vy:RF(-.3,.3),life:20,col:R()<0.5?'#ffe680':'#ffffff',size:2,glow:true});const tx=Math.floor(s.x/TILE),ty=Math.floor(s.y/TILE);if(solidAt(tx,ty)||liqAt(tx,ty)>50){s.life=0;spawnDrop(s.x,ty*TILE-10,I.FALLEN_STAR,1,0,-2);for(let k=0;k<12;k++)parts.push({x:s.x,y:ty*TILE-4,vx:RF(-3,3),vy:RF(-4,0),life:40,col:'#ffe680',size:2,grav:1});sfx('star')}}
  for(let i=fallingStars.length-1;i>=0;i--)if(fallingStars[i].life<=0)fallingStars.splice(i,1);
  // stars vanish at dawn
  if(isDay()&&daylight()>0.6){for(const d of drops)if(d.id===I.FALLEN_STAR)d.dead=true}
  // saplings grow
  if(G.frame%120===0){for(let k=0;k<20;k++){const x=RI(Math.max(2,ptx-100),Math.min(W-3,ptx+100)),y=RI(Math.max(2,pty-60),Math.min(H-3,pty+60));if(tileAt(x,y)===T.SAPLING&&R()<0.3){setTile(x,y,T.AIR);const s=y+1;plantTree(x,s,RI(6,11),tileAt(x,s)===T.SNOW?1:0);if(tileAt(x,y)!==T.TREE)setTile(x,y,T.SAPLING)}}}
}

}
function drawTooltip(g,it,x,y){const lines=[];let stat='';if(it.dmg)stat+=it.dmg+' damage  ';if(it.pick)stat+=it.pick+'% pickaxe  ';if(it.def)stat+=it.def+' defense  ';if(it.mana)stat+=it.mana+' mana  ';if(it.heal)stat+='heals '+it.heal+'  ';if(stat)lines.push(stat.trim());if(it.tip)lines.push(it.tip);
  const kindName={tool:'Tool',axe:'Tool',hammer:'Tool',sword:'Melee weapon',short:'Melee weapon',bow:'Ranged weapon',magic:'Magic weapon',ammo:'Ammo',block:'Placeable',wall:'Wall',mat:'Material',potion:'Consumable',use:'Consumable',summon:'Boss summon',armor:['Helmet','Body armor','Leg armor'][it.slot],acc:'Accessory',hook:'Hook'}[it.kind];if(kindName)lines.push(kindName);
  g.font='11px Verdana';let w=g.measureText(it.name).width+20;for(const l of lines)w=Math.max(w,g.measureText(l).width+20);const h=18+lines.length*14+6;if(x+w>innerWidth)x=innerWidth-w-4;if(y+h>innerHeight)y=innerHeight-h-4;
  panel(g,x,y,w,h,0.9);txt(g,it.name,x+10,y+4,12,it.kind==='armor'||it.kind==='acc'?'#9de07a':it.dmg?'#ffb060':'#fff','left',true);let yy=y+20;for(const l of lines){txt(g,l,x+10,yy,10,'#cfd6e6','left',false,true);yy+=14}}
function wrapText(g,s,x,y,w,size,col){g.font=size+'px Verdana';const words=s.split(' ');let line='',yy=y;for(const wd of words){const t=line?line+' '+wd:wd;if(g.measureText(t).width>w&&line){txt(g,line,x,yy,size,col,'left',false);line=wd;yy+=size+3}else line=t}if(line)txt(g,line,x,yy,size,col,'left',false)}
function banner(text,sub){G.banner={text,sub:sub||'',t:0,dur:300}}
function toast(text){G.toast={text,t:180}}

// -------------------------------------------------------------- UI input ----
function uiHover(){inv.hover=null;inv.hoverCraft=null;inv.overPanel=false;if(!inv.open)return;const mx=mouse.x,my=mouse.y;
  for(let i=0;i<50;i++){const r=slotRect('inv',i);if(mx>=r.x&&mx<r.x+r.w&&my>=r.y&&my<r.y+r.h){inv.hover={kind:'inv',idx:i}}}
  for(let i=0;i<3;i++){for(const k of['armor','acc']){const r=slotRect(k,i);if(mx>=r.x&&mx<r.x+r.w&&my>=r.y&&my<r.y+r.h)inv.hover={kind:k,idx:i}}}
  for(let k=0;k<7;k++){const r=craftRect(k);if(inv.list&&inv.list[k+inv.scroll]&&mx>=r.x&&mx<r.x+r.w&&my>=r.y&&my<r.y+r.h)inv.hoverCraft=k}
  const bottom=HY+5*(SS+SP)+34+7*30+20;if(mx>=HX-8&&mx<=HX+12*(SS+SP)+30&&my>=HY-16&&my<=bottom)inv.overPanel=true;
}
function uiClick(button){if(!inv.open)return false;uiHover();
  if(inv.hover){const {kind,idx}=inv.hover;const s=slotGet(kind,idx);const c=inv.cursor;
    if(button===0){
      if(!c){if(s){inv.cursor=s;slotSet(kind,idx,null);sfx('click')}}
      else if(!s){if(slotAccepts(kind,idx,c)){slotSet(kind,idx,c);inv.cursor=null;sfx('click')}}
      else if(s.id===c.id&&ITEMS[s.id].stack>1){const m=Math.min(c.n,ITEMS[s.id].stack-s.n);s.n+=m;c.n-=m;if(c.n<=0)inv.cursor=null;sfx('click')}
      else if(slotAccepts(kind,idx,c)){slotSet(kind,idx,c);inv.cursor=s;sfx('click')}
    } else {
      if(!c&&s){const take=Math.ceil(s.n/2);inv.cursor={id:s.id,n:take};s.n-=take;if(s.n<=0)slotSet(kind,idx,null);sfx('click')}
      else if(c&&(!s||s.id===c.id&&s.n<ITEMS[s.id].stack)&&slotAccepts(kind,idx,c)){if(!s)slotSet(kind,idx,{id:c.id,n:1});else s.n++;c.n--;if(c.n<=0)inv.cursor=null;sfx('click')}
    }
    return true}
  if(inv.hoverCraft!==null&&button===0){const r=inv.list[inv.hoverCraft+inv.scroll];if(r){if(!craft(r))toast(craftable(r)?'':'Missing materials')}return true}
  if(inv.overPanel)return true;
  if(inv.cursor){// drop into world
    const c=inv.cursor;inv.cursor=null;spawnDrop(player.x+player.w/2,player.y+8,c.id,c.n,player.dir*3,-2);drops[drops.length-1].noPick=60;sfx('click');return true}
  return false}
function toggleInv(){inv.open=!inv.open;if(!inv.open&&inv.cursor){const c=inv.cursor;inv.cursor=null;const left=addItem(c.id,c.n);if(left>0)spawnDrop(player.x,player.y,c.id,left)}sfx('click')}

// ---------------------------------------------------------------- sound ----
let AC=null,lastSfx={};
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(freq,dur,type,vol,slide,delay){if(!AC)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+0.02)}
let noiseBuf=null;
function noise(dur,vol,freq,q,delay){if(!AC)return;if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}const t=AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=q?'bandpass':'lowpass';f.frequency.value=freq;if(q)f.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur+0.02)}
function sfx(n){if(!AC)return;const now=performance.now();if(lastSfx[n]&&now-lastSfx[n]<45)return;lastSfx[n]=now;
  switch(n){
    case 'jump':tone(260,0.12,'square',0.05,1.8);break;
    case 'swim':noise(0.15,0.08,900,2);break;
    case 'dig':noise(0.08,0.15,700,0);tone(120,0.06,'triangle',0.08,0.7);break;
    case 'chop':noise(0.1,0.15,1400,3);tone(200,0.08,'square',0.05,0.6);break;
    case 'break':noise(0.18,0.2,500,0);break;
    case 'treefall':noise(0.5,0.25,300,0);tone(90,0.4,'triangle',0.1,0.5);break;
    case 'place':tone(500,0.05,'square',0.04,0.8);noise(0.04,0.08,2000,0);break;
    case 'hit':tone(180,0.1,'sawtooth',0.08,0.6);noise(0.08,0.1,1200,1);break;
    case 'bosshit':tone(90,0.2,'sawtooth',0.1,0.5);noise(0.15,0.15,600,1);break;
    case 'kill':noise(0.25,0.2,900,1);tone(300,0.2,'square',0.05,0.3);break;
    case 'hurt':tone(220,0.25,'sawtooth',0.12,0.4);break;
    case 'death':tone(300,0.8,'sawtooth',0.15,0.15);noise(0.6,0.2,400,0);break;
    case 'pickup':tone(880,0.07,'square',0.04,1.5);tone(1320,0.08,'square',0.04,1.2,0.05);break;
    case 'craft':tone(520,0.08,'square',0.05,1);tone(780,0.12,'square',0.05,1,0.08);break;
    case 'click':tone(700,0.03,'square',0.03,1);break;
    case 'potion':for(let i=0;i<4;i++)tone(400+i*120,0.1,'sine',0.06,1.3,i*0.07);break;
    case 'swing':noise(0.12,0.12,2500,1);break;
    case 'arrow':noise(0.1,0.1,3000,4);tone(900,0.08,'triangle',0.03,0.5);break;
    case 'spark':tone(600,0.15,'sawtooth',0.05,2.5);noise(0.1,0.06,3000,2);break;
    case 'hook':noise(0.1,0.1,1800,3);tone(700,0.1,'square',0.04,0.6);break;
    case 'hooklatch':tone(300,0.06,'square',0.06,0.8);noise(0.05,0.1,2500,4);break;
    case 'roar':noise(1.2,0.35,250,0);tone(60,1.0,'sawtooth',0.18,0.6);tone(45,1.2,'square',0.1,0.5,0.2);break;
    case 'dash':noise(0.35,0.2,900,1);break;
    case 'spawn':tone(200,0.2,'sawtooth',0.05,2);break;
    case 'star':tone(1200,0.3,'sine',0.06,0.5);tone(1800,0.3,'sine',0.04,0.6,0.1);break;
    case 'tut':tone(660,0.1,'sine',0.05,1);tone(990,0.15,'sine',0.05,1,0.1);break;
  }}

// ----------------------------------------------------------------- input ----
function setupInput(){
  addEventListener('keydown',e=>{audioInit();if(e.repeat){if(e.code==='Space'||e.code==='Tab')e.preventDefault();return}keys[e.code]=true;pressed[e.code]=true;
    if(e.code==='Escape'||e.code==='Tab'||e.code==='KeyI'){toggleInv();e.preventDefault()}
    if(e.code==='KeyM'){G.bigMap=!G.bigMap}
    if(e.code==='KeyE'){if(!hasHook())toast('You need a Grappling Hook (craft at an Anvil)');else fireHook()}
    if(e.code.startsWith('Digit')){const d=parseInt(e.code.slice(5));player.sel=(d+9)%10;sfx('click')}
    if(e.code==='Space'||e.code==='ArrowUp'||e.code==='ArrowDown')e.preventDefault();
  });
  addEventListener('keyup',e=>{keys[e.code]=false});
  addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false});
  const c=mainC;
  const upd=e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.wx=mouse.x/ZOOM+cam.x;mouse.wy=mouse.y/ZOOM+cam.y;mouse.tx=Math.floor(mouse.wx/TILE);mouse.ty=Math.floor(mouse.wy/TILE)};
  c.addEventListener('mousemove',e=>{upd(e);uiHover()});
  c.addEventListener('mousedown',e=>{audioInit();upd(e);
    if(e.button===0){
      if(inv.open&&uiClick(0))return;
      if(!inv.open){for(let i=0;i<10;i++){const r=slotRect('inv',i);if(mouse.x>=r.x&&mouse.x<r.x+r.w&&mouse.y>=r.y&&mouse.y<r.y+r.h){player.sel=i;sfx('click');return}}}
      mouse.down=true;mouse.click=true;mouse.pressed=true;
    } else if(e.button===2){if(inv.open&&uiClick(2))return;mouse.rdown=true}
    else if(e.button===1){e.preventDefault();if(hasHook())fireHook()}
  });
  addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false;if(e.button===2)mouse.rdown=false});
  c.addEventListener('contextmenu',e=>e.preventDefault());
  c.addEventListener('wheel',e=>{e.preventDefault();if(inv.open&&inv.overPanel&&mouse.y>HY+5*(SS+SP)){inv.scroll+=e.deltaY>0?1:-1;return}player.sel=(player.sel+(e.deltaY>0?1:-1)+10)%10},{passive:false});
  addEventListener('resize',resize);
}

// ------------------------------------------------------------------ loop ----
let fpsShown=60,fpsAcc=0,fpsN=0,lastBiome='';
function updateCamera(){const p=player;const tx=p.x+p.w/2-IW/2,ty=p.y+p.h/2-IH/2+10;cam.x+=(tx-cam.x)*0.12;cam.y+=(ty-cam.y)*0.12;
  cam.x=clamp(cam.x,0,W*TILE-IW);cam.y=clamp(cam.y,0,H*TILE-IH);
  if(G.shake>0){G.shake--;cam.x+=RF(-1,1)*Math.min(4,G.shake*0.3);cam.y+=RF(-1,1)*Math.min(4,G.shake*0.3)}
  cam.x=Math.round(cam.x);cam.y=Math.round(cam.y)}
function update(){
  G.frame++;updateTime();
  const p=player;
  updatePlayer();updateHook();
  if((mouse.down||mouse.pressed)&&!(inv.open&&inv.overPanel)&&!G.bigMap)useItemTick();mouse.pressed=false;
  if(mining.cool>0)mining.cool--;
  updateEnemies();updateBoss();updateProjs();updateDrops();updateParts();
  const ptx=Math.floor((p.x+p.w/2)/TILE),pty=Math.floor((p.y+p.h/2)/TILE);
  if(G.frame%2===0)updateWater(ptx,pty);
  trySpawnEnemies();updateAmbience();updateTutorial();
  if(tutFlash>0)tutFlash--;
  if(G.frame%12===0){const tx0=Math.floor(cam.x/TILE),ty0=Math.floor(cam.y/TILE);exploreRect(tx0,ty0,tx0+Math.ceil(IW/TILE),ty0+Math.ceil(IH/TILE))}
  if(mapDirty&&G.frame%10===0){mapCtx.putImageData(mapImg,0,0);mapDirty=false}
  const bio=biomeName(ptx,pty);if(bio!==lastBiome){if(lastBiome&&G.frame>60&&bio!=='Underground'&&bio!=='Caverns')toast('Entering the '+bio);lastBiome=bio}
  if(G.banner){G.banner.t++;if(G.banner.t>G.banner.dur)G.banner=null}
  if(G.toast){G.toast.t--;if(G.toast.t<=0)G.toast=null}
  mouse.wx=mouse.x/ZOOM+cam.x;mouse.wy=mouse.y/ZOOM+cam.y;mouse.tx=Math.floor(mouse.wx/TILE);mouse.ty=Math.floor(mouse.wy/TILE);
  mouse.click=false;for(const k in pressed)pressed[k]=false;
  updateCamera();
}
function render(){
  drawSky(sctx);drawWorld(wctx);
  const g=mctx;g.setTransform(1,0,0,1,0,0);g.imageSmoothingEnabled=false;
  g.drawImage(skyC,0,0,IW,IH,0,0,IW*ZOOM*DPR,IH*ZOOM*DPR);g.drawImage(worldC,0,0,IW,IH,0,0,IW*ZOOM*DPR,IH*ZOOM*DPR);
  g.setTransform(DPR,0,0,DPR,0,0);drawHUD(g);
}
let last=0,acc=0;
function frame(ts){requestAnimationFrame(frame);if(!last)last=ts;const dt=Math.min(0.1,(ts-last)/1000);last=ts;acc+=dt;let n=0;while(acc>=1/60&&n<3){update();acc-=1/60;n++}if(acc>1/60)acc=0;
  fpsAcc+=dt;fpsN++;if(fpsAcc>=0.5){fpsShown=Math.round(fpsN/fpsAcc);fpsAcc=0;fpsN=0}
  render()}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);mainC.width=Math.round(innerWidth*DPR);mainC.height=Math.round(innerHeight*DPR);IW=Math.ceil(innerWidth/ZOOM);IH=Math.ceil(innerHeight/ZOOM);for(const c of[worldC,skyC,copyC]){c.width=IW;c.height=IH}wctx.imageSmoothingEnabled=false;sctx.imageSmoothingEnabled=false;mctx.imageSmoothingEnabled=false}
function init(){
  mainC=document.getElementById('c');mctx=mainC.getContext('2d');[worldC,wctx]=mkCanvas(8,8);[skyC,sctx]=mkCanvas(8,8);[copyC,cctx]=mkCanvas(8,8);[lightC,lctx]=mkCanvas(8,8);
  buildTextures();buildIcons();bossSpr.push(makeBossSprite(1),makeBossSprite(2));
  genWorld();initMap();initSky();resize();setupInput();
  player.x=spawnX*TILE+2;player.y=spawnY*TILE;unstick(player);
  const give=(k,n)=>addItem(I[k],n);give('COPPER_SHORTSWORD',1);give('COPPER_PICKAXE',1);give('COPPER_AXE',1);give('LESSER_HEALING_POTION',2);
  cam.x=player.x+player.w/2-IW/2;cam.y=player.y+player.h/2-IH/2;updateCamera();
  exploreRect(Math.floor(cam.x/TILE)-10,Math.floor(cam.y/TILE)-10,Math.floor(cam.x/TILE)+Math.ceil(IW/TILE)+10,Math.floor(cam.y/TILE)+Math.ceil(IH/TILE)+10);
  mapCtx.putImageData(mapImg,0,0);
  G.weatherT=RI(40,120)*60;G.windTarget=0.3;lastBiome=biomeName(spawnX,spawnY);
  requestAnimationFrame(frame);
}
window.HOLLOWMERE={get G(){return G},player,enemies,liq,walls,get boss(){return boss},summonBoss,addItem,I,T,tiles,surface,W,H,TILE,setTile,damageEnemy,tutIdx:()=>tutIdx,inv,mining,cam,drops,setHour:h=>{G.hour=h},give:(k,n)=>addItem(I[k],n||1),tp:(tx,ty)=>{player.x=tx*TILE;player.y=ty*TILE;player.vx=player.vy=0;unstick(player);cam.x=player.x-IW/2;cam.y=player.y-IH/2},tileAt,liqAt,spawnEnemy,craft:(k)=>{const r=RECIPES.find(r=>r.out===I[k]);return craft(r)},sel:i=>{player.sel=i},recipes:RECIPES,countItem,biome:()=>biomeName(Math.floor(player.x/TILE),Math.floor(player.y/TILE))};
init();
</script>
