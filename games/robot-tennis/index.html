<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robo Tennis</title>
<style>
  :root { --ink:#3a2f4a; --paper:rgba(255,250,246,.92); }
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe6ff;font-family:"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
  canvas{display:block}
  #ui{position:fixed;inset:0;pointer-events:none}
  #scoreboard{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--paper);border-radius:14px;padding:8px 14px;box-shadow:0 6px 18px rgba(60,40,80,.18);min-width:250px}
  #scoreboard table{border-collapse:collapse;font-size:15px}
  #scoreboard td{padding:2px 7px;text-align:center;font-variant-numeric:tabular-nums}
  #scoreboard td.name{text-align:left;font-weight:700;letter-spacing:.04em;min-width:60px}
  #scoreboard td.srv{width:12px;color:#f4a33d;font-size:12px}
  #scoreboard td.set{color:#7a6c8c}
  #scoreboard td.set.cur{color:var(--ink);font-weight:700}
  #scoreboard td.pts{font-weight:800;font-size:17px;min-width:36px;border-left:2px solid #eadfe8;color:#e0644c}
  #scoreboard .title{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#a093b0;text-align:center;margin-bottom:2px}
  #call{position:absolute;top:36%;left:50%;transform:translate(-50%,-50%);text-align:center;opacity:0}
  #call .big{font-size:min(12vw,84px);font-weight:900;letter-spacing:.06em;color:#fff;-webkit-text-stroke:3px rgba(58,47,74,.55);paint-order:stroke fill;text-shadow:0 4px 0 #e0644c,0 12px 30px rgba(58,47,74,.6)}
  #call .sub{font-size:min(4.5vw,24px);font-weight:700;color:var(--ink);background:var(--paper);display:inline-block;padding:4px 16px;border-radius:999px;margin-top:8px;box-shadow:0 4px 12px rgba(60,40,80,.18)}
  #call.show{animation:pop .55s cubic-bezier(.2,1.4,.3,1) forwards}
  #call.hide{animation:fade .35s ease-out forwards}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  @keyframes fade{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1.05)}}
  #hint{position:absolute;left:14px;bottom:14px;background:var(--paper);border-radius:12px;padding:8px 12px;font-size:12px;line-height:1.55;box-shadow:0 6px 18px rgba(60,40,80,.18);max-width:290px}
  #hint b{display:inline-block;background:#eee6f2;border-radius:5px;padding:0 6px;margin-right:3px;font-weight:700;color:#5c4b70;font-family:ui-monospace,Menlo,monospace;font-size:11px}
  #prompt{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:var(--paper);border-radius:999px;padding:8px 18px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(60,40,80,.18);transition:opacity .3s;opacity:0}
  #prompt.on{opacity:1;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}
  #fps{position:absolute;right:12px;top:12px;font-size:11px;color:rgba(58,47,74,.55);background:var(--paper);padding:3px 8px;border-radius:8px}
  #fps span{font-variant-numeric:tabular-nums}
</style>
</head>

  <div id="fps"><span id="fpsv">60</span> fps</div>
</div>

<script type="module">
import * as THREE from 'three';

// ---------- constants ----------
const G = 9.81;
const BALL_R = 0.065;
const COURT = { halfL: 11.885, halfW: 4.115, dblW: 5.485, service: 6.4, netH: 0.914, netHPost: 1.07, postX: 5.9 };
const PHYS_DT = 1 / 120;
const PARAMS = new URLSearchParams(location.search);
const AUTO = PARAMS.has('auto');

const rand = (a, b) => a + Math.random() * (b - a);
const gauss = () => { let u = 0, v = 0; while (u === 0) u = Math.random(); while (v === 0) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const damp = (cur, target, k, dt) => lerp(cur, target, 1 - Math.exp(-k * dt));
const netHeightAt = (x) => COURT.netH + (COURT.netHPost - COURT.netH) * clamp(Math.abs(x) / COURT.postX, 0, 1);

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe0ff);
scene.fog = new THREE.Fog(0xbfe0ff, 70, 160);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 6, 22);

const hemi = new THREE.HemisphereLight(0xdcefff, 0xffd6bd, 1.15);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3dc, 2.3);
sun.position.set(14, 26, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -26; sun.shadow.camera.right = 26;
sun.shadow.camera.top = 26; sun.shadow.camera.bottom = -26;
sun.shadow.camera.near = 5; sun.shadow.camera.far = 80;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const MAT = {};
const mat = (hex, extra = {}) => new THREE.MeshStandardMaterial({ color: hex, flatShading: true, roughness: 0.92, metalness: 0, ...extra });
const box = (w, h, d, m, x = 0, y = 0, z = 0, shadow = true) => {
  const g = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  g.position.set(x, y, z); g.castShadow = shadow; g.receiveShadow = true; return g;
};

// ---------- court & environment ----------
function buildCourt() {
  const world = new THREE.Group();
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), mat(0x9fd8b3));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; ground.receiveShadow = true;
  world.add(ground);
  const apron = new THREE.Mesh(new THREE.BoxGeometry(36, 0.06, 54), mat(0xa8e6cf));
  apron.position.y = -0.03; apron.receiveShadow = true; world.add(apron);
  const surf = new THREE.Mesh(new THREE.BoxGeometry(COURT.dblW * 2 + 1.2, 0.04, COURT.halfL * 2 + 1.2), mat(0xf07f66));
  surf.position.y = 0.0; surf.receiveShadow = true; world.add(surf);

  // lines (slightly raised thin boxes)
  const lineM = mat(0xfffaf3, { roughness: 0.7 });
  const line = (w, d, x, z) => { const l = box(w, 0.012, d, lineM, x, 0.026, z, false); world.add(l); };
  const L = 0.08, hl = COURT.halfL, hw = COURT.halfW, dw = COURT.dblW, sv = COURT.service;
  line(dw * 2 + L, L, 0, hl); line(dw * 2 + L, L, 0, -hl);          // baselines
  line(L, hl * 2, dw, 0); line(L, hl * 2, -dw, 0);                     // doubles sidelines
  line(L, hl * 2, hw, 0); line(L, hl * 2, -hw, 0);                     // singles sidelines
  line(hw * 2, L, 0, sv); line(hw * 2, L, 0, -sv);                     // service lines
  line(L, sv * 2, 0, 0);                                               // center service line
  line(L, 0.3, 0, hl - 0.15); line(L, 0.3, 0, -hl + 0.15);             // center marks

  // net
  const postM = mat(0xf5f1ea, { roughness: 0.6 });
  for (const s of [-1, 1]) {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.08, COURT.netHPost + 0.08, 8), postM);
    p.position.set(s * COURT.postX, (COURT.netHPost + 0.08) / 2, 0); p.castShadow = true; world.add(p);
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 6), mat(0xffd166)); cap.position.set(s * COURT.postX, COURT.netHPost + 0.12, 0); world.add(cap);
  }
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 64;
  const cx = cv.getContext('2d'); cx.clearRect(0, 0, 512, 64); cx.strokeStyle = 'rgba(255,255,255,0.85)'; cx.lineWidth = 1.5;
  for (let i = 0; i <= 512; i += 8) { cx.beginPath(); cx.moveTo(i, 0); cx.lineTo(i, 64); cx.stroke(); }
  for (let j = 0; j <= 64; j += 8) { cx.beginPath(); cx.moveTo(0, j); cx.lineTo(512, j); cx.stroke(); }
  const netTex = new THREE.CanvasTexture(cv); netTex.wrapS = THREE.RepeatWrapping; netTex.repeat.set(3, 1);
  const netMesh = new THREE.Mesh(new THREE.PlaneGeometry(COURT.postX * 2, COURT.netH, 24, 1),
    new THREE.MeshStandardMaterial({ map: netTex, transparent: true, side: THREE.DoubleSide, roughness: 1, alphaTest: 0.2 }));
  const pos = netMesh.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) { const x = pos.getX(i), y = pos.getY(i); const t = Math.abs(x) / COURT.postX; pos.setY(i, y + (y > 0 ? (COURT.netHPost - COURT.netH) * t : 0)); }
  pos.needsUpdate = true; netMesh.position.y = COURT.netH / 2; netMesh.castShadow = true; world.add(netMesh);
  const band = new THREE.Mesh(new THREE.PlaneGeometry(COURT.postX * 2, 0.07, 24, 1), new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide, roughness: 0.8 }));
  const bp = band.geometry.attributes.position;
  for (let i = 0; i < bp.count; i++) { const x = bp.getX(i), y = bp.getY(i); bp.setY(i, y + (COURT.netHPost - COURT.netH) * Math.abs(x) / COURT.postX); }
  bp.needsUpdate = true; band.position.y = COURT.netH - 0.035; band.castShadow = true; world.add(band);

  // bleachers: stepped rows on both long sides
  const seatCols = [0xf7b2c4, 0xa9c9f5];
  const crowdSpots = [];
  for (const side of [-1, 1]) {
    for (let r = 0; r < 5; r++) {
      const m = mat(seatCols[(r + (side > 0 ? 1 : 0)) % 2]);
      const w = 2.2, h = 0.75, d = 30;
      const x = side * (12.5 + r * w), y = 0.35 + r * h;
      const step = box(w, h + r * h, d, m, x, y - r * h / 2, 0); world.add(step);
      for (let c = -6; c <= 6; c++) crowdSpots.push([x - side * 0.4, y + h / 2, c * 2.2 + (r % 2) * 0.9]);
    }
    const back = box(1.2, 5.2, 30, mat(0xf3d1dc), side * 24.2, 2.6, 0); world.add(back);
  }
  // short-end stands
  for (const end of [-1, 1]) {
    for (let r = 0; r < 3; r++) {
      const m = mat(seatCols[r % 2]);
      const step = box(22, 0.75 + r * 0.75, 2.0, m, 0, 0.35 + r * 0.75 - r * 0.375, end * (20 + r * 2.0)); world.add(step);
      for (let c = -4; c <= 4; c++) crowdSpots.push([c * 2.4 + (r % 2) * 1.0, 0.35 + r * 0.75 + 0.375, end * (20 + r * 2.0) - end * 0.3]);
    }
  }
  // crowd cubes (instanced)
  const crowd = new THREE.InstancedMesh(new THREE.BoxGeometry(0.5, 0.7, 0.5), mat(0xffffff), crowdSpots.length);
  crowd.castShadow = true; crowd.receiveShadow = true;
  const palette = [0xffd166, 0xef8a8a, 0x9be2c8, 0xb8a6ff, 0xffb1d8, 0xfff2b0, 0x8ed6ff];
  const dummy = new THREE.Object3D(); const col = new THREE.Color();
  crowdSpots.forEach((s, i) => {
    dummy.position.set(s[0], s[1] + 0.35, s[2]); dummy.rotation.y = rand(-0.3, 0.3); dummy.updateMatrix();
    crowd.setMatrixAt(i, dummy.matrix); crowd.setColorAt(i, col.setHex(palette[i % palette.length]));
  });
  crowd.instanceColor.needsUpdate = true; world.add(crowd);

  // blocky trees around the arena
  const trees = [];
  const trunkM = mat(0xb08968), leafMs = [mat(0x8fd3a4), mat(0x6fc494), mat(0xa9e2b1)];
  const treeSpots = [[-30, -8], [-31, 6], [30, -4], [31, 10], [-14, 30], [12, 32], [-8, 33], [19, 30], [-20, -32], [8, -34], [24, -31], [-30, 22], [32, -22]];
  treeSpots.forEach(([x, z], i) => {
    const t = new THREE.Group();
    const s = rand(0.9, 1.4);
    t.add(box(0.7 * s, 2.2 * s, 0.7 * s, trunkM, 0, 1.1 * s, 0));
    const c1 = box(2.8 * s, 2.0 * s, 2.8 * s, leafMs[i % 3], 0, 3.0 * s, 0);
    const c2 = box(2.0 * s, 1.6 * s, 2.0 * s, leafMs[(i + 1) % 3], 0, 4.6 * s, 0); c2.rotation.y = 0.5;
    const c3 = box(1.1 * s, 1.0 * s, 1.1 * s, leafMs[(i + 2) % 3], 0, 5.8 * s, 0); c3.rotation.y = 0.9;
    t.add(c1, c2, c3); t.position.set(x, 0, z); t.rotation.y = rand(0, 6.28);
    t.userData.phase = rand(0, 6.28); world.add(t); trees.push(t);
  });
  // clouds
  const clouds = [];
  const cloudM = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, roughness: 1 });
  for (let i = 0; i < 9; i++) {
    const c = new THREE.Group();
    const n = 3 + (i % 3);
    for (let k = 0; k < n; k++) { const b = box(rand(3, 6), rand(1.4, 2.4), rand(2.5, 4), cloudM, k * 2.6 - n * 1.3, rand(-0.4, 0.5), rand(-1, 1), false); b.receiveShadow = false; c.add(b); }
    c.position.set(rand(-70, 70), rand(22, 34), rand(-80, 40)); c.userData.speed = rand(0.25, 0.6); world.add(c); clouds.push(c);
  }
  // umpire chair + bench + umbrella for flavour
  const chair = new THREE.Group();
  chair.add(box(0.9, 0.1, 0.9, mat(0xffffff), 0, 2.3, 0), box(0.9, 0.9, 0.12, mat(0xffffff), 0, 2.8, -0.4), box(0.12, 2.3, 0.12, trunkM, -0.38, 1.15, -0.38), box(0.12, 2.3, 0.12, trunkM, 0.38, 1.15, -0.38), box(0.12, 2.3, 0.12, trunkM, -0.38, 1.15, 0.38), box(0.12, 2.3, 0.12, trunkM, 0.38, 1.15, 0.38));
  chair.position.set(-8.4, 0, 0); world.add(chair);
  const umb = new THREE.Group();
  umb.add(new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.6, 6), postM));
  const top = new THREE.Mesh(new THREE.ConeGeometry(1.6, 0.7, 8), mat(0xffb1d8)); top.position.y = 1.5; top.castShadow = true; umb.add(top);
  umb.children[0].position.y = 1.2; umb.position.set(8.6, 0, 3.5); world.add(umb);
  world.add(box(1.6, 0.4, 0.5, mat(0xffe0a3), 8.6, 0.4, 3.5));
  scene.add(world);
  return { trees, clouds, crowd, crowdSpots };
}
const ENV = buildCourt();

// ---------- robot rig ----------
// Local frame: forward = -z, right = +x, origin on the ground under the hips.
const RIG = { hip: 0.78, shoulder: new THREE.Vector3(0.34, 1.26, 0), upper: 0.36, fore: 0.34, racketLen: 0.56, legUp: 0.36, legLo: 0.36 };

class Robot {
  constructor(colors, facing) {
    this.root = new THREE.Group();
    this.root.rotation.y = facing;           // 0 = faces -z (player), PI = faces +z (CPU)
    this.facing = facing;
    this.pos = new THREE.Vector3();
    this.vel = new THREE.Vector3();
    this.colors = colors;
    this.swing = null;                        // {def, t}
    this.lastHitTime = -9;
    this.pose = { twist: 0, lean: 0, tilt: 0, crouch: 0, headYaw: 0, headPitch: 0, bob: 0 };
    this.locoPhase = 0;
    this.handR = new THREE.Vector3(0.36, 1.0, -0.36); this.dirR = new THREE.Vector3(-0.25, 0.55, -0.8).normalize(); this.normR = new THREE.Vector3(-1, 0, -0.2).normalize();
    this.handL = new THREE.Vector3(-0.36, 1.0, -0.32);
    this.antenna = { a: 0, v: 0 };
    this.spring = 0; this.springV = 0;
    this.build();
  }
  build() {
    const c = this.colors;
    const bodyM = mat(c.body), accM = mat(c.accent), darkM = mat(0x4a4258), whiteM = mat(0xfff8ef, { roughness: 0.5 });
    this.hips = new THREE.Group(); this.hips.position.y = RIG.hip; this.root.add(this.hips);
    this.torso = new THREE.Group(); this.hips.add(this.torso);
    const t = box(0.62, 0.58, 0.44, bodyM, 0, 0.3, 0); t.geometry.translate(0, 0, 0); this.torso.add(t);
    this.torso.add(box(0.66, 0.16, 0.48, accM, 0, 0.04, 0));   // belt
    this.torso.add(box(0.28, 0.18, 0.05, darkM, 0, 0.36, -0.235)); // chest panel
    const light = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 4), new THREE.MeshStandardMaterial({ color: c.glow, emissive: c.glow, emissiveIntensity: 0.9 })); light.position.set(0, 0.36, -0.26); this.torso.add(light);
    // head
    this.neck = new THREE.Group(); this.neck.position.set(0, 0.62, 0); this.torso.add(this.neck);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.31, 10, 8), bodyM); head.position.y = 0.3; head.castShadow = true; this.neck.add(head);
    const visor = new THREE.Mesh(new THREE.SphereGeometry(0.26, 10, 6, Math.PI * 0.62, Math.PI * 0.76, Math.PI * 0.28, Math.PI * 0.42), darkM);
    visor.position.y = 0.3; visor.scale.set(1.14, 1.06, 1.14); visor.rotation.y = Math.PI / 2; this.neck.add(visor);
    for (const s of [-1, 1]) { const e = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.1, 0.05), new THREE.MeshStandardMaterial({ color: c.glow, emissive: c.glow, emissiveIntensity: 1.2 })); e.position.set(s * 0.11, 0.33, -0.285); this.neck.add(e); }
    this.antennaG = new THREE.Group(); this.antennaG.position.set(0, 0.58, 0); this.neck.add(this.antennaG);
    this.antennaG.add(box(0.05, 0.28, 0.05, darkM, 0, 0.14, 0));
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.075, 6, 5), accM); ball.position.y = 0.32; this.antennaG.add(ball);
    for (const s of [-1, 1]) { const ear = box(0.1, 0.16, 0.16, accM, s * 0.33, 0.3, 0); this.neck.add(ear); }
    // legs
    this.legs = [];
    for (const s of [-1, 1]) {
      const hip = new THREE.Group(); hip.position.set(s * 0.17, 0, 0); this.hips.add(hip);
      const up = box(0.2, RIG.legUp, 0.22, accM, 0, -RIG.legUp / 2, 0); hip.add(up);
      const knee = new THREE.Group(); knee.position.y = -RIG.legUp; hip.add(knee);
      const lo = box(0.17, RIG.legLo, 0.19, bodyM, 0, -RIG.legLo / 2, 0); knee.add(lo);
      const foot = box(0.24, 0.12, 0.36, darkM, 0, -RIG.legLo - 0.02, -0.06); knee.add(foot);
      this.legs.push({ hip, knee, s });
    }
    // arms: shoulder sphere, upper + fore segments oriented by IK
    this.arms = {};
    for (const s of [-1, 1]) {
      const sh = new THREE.Mesh(new THREE.SphereGeometry(0.11, 7, 5), accM); sh.position.set(s * RIG.shoulder.x, RIG.shoulder.y - RIG.hip, 0); this.torso.add(sh);
      const upper = new THREE.Group(); const um = box(0.16, RIG.upper, 0.16, bodyM, 0, RIG.upper / 2, 0); upper.add(um); this.torso.add(upper);
      const fore = new THREE.Group(); const fm = box(0.14, RIG.fore, 0.14, accM, 0, RIG.fore / 2, 0); fore.add(fm); this.torso.add(fore);
      const elbow = new THREE.Mesh(new THREE.SphereGeometry(0.085, 7, 5), darkM); this.torso.add(elbow);
      const hand = new THREE.Group(); const hm = new THREE.Mesh(new THREE.SphereGeometry(0.1, 7, 5), whiteM); hm.castShadow = true; hand.add(hm); this.torso.add(hand);
      this.arms[s > 0 ? 'R' : 'L'] = { upper, fore, elbow, hand };
    }
    // racket in right hand
    this.racket = new THREE.Group();
    this.racket.add(box(0.045, 0.34, 0.045, darkM, 0, 0.17, 0));
    const hoop = new THREE.Mesh(new THREE.TorusGeometry(0.19, 0.03, 6, 14), accM); hoop.position.y = 0.34 + 0.2; hoop.castShadow = true; this.racket.add(hoop);
    const strings = new THREE.Mesh(new THREE.CircleGeometry(0.18, 14), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.45, side: THREE.DoubleSide, roughness: 1 }));
    strings.position.y = 0.54; this.racket.add(strings);
    this.arms.R.hand.add(this.racket);
    this.racketHeadLocal = new THREE.Vector3(0, 0.54, 0);
    this.root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    scene.add(this.root);
    // ball held in left hand (for serve)
    this.racketHeadWorld = new THREE.Vector3();
  }
  // 2-bone IK: places upper/fore/hand objects (children of torso) so the hand reaches target (torso-local)
  solveArm(side, target, pole) {

      else if (serve) { const g = serveGeometry(); ok = Math.sign(pr.bounce.x) === g.boxSign && Math.abs(pr.bounce.x) <= COURT.halfW && Math.abs(pr.bounce.z) <= COURT.service; }
      else ok = Math.abs(pr.bounce.x) <= COURT.halfW && Math.abs(pr.bounce.z) <= COURT.halfL;
      ringM.color.setHex(ok ? 0xfff3a0 : 0xff6b6b);
    } else ring.visible = false;
  } else ring.visible = false;
  fx.update(dt, t);
  updateCamera(dt);
}
let last = performance.now(), fpsAcc = 0, fpsN = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (window.__rt && window.__rt.paused) { renderer.render(scene, camera); return; }
  stepFrame(dt);
  renderer.render(scene, camera);
  fpsAcc += dt; fpsN++; if (fpsAcc >= 0.5) { document.getElementById('fpsv').textContent = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
}
updateScoreboard(); beginPoint();
for (const r of robots) { r.pos.copy(r.spot); r.update(1 / 60, 0, ball.pos); }
if (AUTO) setPrompt('');
window.__rt = { game, ball, player, cpu, stepFrame, CONTACT, camera, THREE, awardPoint, ptLabel, beginPoint, other, SWINGS, pickPlayerSwing: () => pickPlayerSwing(), swing: (n) => player.startSwing(n), serve: () => startServe(player), render: () => renderer.render(scene, camera), renderer };
requestAnimationFrame(loop);
</script>
