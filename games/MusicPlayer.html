let audioContext, analyzer, dataArray, canvas, canvasCtx;

function initVisualizer() {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === 'suspended') { audioContext.resume(); }
    const source = audioContext.createMediaElementSource(audio);
    analyzer = audioContext.createAnalyser();
    source.connect(analyzer);
    analyzer.connect(audioContext.destination);
    analyzer.fftSize = 64; // Number of bars
    const bufferLength = analyzer.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);
    canvas = document.getElementById('visualizer');
    canvasCtx = canvas.getContext('2d');
    draw();
}

function draw() {
    requestAnimationFrame(draw);
    analyzer.getByteFrequencyData(dataArray);
    canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
    
    let barWidth = (canvas.width / dataArray.length) * 2.5;
    let x = 0;

    for (let i = 0; i < dataArray.length; i++) {
        let barHeight = dataArray[i] / 4; // Max height adjustment
        canvasCtx.fillStyle = '#1DB954'; // Spotify Green
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
        x += barWidth + 1;
    }
}
function createSparkle() {
    const sparkle = document.createElement('div');
    sparkle.className = 'sparkle';
    sparkle.innerHTML = '✨'; 
    sparkle.style.left = Math.random() * window.innerWidth + 'px';
    sparkle.style.top = '-10px';
    document.body.appendChild(sparkle);
    
    // This removes the sparkle after 3 seconds so the computer doesn't slow down
    setTimeout(() => { sparkle.remove(); }, 3000);
}
