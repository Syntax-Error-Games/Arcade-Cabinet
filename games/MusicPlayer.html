<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Johann's Music Player</title>

<style>
  :root {
    --bg: #0f1117;
    --panel: #181b24;
    --panel-light: #242936;
    --text: #ffffff;
    --muted: #aeb5c4;
    --green: #1db954;
    --green-dark: #159943;
    --border: rgba(255, 255, 255, 0.1);
  }

  * {
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at top left, #26364c 0%, transparent 40%),
      radial-gradient(circle at bottom right, #1e5738 0%, transparent 38%),
      var(--bg);
  }

  .player {
    position: relative;
    width: min(100%, 430px);
    padding: 22px;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: rgba(24, 27, 36, 0.94);
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
  }

  .player::before {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    content: "";
    opacity: 0.35;
    background: linear-gradient(135deg, rgba(29, 185, 84, 0.2), transparent 45%);
  }

  .player > * {
    position: relative;
    z-index: 1;
  }

  .now-playing {
    margin: 0 0 14px;
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .art-wrap {
    position: relative;
    width: min(100%, 270px);
    aspect-ratio: 1;
    margin: 0 auto 18px;
    overflow: hidden;
    border-radius: 16px;
    background: #0a0c10;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
  }

  #album-art {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.35s ease, filter 0.35s ease;
  }

  .art-wrap.playing #album-art {
    transform: scale(1.04);
    filter: saturate(1.15);
  }

  #visualizer {
    position: absolute;
    right: 0;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 42%;
    pointer-events: none;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.45));
  }

  .track-info {
    min-width: 0;
    margin-bottom: 14px;
    text-align: center;
  }

  #track-title {
    overflow: hidden;
    margin: 0;
    font-size: 1.25rem;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  #track-artist {
    overflow: hidden;
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 0.9rem;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .progress-area {
    margin: 16px 0 6px;
  }

  #progress {
    width: 100%;
    height: 5px;
    margin: 0;
    accent-color: var(--green);
    cursor: pointer;
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    margin-top: 5px;
    color: var(--muted);
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
  }

  .controls {
    display: grid;
    grid-template-columns: 42px 42px 58px 42px 42px;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 14px 0 16px;
  }

  button {
    font: inherit;
  }

  .icon-btn,
  .play-btn {
    display: grid;
    place-items: center;
    border: 0;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
  }

  .icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    color: var(--muted);
    background: transparent;
    font-size: 1.15rem;
  }

  .icon-btn:hover,
  .icon-btn:focus-visible {
    color: #fff;
    background: var(--panel-light);
  }

  .icon-btn.active {
    color: var(--green);
  }

  .play-btn {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    color: #fff;
    background: var(--green);
    box-shadow: 0 5px 16px rgba(29, 185, 84, 0.32);
    font-size: 1.25rem;
  }

  .play-btn:hover,
  .play-btn:focus-visible {
    background: var(--green-dark);
    transform: scale(1.06);
  }

  .icon-btn:active,
  .play-btn:active {
    transform: scale(0.94);
  }

  .volume-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 4px 15px;
  }

  #mute-btn {
    width: 30px;
    height: 30px;
    border: 0;
    cursor: pointer;
    color: var(--muted);
    background: transparent;
    font-size: 1rem;
  }

  #volume {
    flex: 1;
    height: 4px;
    accent-color: var(--green);
    cursor: pointer;
  }

  .playlist-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 4px 8px;
  }

  .playlist-header h2 {
    margin: 0;
    font-size: 0.9rem;
  }

  #track-count {
    color: var(--muted);
    font-size: 0.75rem;
  }

  #playlist-container {
    max-height: 190px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.18);
  }

  #playlist-list {
    padding: 0;
    margin: 0;
    list-style: none;
  }

  .track-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .track-item:last-child {
    border-bottom: 0;
  }

  .track-item:hover {
    background: rgba(255, 255, 255, 0.06);
  }

  .track-item.active {
    background: rgba(29, 185, 84, 0.13);
  }

  .track-number {
    width: 20px;
    color: var(--muted);
    font-size: 0.78rem;
    text-align: center;
  }

  .track-item.active .track-number {
    color: var(--green);
  }

  .track-copy {
    min-width: 0;
    flex: 1;
  }

  .track-name,
  .track-artist-name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .track-name {
    font-size: 0.86rem;
    font-weight: 700;
  }

  .track-item.active .track-name {
    color: var(--green);
  }

  .track-artist-name {
    margin-top: 2px;
    color: var(--muted);
    font-size: 0.72rem;
  }

  .status {
    min-height: 18px;
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 0.74rem;
    text-align: center;
  }

  .sparkle {
    position: fixed;
    z-index: 10;
    color: #fff;
    pointer-events: none;
    user-select: none;
    animation: fall 3s linear forwards;
    filter: drop-shadow(0 0 5px rgba(29, 185, 84, 0.9));
  }

  @keyframes fall {
    from {
      transform: translateY(-30px) rotate(0deg);
      opacity: 0;
    }

    10% {
      opacity: 1;
    }

    to {
      transform: translateY(110vh) rotate(360deg);
      opacity: 0;
    }
  }

  @media (max-width: 480px) {
    body {
      padding: 12px;
    }

    .player {
      padding: 16px;
      border-radius: 16px;
    }

    .controls {
      gap: 5px;
    }
  }
</style>
</head>

<body>
<div class="player" id="player-wrapper">
  <p class="now-playing">Now Playing</p>

  <div class="art-wrap" id="art-wrap">

      id="album-art"
      src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600&q=85"

    <canvas id="visualizer" width="270" height="115"></canvas>
  </div>

  <div class="track-info">
    <h1 id="track-title">Loading…</h1>
    <p id="track-artist">Artist</p>
  </div>

  <audio id="main-audio" preload="metadata" crossorigin="anonymous"></audio>

  <div class="progress-area">
    <input id="progress" type="range" min="0" max="100" value="0" aria-label="Song progress">
    <div class="time-row">
      <span id="current-time">0:00</span>
      <span id="duration">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button class="icon-btn" id="shuffle-btn" type="button" title="Shuffle" aria-label="Toggle shuffle">🔀</button>
    <button class="icon-btn" id="prev-btn" type="button" title="Previous track" aria-label="Previous track">⏮</button>
    <button class="play-btn" id="play-btn" type="button" title="Play" aria-label="Play">▶</button>
    <button class="icon-btn" id="next-btn" type="button" title="Next track" aria-label="Next track">⏭</button>
    <button class="icon-btn" id="repeat-btn" type="button" title="Repeat off" aria-label="Toggle repeat">🔁</button>
  </div>

  <div class="volume-row">
    <button id="mute-btn" type="button" aria-label="Mute">🔊</button>
    <input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume">
  </div>

  <div class="playlist-header">
    <h2>Playlist</h2>
    <span id="track-count"></span>
  </div>

  <div id="playlist-container">
    <ul id="playlist-list"></ul>
  </div>

  <div class="status" id="status">Space: play/pause · ←/→: seek · N/P: next/previous</div>
</div>

const audio = document.getElementById("main-audio");
const player = document.getElementById("player-wrapper");
const artWrap = document.getElementById("art-wrap");
const albumArt = document.getElementById("album-art");
const trackTitle = document.getElementById("track-title");
const trackArtist = document.getElementById("track-artist");
const playlistList = document.getElementById("playlist-list");
const trackCount = document.getElementById("track-count");
const playBtn = document.getElementById("play-btn");
const prevBtn = document.getElementById("prev-btn");
const nextBtn = document.getElementById("next-btn");
const shuffleBtn = document.getElementById("shuffle-btn");
const repeatBtn = document.getElementById("repeat-btn");
const progress = document.getElementById("progress");
const currentTimeEl = document.getElementById("current-time");
const durationEl = document.getElementById("duration");
const volume = document.getElementById("volume");
const muteBtn = document.getElementById("mute-btn");
const status = document.getElementById("status");

let currentIndex = 0;
let isShuffle = false;
let isRepeatOne = false;
let sparkleTimer = null;

let audioContext;
let analyser;
let dataArray;
let visualizerCanvas;
let visualizerCtx;

function fixDropboxUrl(url) {
  if (!url) return "";

  const fixedUrl = new URL(url);
  fixedUrl.hostname = "dl.dropboxusercontent.com";
  fixedUrl.searchParams.delete("dl");
  fixedUrl.searchParams.set("raw", "1");

  return fixedUrl.toString();
}

function formatTime(seconds) {
  if (!Number.isFinite(seconds) || seconds < 0) return "0:00";

  const minutes = Math.floor(seconds / 60);
  const remainingSeconds = Math.floor(seconds % 60);

  return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
}

function setStatus(message) {
  status.textContent = message;
}

function renderPlaylist() {
  playlistList.innerHTML = "";
  trackCount.textContent = `${songs.length} tracks`;

  songs.forEach((song, index) => {
    const item = document.createElement("li");
    item.className = "track-item";
    item.dataset.index = index;

    const number = document.createElement("span");
    number.className = "track-number";
    number.textContent = index + 1;

    const copy = document.createElement("div");
    copy.className = "track-copy";

    const title = document.createElement("div");
    title.className = "track-name";
    title.textContent = song.title;

    const artist = document.createElement("div");
    artist.className = "track-artist-name";
    artist.textContent = song.artist;

    copy.append(title, artist);
    item.append(number, copy);

    item.addEventListener("click", () => {
      loadTrack(index);
      playTrack();
    });

    playlistList.appendChild(item);
  });

  updatePlaylistHighlight();
}

function updatePlaylistHighlight() {
  document.querySelectorAll(".track-item").forEach((item) => {
    const isActive = Number(item.dataset.index) === currentIndex;
    item.classList.toggle("active", isActive);

    if (isActive) {
      item.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  });
}

function loadTrack(index) {
  currentIndex = (index + songs.length) % songs.length;
  const song = songs[currentIndex];

  audio.src = fixDropboxUrl(song.url);
  audio.load();

  albumArt.src = song.cover;
  albumArt.alt = `${song.title} album art`;
  trackTitle.textContent = song.title;
  trackArtist.textContent = song.artist;

  progress.value = 0;
  currentTimeEl.textContent = "0:00";
  durationEl.textContent = "0:00";

  updatePlaylistHighlight();
  setStatus(`Loaded: ${song.title}`);
}

async function playTrack() {
  try {
    initVisualizer();

    if (audioContext && audioContext.state === "suspended") {
      await audioContext.resume();
    }

    await audio.play();
  } catch (error) {
    console.error("Audio playback error:", error);
    setStatus("Playback was blocked or the audio file could not load.");
  }
}

function pauseTrack() {
  audio.pause();
}

function togglePlay() {
  if (audio.paused) {
    playTrack();
  } else {
    pauseTrack();
  }
}

function getNextIndex() {
  if (!isShuffle || songs.length < 2) {
    return (currentIndex + 1) % songs.length;
  }

  let nextIndex = currentIndex;

  while (nextIndex === currentIndex) {
    nextIndex = Math.floor(Math.random() * songs.length);
  }

  return nextIndex;
}

function nextTrack() {
  loadTrack(getNextIndex());
  playTrack();
}

function prevTrack() {
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }

  loadTrack((currentIndex - 1 + songs.length) % songs.length);
  playTrack();
}

function toggleShuffle() {
  isShuffle = !isShuffle;
  shuffleBtn.classList.toggle("active", isShuffle);
  shuffleBtn.title = isShuffle ? "Shuffle on" : "Shuffle off";
  setStatus(isShuffle ? "Shuffle enabled" : "Shuffle disabled");
}

function toggleRepeat() {
  isRepeatOne = !isRepeatOne;
  repeatBtn.classList.toggle("active", isRepeatOne);
  repeatBtn.textContent = isRepeatOne ? "🔂" : "🔁";
  repeatBtn.title = isRepeatOne ? "Repeat one enabled" : "Repeat off";
  setStatus(isRepeatOne ? "Repeat one enabled" : "Repeat disabled");
}

function updatePlayButton() {
  const playing = !audio.paused;

  playBtn.textContent = playing ? "⏸" : "▶";
  playBtn.title = playing ? "Pause" : "Play";
  playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
  artWrap.classList.toggle("playing", playing);

  if (playing) {
    startSparkles();
  } else {
    stopSparkles();
  }
}

function updateProgress() {
  if (!Number.isFinite(audio.duration)) return;

  progress.value = (audio.currentTime / audio.duration) * 100;
  currentTimeEl.textContent = formatTime(audio.currentTime);
  durationEl.textContent = formatTime(audio.duration);
}

function initVisualizer() {
  if (audioContext) return;

  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioContext.createMediaElementSource(audio);

  analyser = audioContext.createAnalyser();
  analyser.fftSize = 128;
  analyser.smoothingTimeConstant = 0.82;

  source.connect(analyser);
  analyser.connect(audioContext.destination);

  dataArray = new Uint8Array(analyser.frequencyBinCount);
  visualizerCanvas = document.getElementById("visualizer");
  visualizerCtx = visualizerCanvas.getContext("2d");

  drawVisualizer();
}

function drawVisualizer() {
  requestAnimationFrame(drawVisualizer);

  if (!analyser || !visualizerCtx) return;

  const { width, height } = visualizerCanvas;
  analyser.getByteFrequencyData(dataArray);

  visualizerCtx.clearRect(0, 0, width, height);

  const barGap = 2;
  const barWidth = Math.max(2, (width - barGap * dataArray.length) / dataArray.length);

  for (let i = 0; i < dataArray.length; i++) {
    const strength = dataArray[i] / 255;
    const barHeight = strength * height;
    const x = i * (barWidth + barGap);
    const y = height - barHeight;

    const gradient = visualizerCtx.createLinearGradient(0, y, 0, height);
    gradient.addColorStop(0, "#7dffad");
    gradient.addColorStop(1, "#1db954");

    visualizerCtx.fillStyle = gradient;
    visualizerCtx.fillRect(x, y, barWidth, barHeight);
  }
}

function startSparkles() {
  if (sparkleTimer) return;

  sparkleTimer = setInterval(() => {
    if (!audio.paused && document.visibilityState === "visible") {
      createSparkle();
    }
  }, 900);
}

function stopSparkles() {
  clearInterval(sparkleTimer);
  sparkleTimer = null;
}

function createSparkle() {
  const sparkle = document.createElement("span");
  sparkle.className = "sparkle";
  sparkle.textContent = Math.random() > 0.5 ? "✦" : "✨";
  sparkle.style.left = `${Math.random() * 100}vw`;
  sparkle.style.fontSize = `${12 + Math.random() * 14}px`;
  sparkle.style.animationDuration = `${2.2 + Math.random() * 1.8}s`;

  document.body.appendChild(sparkle);
  sparkle.addEventListener("animationend", () => sparkle.remove());
}

playBtn.addEventListener("click", togglePlay);
prevBtn.addEventListener("click", prevTrack);
nextBtn.addEventListener("click", nextTrack);
shuffleBtn.addEventListener("click", toggleShuffle);
repeatBtn.addEventListener("click", toggleRepeat);

progress.addEventListener("input", () => {
  if (!Number.isFinite(audio.duration)) return;
  audio.currentTime = (progress.value / 100) * audio.duration;
});

volume.addEventListener("input", () => {
  audio.volume = Number(volume.value) / 100;
  audio.muted = false;
  muteBtn.textContent = audio.volume === 0 ? "🔇" : "🔊";
});

muteBtn.addEventListener("click", () => {
  audio.muted = !audio.muted;
  muteBtn.textContent = audio.muted ? "🔇" : "🔊";
});

audio.addEventListener("play", () => {
  updatePlayButton();
  setStatus(`Playing: ${songs[currentIndex].title}`);
});

audio.addEventListener("pause", () => {
  updatePlayButton();

  if (!audio.ended) {
    setStatus("Paused");
  }
});

audio.addEventListener("loadedmetadata", updateProgress);
audio.addEventListener("timeupdate", updateProgress);

audio.addEventListener("ended", () => {
  if (isRepeatOne) {
    audio.currentTime = 0;
    playTrack();
  } else {
    nextTrack();
  }
});

audio.addEventListener("error", () => {
  setStatus("Could not load this audio file. Check its public sharing link.");
});

albumArt.addEventListener("error", () => {
  albumArt.src = "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600&q=85";
});

document.addEventListener("keydown", (event) => {
  const tag = document.activeElement.tagName.toLowerCase();

  if (tag === "input" || tag === "button") return;

  if (event.code === "Space") {
    event.preventDefault();
    togglePlay();
  }

  if (event.key === "ArrowRight") {
    audio.currentTime = Math.min(audio.currentTime + 5, audio.duration || 0);
  }

  if (event.key === "ArrowLeft") {
    audio.currentTime = Math.max(audio.currentTime - 5, 0);
  }

  if (event.key.toLowerCase() === "n") {
    nextTrack();
  }

  if (event.key.toLowerCase() === "p") {
    prevTrack();
  }
});

audio.volume = 0.8;

renderPlaylist();
loadTrack(currentIndex);
</script>
</body>
</html>
