<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade Cabinet</title>
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --magenta:#ff2bd6;
    --cyan:#22e0ff;
    --phosphor:#39ff14;
    --bg:#0a0612;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:#eae6ff;
    font-family:'Press Start 2P', monospace;
    overflow:hidden;
  }

  /* ---------- fallback list (shown until / unless the 3D scene loads) ---------- */
  #fallback{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(ellipse at center, #1a0e2e 0%, #0a0612 70%);
  }
  #fallback .panel{
    text-align:center;
    padding:40px 32px;
    border-radius:10px;
    background:#140a24;
    border:2px solid var(--magenta);
    box-shadow:0 0 25px rgba(255,43,214,.4), inset 0 0 20px rgba(34,224,255,.08);
    width:320px;
  }
  #fallback h1{
    margin:0 0 24px;
    font-size:1rem;
    color:var(--cyan);
    text-shadow:0 0 8px var(--cyan);
  }
  #fallback ul{list-style:none;padding:0;margin:0;}
  #fallback li{margin:12px 0;}
  #fallback .game-link{
    text-decoration:none;
    color:#0a0612;
    background:var(--magenta);
    padding:12px 14px;
    border-radius:4px;
    display:block;
    font-family:'Press Start 2P', monospace;
    font-size:.6rem;
    line-height:1.4;
    transition:background .2s, transform .2s;
  }
  #fallback .game-link:hover{
    background:var(--cyan);
    transform:translateY(-2px);
  }
  #fallback .hint{
    margin-top:20px;
    font-size:.5rem;
    color:#8a7fb0;
    line-height:1.6;
  }

  /* ---------- 3D app ---------- */
  #app{
    position:fixed;
    inset:0;
    display:none;
  }
  #app canvas{display:block;}

  #crosshair-hint{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    font-size:.55rem;
    color:#8a7fb0;
    background:rgba(10,6,18,.6);
    padding:10px 16px;
    border:1px solid rgba(255,43,214,.4);
    border-radius:6px;
    pointer-events:none;
    opacity:.9;
    text-align:center;
    line-height:1.8;
  }

  /* ---------- game overlay ---------- */
  #game-overlay{
    position:fixed;
    inset:0;
    display:none;
    flex-direction:column;
    background:#000;
    z-index:50;
  }
  #game-overlay iframe{
    flex:1;
    width:100%;
    border:0;
    background:#fff;
  }
  #back-btn{
    position:absolute;
    top:12px;
    left:12px;
    z-index:51;
    font-family:'Press Start 2P', monospace;
    font-size:.45rem;
    color:var(--cyan);
    background:#0a0612;
    border:2px solid var(--cyan);
    border-radius:4px;
    padding:7px 10px;
    cursor:pointer;
    box-shadow:0 0 12px rgba(34,224,255,.5);
    opacity:.4;
    transition:opacity .25s, transform .15s;
  }
  #back-btn:hover, #back-btn:focus, #back-btn.active{ opacity:1; }
  #back-btn:hover{ background:var(--cyan); color:#0a0612; }

  #open-tab-btn{
    position:absolute;
    top:12px;
    right:12px;
    z-index:51;
    font-family:'Press Start 2P', monospace;
    font-size:.45rem;
    color:var(--magenta);
    background:#0a0612;
    border:2px solid var(--magenta);
    border-radius:4px;
    padding:7px 10px;
    text-decoration:none;
    box-shadow:0 0 12px rgba(255,43,214,.5);
    opacity:.4;
    transition:opacity .25s;
  }
  #open-tab-btn:hover, #open-tab-btn:focus, #open-tab-btn.active{ opacity:1; }
  #open-tab-btn:hover{ background:var(--magenta); color:#0a0612; }

  @media (max-width:600px){
    #crosshair-hint{ font-size:.45rem; padding:8px 12px; }
    #fallback .panel{ width:88vw; padding:28px 20px; }
  }

  /* ---------- room / character mode ---------- */
  #room-prompt{
    position:fixed;
    left:50%;
    bottom:96px;
    transform:translateX(-50%);
    z-index:20;
    display:none;
    padding:10px 16px;
    border:1px solid rgba(57,255,20,.55);
    background:rgba(2,4,2,.72);
    color:#39ff14;
    font-size:.55rem;
    line-height:1.7;
    text-align:center;
    text-shadow:0 0 8px #39ff14;
    pointer-events:none;
  }
  #session-restore{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    background:#020402;
    color:#39ff14;
    font-size:.65rem;
    text-align:center;
    text-shadow:0 0 12px #39ff14;
  }
  #session-restore.show{display:flex;}
  #session-restore .restore-inner{
    padding:28px 34px;
    border:2px solid #39ff14;
    box-shadow:0 0 25px rgba(57,255,20,.3);
    background:rgba(0,0,0,.9);
  }
  #session-restore .restore-sub{
    margin-top:12px;
    color:#7bbf73;
    font-size:.42rem;
  }

</style>
</head>
<body>

<!--
  =====================================================================
  HOW TO ADD MORE GAMES
  =====================================================================
  Scroll down to the "GAMES" array near the top of the <script> block
  below and add one line per game, e.g.:

      { title: "My New Game", file: "games/MyNewGame.html" },

  Add `pinBottom: true` to an entry (like Credits) to keep it glued to
  the end of the list no matter where you insert it above.

  That's it — the arcade-cabinet screen AND the plain-text fallback
  list both read from this single array, so nothing else needs to
  change and the page can never "run out of room" (the CRT menu
  scrolls automatically once there are more games than fit on screen).
  =====================================================================
-->

<div id="fallback">
  <div class="panel">
    <h1>My Games</h1>
    <ul id="fallback-list"></ul>
    <div class="hint">loading 3d arcade&hellip;</div>
  </div>
</div>

<div id="app">
  <div id="crosshair-hint">WASD &bull; move &nbsp;&bull;&nbsp; mouse &bull; look around<br>walk to the arcade cabinet</div>
  <div id="room-prompt">CLICK THE ARCADE CABINET<br><span>or press ENTER</span></div>
</div>

<div id="session-restore">
  <div class="restore-inner">
    RESTORING ARCADE SESSION...
    <div class="restore-sub">returning you to the screen &amp; controls</div>
  </div>
</div>

<div id="game-overlay">
  <button id="back-btn">&larr; BACK (ESC)</button>
  <a id="open-tab-btn" href="#" target="_blank" rel="noopener">OPEN IN TAB &nearr;</a>
  <iframe id="game-frame" src="about:blank" title="game"></iframe>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
(function(){

  // =====================================================================
  // GAMES — add / remove entries here. Everything else adapts automatically.
  // =====================================================================
  const GAMES = [
    { title: "Terminal",          file: "games/Terminal.html" },
    { title: "Gravity Simulator", file: "games/GravitySim.html" },
    { title: "Neon Chamber",      file: "games/NeonChamber.html" },
    { title: "Buckshot Roulette", file: "https://ubghyper.github.io/GameList.github.io/Buckshot-Roulete/" },
    { title: "Pokemon Clone",     file: "https://syntax-error-games.github.io/2026Q1_Fakemon/" },
    { title: "Drive Mad",         file: "https://ubghyper.github.io/GameList.github.io/Drive-Mad/" },
    { title: "Terraria",          file: "https://ubghyper.github.io/GameList.github.io/Terraria/" },
    { title: "Hollow Knight",     file: "https://ubghyper.github.io/GameList.github.io/hollowknight/" },
    { title: "Sandvoxels",        file: "https://ubghyper.github.io/GameList.github.io/Sandboxels/" },
    { title: "MiSide",            file: "https://ubghyper.github.io/GameList.github.io/Unity-Web-Player-MiSide/" },
    { title: "Level Devil",       file: "https://ubghyper.github.io/GameList.github.io/Level-Devil/" },
    { title: "Stickman Hook",     file: "https://ubghyper.github.io/GameList.github.io/Stickman-Hook/" },
    { title: "Drift Boss",        file: "https://ubghyper.github.io/GameList.github.io/Drift-Boss/" },
    { title: "MotoX3M",           file: "https://ubghyper.github.io/GameList.github.io/Moto3XM/" },
    { title: "Ultrakill",         file: "https://ubghyper.github.io/GameList.github.io/Ultrakill/" },
    { title: "Eaglercraft",       file: "https://ubghyper.github.io/GameList.github.io/Eaglercraft/" },
    { title: "R.E.P.O.",          file: "https://ubghyper.github.io/GameList.github.io/Repo/" },
    { title: "Townscaper",        file: "https://ubghyper.github.io/GameList.github.io/Townscaper/" },
    { title: "Five Nights at Epst", file: "https://ubghyper.github.io/GameList.github.io/FNAE/" },
    { title: "Jelly Drift",       file: "https://ubghyper.github.io/GameList.github.io/Jelly-Drift/" },
    { title: "Tomb of the Mask",  file: "https://ubghyper.github.io/GameList.github.io/Tomb-of-the-Mask/" },
    { title: "Mario Kart",        file: "https://ubghyper.github.io/GameList.github.io/MarioKart/" },
    { title: "Good Games",        file: "https://ubghyper.github.io/index.html" },
    { title: "Windows 95",        file: "games/Win95.html"      },
    { title: "Platformer",        file: "games/Platformer.html" },
    { title: "Clicker Game",      file: "games/ClickerGame.html" },
    { title: "MS Paint",          file: "games/Paint.html"        },
    { title: "Name Generator",    file: "games/NameGenerator.html" },
    { title: "Die Roller",        file: "games/DiceRoller.html" },
    { title: "Shooter Game",      file: "games/ShooterGame.html" },
    { title: "Music Player",      file: "games/MusicPlayer.html" },
    { title: "VIP Site",          file: "https://sites.google.com/stu.sandi.net/vip/home?pli=1&authuser=5" },
    { title: "Credits",           file: "games/Credits.html", pinBottom: true },
  ];

  // entries with pinBottom:true always sort to the very end, no matter
  // where you insert them above — so "Credits" (or anything else you flag
  // the same way) never has to be the last line in this list to stay last.
  (function pinBottomEntries(){
    const pinned = [];
    for (let i = GAMES.length - 1; i >= 0; i--) {
      if (GAMES[i].pinBottom) pinned.unshift(GAMES.splice(i, 1)[0]);
    }
    GAMES.push(...pinned);
  })();

  // ---- always populate the plain-HTML fallback list, no matter what ----
  const fallbackList = document.getElementById('fallback-list');
  GAMES.forEach(g => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = 'game-link';
    a.href = g.file;
    a.textContent = g.title;
    li.appendChild(a);
    fallbackList.appendChild(li);
  });

  // ---- bail out gracefully to the fallback if three.js / WebGL is unavailable ----
  function webglAvailable(){
    try{
      const c = document.createElement('canvas');
      return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
    }catch(e){ return false; }
  }
  if (typeof THREE === 'undefined' || !webglAvailable() || typeof THREE.OrbitControls === 'undefined') {
    document.querySelector('#fallback .hint').textContent =
      typeof THREE.OrbitControls === 'undefined'
        ? '3d controls could not load — check your internet connection and reload'
        : '3d view unavailable — enjoy the classic menu';
    return;
  }

  // =====================================================================
  // Scene / renderer / camera
  // =====================================================================
  const appEl = document.getElementById('app');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  appEl.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0612);
  scene.fog = new THREE.FogExp2(0x0a0612, 0.06);

  const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 1.65, 4.8);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.3, 3.65);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = false;
  controls.enableZoom = true;
  controls.minDistance = 1.05;
  controls.maxDistance = 6.0;
  controls.minPolarAngle = Math.PI / 2 - 0.95; // was -0.48: too tight to look up far enough to see the marquee up close
  controls.maxPolarAngle = Math.PI / 2 + 0.28;
  controls.minAzimuthAngle = -Math.PI / 2.2;
  controls.maxAzimuthAngle = Math.PI / 2.2;
  controls.rotateSpeed = 0.55;
  controls.update();

  // =====================================================================
  // Lighting
  // =====================================================================
  const ambientLight = new THREE.AmbientLight(0x171421,0.20);
  scene.add(ambientLight);
  const keyLight = new THREE.PointLight(0x777788,0.18,10);
  keyLight.position.set(0,3,3); scene.add(keyLight);
  const magentaLight = new THREE.PointLight(0xff2bd6,0,6);
  magentaLight.position.set(-2,1.4,1.5); scene.add(magentaLight);
  const cyanLight = new THREE.PointLight(0x22e0ff,0,6);
  cyanLight.position.set(2,1.4,1.5); scene.add(cyanLight);

  // =====================================================================
  // Room: floor (neon grid), walls, ceiling
  // =====================================================================
  const gridCanvas = document.createElement('canvas');
  gridCanvas.width = gridCanvas.height = 512;
  const gridCtx = gridCanvas.getContext('2d');
  function drawGridTexture(){
    const size = 512;
    gridCtx.fillStyle = '#0a0612';
    gridCtx.fillRect(0, 0, size, size);
    gridCtx.strokeStyle = 'rgba(255,43,214,0.55)';
    gridCtx.lineWidth = 2;
    const step = size / 8;
    for(let i = 0; i <= 8; i++){
      gridCtx.beginPath(); gridCtx.moveTo(i*step, 0); gridCtx.lineTo(i*step, size); gridCtx.stroke();
      gridCtx.beginPath(); gridCtx.moveTo(0, i*step); gridCtx.lineTo(size, i*step); gridCtx.stroke();
    }
  }
  drawGridTexture();
  const gridTexture = new THREE.CanvasTexture(gridCanvas);
  gridTexture.wrapS = gridTexture.wrapT = THREE.RepeatWrapping;
  gridTexture.repeat.set(6, 6);

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(24, 24),
    new THREE.MeshStandardMaterial({ map: gridTexture, roughness: 0.6, metalness: 0.2 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.02; // nudge below y=0 so it isn't coplanar with the cabinet base or the room's bottom face (was causing z-fighting flicker)
  scene.add(floor);

  const wallCanvas = document.createElement('canvas');
  wallCanvas.width = wallCanvas.height = 256;
  const wallCtx = wallCanvas.getContext('2d');
  function drawWallTexture(){
    const grad = wallCtx.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, '#1a0e2e');
    grad.addColorStop(1, '#0a0612');
    wallCtx.fillStyle = grad;
    wallCtx.fillRect(0, 0, 256, 256);
  }
  drawWallTexture();
  const wallTexture = new THREE.CanvasTexture(wallCanvas);
  const wallMat = new THREE.MeshStandardMaterial({ map: wallTexture, roughness: 0.9, side: THREE.BackSide });

  const room = new THREE.Mesh(new THREE.BoxGeometry(24, 8.3, 24), wallMat);
  room.position.y = 3.9; // bottom sits slightly below the floor, top unchanged
  scene.add(room);

  // Nondescript player — plain head, no face.
  const player = new THREE.Group();
  const playerMat = new THREE.MeshStandardMaterial({color:0xd0d0d0, roughness:0.9});

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.19,16,10), playerMat);
  head.position.y=1.52; player.add(head);

  const torso = new THREE.Mesh(new THREE.BoxGeometry(.30,.48,.20),playerMat);
  torso.position.y=1.12; player.add(torso);
  const legL = new THREE.Mesh(new THREE.BoxGeometry(.105,.48,.13),playerMat);
  legL.position.set(-.078,.62,0); player.add(legL);
  const legR = legL.clone(); legR.position.x=.078; player.add(legR);
  const armL = new THREE.Mesh(new THREE.BoxGeometry(.09,.40,.12),playerMat);
  armL.position.set(-.205,1.13,0); player.add(armL);
  const armR = armL.clone(); armR.position.x=.205; player.add(armR);

  // Put the bottoms of the feet exactly on the floor.
  player.position.set(0,-0.38,3.8);
  player.rotation.y=Math.PI;
  scene.add(player);
  let walkTime=0;
  let walking=false;
  let jumpVelocity=0;
  const GRAVITY=-14.5;
  const JUMP_SPEED=5.4;
  const FLOOR_Y=-0.38;

  // A few dark wall/floor details make the starting room feel larger.
  const roomGlow = new THREE.PointLight(0x22e0ff, 0, 8);
  roomGlow.position.set(0, 2.5, -4.8);
  scene.add(roomGlow);

  // thin neon strips along the back wall for atmosphere
  const stripGeo = new THREE.BoxGeometry(0.06, 5, 0.06);
  [-4, -2.6, 2.6, 4].forEach((x, i) => {
    const stripMat = new THREE.MeshStandardMaterial({
      color: i % 2 ? 0x22e0ff : 0xff2bd6,
      emissive: i % 2 ? 0x22e0ff : 0xff2bd6,
      emissiveIntensity: 0
    });
    const strip = new THREE.Mesh(stripGeo, stripMat);
    strip.userData.arcadeStrip = true;
    strip.position.set(x, 2.5, -6);
    scene.add(strip);
  });

  // =====================================================================
  // Arcade cabinet
  // =====================================================================
  const cabinet = new THREE.Group();
  scene.add(cabinet);

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x140a24, roughness: 0.5, metalness: 0.3 });
  const trimMat = new THREE.MeshStandardMaterial({ color: 0xff2bd6, emissive: 0xff2bd6, emissiveIntensity: 0.5, roughness: 0.4 });

  const base = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.3, 1.05), bodyMat);
  base.position.y = 0.15;
  cabinet.add(base);

  const body = new THREE.Mesh(new THREE.BoxGeometry(1.35, 1.5, 0.9), bodyMat);
  body.position.y = 1.05;
  cabinet.add(body);

  // trim edges
  [[-0.66, 1.05, 0], [0.66, 1.05, 0]].forEach(p => {
    const edge = new THREE.Mesh(new THREE.BoxGeometry(0.04, 1.5, 0.92), trimMat);
    edge.position.set(p[0], p[1], p[2]);
    cabinet.add(edge);
  });

  // marquee
  const marqueeCanvas = document.createElement('canvas');
  marqueeCanvas.width = 512; marqueeCanvas.height = 128;
  const marqueeCtx = marqueeCanvas.getContext('2d');
  function drawMarqueeTexture(){
    marqueeCtx.fillStyle = '#0a0612';
    marqueeCtx.fillRect(0, 0, 512, 128);
    marqueeCtx.textAlign = 'center';
    marqueeCtx.textBaseline = 'middle';
    marqueeCtx.font = "48px 'Press Start 2P', monospace";
    marqueeCtx.fillStyle = '#22e0ff';
    marqueeCtx.shadowColor = '#22e0ff';
    marqueeCtx.shadowBlur = 24;
    marqueeCtx.fillText('ARCADE', 256, 68);
  }
  drawMarqueeTexture();
  const marqueeTexture = new THREE.CanvasTexture(marqueeCanvas);
  const marqueeMaterial = new THREE.MeshBasicMaterial({ map: marqueeTexture, transparent:true, opacity:0.08 });
  const marquee = new THREE.Mesh(
    new THREE.BoxGeometry(1.35, 0.34, 0.16),
    marqueeMaterial
  );
  marquee.position.set(0, 1.98, 0.02);
  marquee.rotation.x = -0.12;
  cabinet.add(marquee);

  // screen bezel
  const bezel = new THREE.Mesh(new THREE.BoxGeometry(1.02, 0.82, 0.1), new THREE.MeshStandardMaterial({ color: 0x050208, roughness: 0.6 }));
  bezel.position.set(0, 1.48, 0.42);
  bezel.rotation.x = -0.06;
  cabinet.add(bezel);

  // =====================================================================
  // CRT screen — canvas texture menu
  // =====================================================================
  const SCREEN_W = 512, SCREEN_H = 384;
  const ROWS_VISIBLE = 6;
  const screenCanvas = document.createElement('canvas');
  screenCanvas.width = SCREEN_W; screenCanvas.height = SCREEN_H;
  const sctx = screenCanvas.getContext('2d');
  const screenTexture = new THREE.CanvasTexture(screenCanvas);

  let selected = 0;
  let scrollOffset = 0;
  let hoverRow = -1;
  let blinkOn = true;

  function drawMenu(){
    sctx.fillStyle = '#020402';
    sctx.fillRect(0, 0, SCREEN_W, SCREEN_H);

    sctx.textAlign = 'center';
    sctx.fillStyle = '#39ff14';
    sctx.shadowColor = '#39ff14';
    sctx.shadowBlur = 10;
    sctx.font = "20px 'Press Start 2P', monospace";
    sctx.fillText('SELECT YOUR GAME', SCREEN_W / 2, 42);

    const listTop = 70;
    const rowH = 40;
    sctx.font = "14px 'Press Start 2P', monospace";
    sctx.textAlign = 'left';

    if (selected < scrollOffset) scrollOffset = selected;
    if (selected >= scrollOffset + ROWS_VISIBLE) scrollOffset = selected - ROWS_VISIBLE + 1;

    const visible = GAMES.slice(scrollOffset, scrollOffset + ROWS_VISIBLE);
    visible.forEach((g, i) => {
      const idx = scrollOffset + i;
      const y = listTop + i * rowH;
      const isSelected = idx === selected;
      const isHover = idx === hoverRow;

      if (isSelected) {
        sctx.shadowBlur = 0;
        sctx.fillStyle = 'rgba(57,255,20,0.18)';
        sctx.fillRect(24, y - 24, SCREEN_W - 48, 32);
      }
      sctx.fillStyle = (isSelected || isHover) ? '#39ff14' : '#1c8a0c';
      sctx.shadowBlur = (isSelected || isHover) ? 10 : 0;
      const cursor = isSelected ? '> ' : '  ';
      let label = cursor + g.title;
      if (label.length > 28) label = label.slice(0, 27) + '\u2026';
      sctx.fillText(label, 40, y);
    });

    if (scrollOffset > 0) {
      sctx.textAlign = 'center';
      sctx.fillStyle = '#39ff14';
      sctx.fillText('^', SCREEN_W / 2, listTop - 22);
    }
    if (scrollOffset + ROWS_VISIBLE < GAMES.length) {
      sctx.textAlign = 'center';
      sctx.fillStyle = '#39ff14';
      sctx.fillText('v', SCREEN_W / 2, listTop + ROWS_VISIBLE * rowH + 4);
    }

    sctx.textAlign = 'center';
    sctx.shadowBlur = blinkOn ? 10 : 0;
    sctx.fillStyle = blinkOn ? '#39ff14' : '#0d3a06';
    sctx.font = "13px 'Press Start 2P', monospace";
    sctx.fillText('PRESS ENTER TO PLAY', SCREEN_W / 2, SCREEN_H - 22);

    // scanlines
    sctx.shadowBlur = 0;
    sctx.fillStyle = 'rgba(0,0,0,0.25)';
    for (let y = 0; y < SCREEN_H; y += 4) sctx.fillRect(0, y, SCREEN_W, 1);

    // vignette
    const vg = sctx.createRadialGradient(SCREEN_W/2, SCREEN_H/2, SCREEN_H*0.25, SCREEN_W/2, SCREEN_H/2, SCREEN_H*0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    sctx.fillStyle = vg;
    sctx.fillRect(0, 0, SCREEN_W, SCREEN_H);

    screenTexture.needsUpdate = true;
  }
  drawMenu();

  const screenMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(0.88, 0.66),
    new THREE.MeshBasicMaterial({ map: screenTexture })
  );
  screenMesh.position.set(0, 1.49, 0.475);
  screenMesh.rotation.x = -0.06;
  cabinet.add(screenMesh);

  const screenGlow = new THREE.PointLight(0x39ff14, 0, 2.5);
  screenGlow.position.set(0, 1.49, 0.9);
  cabinet.add(screenGlow);

  // ---- control panel: a tilted shelf whose whole surface faces the
  // player, carrying a draggable joystick (drag up/down = browse) and
  // buttons (click = play). Everything is a child of controlGroup so
  // rotating that one group orients the whole panel correctly.
  const controlGroup = new THREE.Group();
  controlGroup.position.set(0, 0.92, 0.55);
  controlGroup.rotation.x = 0.5; // tilt the shelf up & toward the camera
  cabinet.add(controlGroup);

  const panel = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.08, 0.5), bodyMat);
  controlGroup.add(panel);

  const joystickGroup = new THREE.Group();
  joystickGroup.position.set(-0.35, 0.04, 0.02);
  controlGroup.add(joystickGroup);

  const stickBase = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.045, 16), new THREE.MeshStandardMaterial({ color: 0x1a1a1a }));
  stickBase.position.set(0, 0.02, 0);
  joystickGroup.add(stickBase);

  const stickTilt = new THREE.Group(); // pivots to simulate the stick being pushed
  stickTilt.position.set(0, 0.045, 0);
  joystickGroup.add(stickTilt);

  const stickShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.013, 0.2, 12), new THREE.MeshStandardMaterial({ color: 0x333333 }));
  stickShaft.position.set(0, 0.1, 0);
  stickTilt.add(stickShaft);
  const stickBall = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 16), new THREE.MeshStandardMaterial({ color: 0xff2bd6, emissive: 0xff2bd6, emissiveIntensity: 0.45 }));
  stickBall.position.set(0, 0.2, 0);
  stickTilt.add(stickBall);
  // larger invisible sphere so the joystick is easy to grab with the mouse/finger
  const stickGrabZone = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshBasicMaterial({ visible: false }));
  stickGrabZone.position.set(0, 0.15, 0);
  joystickGroup.add(stickGrabZone);

  const buttons = [];
  const btnColors = [0x39ff14, 0xffe600, 0x22e0ff, 0xff2bd6];
  btnColors.forEach((col, i) => {
    const btn = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.03, 16), new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.4 }));
    btn.position.set(0.05 + i * 0.12, 0.055, -0.02);
    controlGroup.add(btn);
    buttons.push(btn);
  });

  cabinet.position.set(0, 0, -2.8);

  // =====================================================================
  // Interaction / room state / persistent session
  // =====================================================================
  const STORAGE_KEY = 'arcadeHubSessionV2';
  const PHASE_ROOM = 'room';
  const PHASE_ARCADE = 'arcade';
  const PHASE_GAME = 'game';

  let phase = PHASE_ROOM;
  let arcadePowered = false;
  let playerNearCabinet = false;
  let playerVelocity = new THREE.Vector3();
  const moveKeys = {w:false,a:false,s:false,d:false};
  const roomPrompt = document.getElementById('room-prompt');
  const restoreScreen = document.getElementById('session-restore');

  function saveSession(extra = {}) {
    try {
      const data = {
        phase: extra.phase || phase,
        selected,
        player: {x:player.position.x, y:player.position.y, z:player.position.z},
        camera: {x:camera.position.x, y:camera.position.y, z:camera.position.z},
        target: {x:controls.target.x, y:controls.target.y, z:controls.target.z},
        savedAt: Date.now(),
        ...extra
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch(e) {}
  }

  function readSession() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); }
    catch(e) { return null; }
  }

  function setRoomLighting(on){
    ambientLight.intensity=on?1.0:0.20;
    keyLight.intensity=on?0.5:0.18;
    magentaLight.intensity=on?2.2:0;
    cyanLight.intensity=on?2.2:0;
    roomGlow.intensity=on?0.65:0;
    screenGlow.intensity=on?1.2:0;
    scene.traverse(obj => {
      if (obj.userData && obj.userData.arcadeStrip && obj.material) {
        obj.material.emissiveIntensity=on?0.8:0;
      }
    });
  }

  function powerOnArcade() {
    if (arcadePowered) { setRoomLighting(true); return; }
    arcadePowered = true;
    setRoomLighting(true);
    marqueeMaterial.opacity = 1;
    marqueeMaterial.needsUpdate = true;
    marqueeMaterial.color.set(0xffffff);
    marqueeMaterial.emissive = new THREE.Color(0x22e0ff);
    marqueeMaterial.emissiveIntensity = 1.0;
    // A brief electrical flicker.
    let n = 0;
    const flicker = setInterval(() => {
      n++;
      marqueeMaterial.opacity = (n < 5 && n % 2 === 0) ? 0.25 : 1;
      if (n >= 6) { clearInterval(flicker); marqueeMaterial.opacity = 1; }
    }, 65);
  }

  function cabinetWorldPosition() {
    return cabinet.position.clone().add(new THREE.Vector3(0, 0, 0));
  }

  function updateRoomProximity() {
    if (phase !== PHASE_ROOM) {
      roomPrompt.style.display = 'none';
      return;
    }
    const dist = player.position.distanceTo(cabinetWorldPosition());
    playerNearCabinet = dist < 2.75;
    if (playerNearCabinet) {
      powerOnArcade();
      roomPrompt.style.display = 'block';
    } else {
      roomPrompt.style.display = 'none';
    }
  }

  function enterArcadeView(fromRestore = false) {
    phase = PHASE_ARCADE;
    player.visible = false;
    controls.enableZoom = false;
    powerOnArcade();
    roomPrompt.style.display = 'none';
    document.getElementById('crosshair-hint').innerHTML =
      'ARCADE MODE<br>arrow keys / scroll / joystick &bull; click a game to play &bull; ESC to return';
    saveSession({phase:PHASE_ARCADE});

    screenMesh.getWorldPosition(_worldPos);
    screenMesh.getWorldQuaternion(_worldQuat);
    const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(_worldQuat);
    const zoomPos = _worldPos.clone()
      .addScaledVector(forward, 1.65)
      .add(new THREE.Vector3(0,-0.18,0));
    animateCameraTo(zoomPos, _worldPos.clone(), fromRestore ? 10 : 900, () => {
      controls.enabled = true;
      controls.enableZoom = false;
    });
  }

  function leaveArcadeView() {
    if (gameOpen || cameraAnimating) return;
    phase = PHASE_ROOM;
    player.visible = true;
    document.getElementById('crosshair-hint').innerHTML =
      'WASD &bull; move &nbsp;&bull;&nbsp; mouse &bull; look around<br>walk to the arcade cabinet';

    // ease back out to a normal over-the-shoulder view of the player,
    // instead of snapping straight from "zoomed into the CRT" to room mode
    controls.enabled = false;
    const targetCamPos = player.position.clone().add(new THREE.Vector3(0, 2.0, 1.0));
    const targetLookAt = player.position.clone().add(new THREE.Vector3(0, 1.12, 0));
    animateCameraTo(targetCamPos, targetLookAt, 900, () => {
      controls.enabled = true;
      controls.enableZoom = true;
      controls.minDistance = 1.05;
      controls.maxDistance = 6.0;
    });
    saveSession({phase:PHASE_ROOM});
  }

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const interactiveObjects = [cabinet, screenMesh, stickGrabZone, ...buttons];

  let overScreen = false;
  let hoveredButton = -1;

  function updateHoverFromEvent(clientX, clientY){
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hit = raycaster.intersectObjects(interactiveObjects)[0];

    hoverRow = -1;
    overScreen = false;
    hoveredButton = -1;
    let cursor = 'grab';

    if (hit && (phase === PHASE_ARCADE)) {
      if (hit.object === screenMesh) {
        overScreen = true;
        const u = hit.uv.x, v = hit.uv.y;
        const canvasY = (1 - v) * SCREEN_H;
        const canvasX = u * SCREEN_W;
        const listTop = 70, rowH = 40;
        const row = Math.floor((canvasY - (listTop - 24)) / rowH);
        if (canvasX > 20 && row >= 0 && row < ROWS_VISIBLE && (scrollOffset + row) < GAMES.length) {
          hoverRow = scrollOffset + row;
          cursor = 'pointer';
        }
      } else if (hit.object === stickGrabZone) {
        cursor = joystickDragging ? 'grabbing' : 'grab';
      } else if (buttons.includes(hit.object)) {
        hoveredButton = buttons.indexOf(hit.object);
        cursor = 'pointer';
      }
    }

    // camera-zoom-on-wheel is only ever appropriate in room mode; in arcade
    // mode the wheel should always browse the game list instead (handled by
    // the wheel listener below), never dolly the camera, on-screen or off
    controls.enableZoom = (phase === PHASE_ROOM);
    renderer.domElement.style.cursor = cursor;
  }

  // Pointer Events (not mouse events) throughout: OrbitControls calls
  // preventDefault() on touchstart for its own touch-orbit handling, and
  // per spec that suppresses the browser's synthetic mouse events
  // (mousedown/mousemove/click) for that touch — so mouse-event-based
  // logic here would simply never fire on a touchscreen. Pointer Events
  // aren't affected by that and work uniformly for mouse, touch, and pen.
  renderer.domElement.addEventListener('pointermove', e => { if(!joystickDragging) updateHoverFromEvent(e.clientX, e.clientY); drawMenu(); });

  // track drag distance so releasing after orbiting the camera doesn't
  // also register as a tap/click on whatever's under the cursor
  let dragStartPos = null;

  renderer.domElement.addEventListener('wheel', e => {
    if (phase !== PHASE_ARCADE || gameOpen || cameraAnimating) return;
    e.preventDefault();
    if (e.deltaY > 0) selected = Math.min(selected + 1, GAMES.length - 1);
    else selected = Math.max(selected - 1, 0);
    drawMenu();
    saveSession({phase:PHASE_ARCADE});
  }, { passive: false });

  // ---- joystick: press and drag up/down on the ball to browse the menu.
  // A repeat timer (not just pointermove) drives the browsing, so holding
  // the stick at the extreme keeps scrolling even once the mouse stops moving.
  let joystickDragging = false;
  let joystickStartY = 0;
  let joystickNorm = 0;
  let joystickRepeatTimer = null;

  function joystickStep(){
    if (joystickNorm > 0.65) { selected = Math.min(selected + 1, GAMES.length - 1); drawMenu(); saveSession({phase:PHASE_ARCADE}); }
    else if (joystickNorm < -0.65) { selected = Math.max(selected - 1, 0); drawMenu(); saveSession({phase:PHASE_ARCADE}); }
  }

  renderer.domElement.addEventListener('pointerdown', e => {
    dragStartPos = { x: e.clientX, y: e.clientY };
    if (gameOpen || cameraAnimating) return;
    updateHoverFromEvent(e.clientX, e.clientY);
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hit = phase === PHASE_ARCADE ? raycaster.intersectObject(stickGrabZone)[0] : null;
    if (hit) {
      joystickDragging = true;
      joystickStartY = e.clientY;
      joystickNorm = 0;
      controls.enabled = false;
      renderer.domElement.setPointerCapture(e.pointerId);
      clearInterval(joystickRepeatTimer);
      joystickStep(); // immediate feedback if already past threshold
      joystickRepeatTimer = setInterval(joystickStep, 220);
    }
  });
  renderer.domElement.addEventListener('pointermove', e => {
    if (!joystickDragging) return;
    const dy = e.clientY - joystickStartY;
    joystickNorm = Math.max(-1, Math.min(1, dy / 55));
    stickTilt.rotation.x = joystickNorm * 0.5;
  });
  function releaseJoystick(e){
    if (!joystickDragging) return;
    joystickDragging = false;
    joystickNorm = 0;
    clearInterval(joystickRepeatTimer);
    joystickRepeatTimer = null;
    controls.enabled = true;
    if (e && e.pointerId !== undefined) {
      try { renderer.domElement.releasePointerCapture(e.pointerId); } catch(err){}
    }
  }

  renderer.domElement.addEventListener('pointerup', e => {
    const wasJoystickDrag = joystickDragging; // read before releaseJoystick clears it
    releaseJoystick(e);
    if (wasJoystickDrag) return; // this pointer was working the joystick, not tapping

    if (gameOpen || cameraAnimating) return;
    if (dragStartPos) {
      const dragDist = Math.hypot(e.clientX - dragStartPos.x, e.clientY - dragStartPos.y);
      dragStartPos = null;
      if (dragDist > 6) return; // was a camera-orbit drag/swipe, not a tap
    }
    updateHoverFromEvent(e.clientX, e.clientY);
    if (phase === PHASE_ARCADE) {
      if (hoverRow >= 0) {
        selected = hoverRow;
        launchGame(selected);
      } else if (hoveredButton >= 0) {
        launchGame(selected);
      }
    } else if (phase === PHASE_ROOM && playerNearCabinet) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const cabinetHit = raycaster.intersectObject(cabinet, true)[0];
      if (cabinetHit) enterArcadeView();
    }
  });
  renderer.domElement.addEventListener('pointercancel', e => { releaseJoystick(e); dragStartPos = null; });

  window.addEventListener('keydown', e => {
    const k = e.key;
    const lower = k.toLowerCase();

    if (gameOpen) {
      if (k === 'Escape') closeGame();
      return;
    }

    if (cameraAnimating) return;

    if (phase === PHASE_ROOM) {
      if (k === ' ' || e.code === 'Space') {
        e.preventDefault();
        if (Math.abs(player.position.y-FLOOR_Y)<0.03) jumpVelocity=JUMP_SPEED;
        return;
      }
      if (lower === 'w' || lower === 'a' || lower === 's' || lower === 'd') {
        moveKeys[lower] = true;
        e.preventDefault();
      }
      if (k === 'Enter' && playerNearCabinet) {
        enterArcadeView();
        e.preventDefault();
      }
      return;
    }

    if (phase === PHASE_ARCADE) {
      if (k === 'Escape') {
        leaveArcadeView();
        e.preventDefault();
        return;
      }
      if (k === 'ArrowDown') {
        selected = Math.min(selected + 1, GAMES.length - 1);
        drawMenu();
        saveSession({phase:PHASE_ARCADE});
        e.preventDefault();
      } else if (k === 'ArrowUp') {
        selected = Math.max(selected - 1, 0);
        drawMenu();
        saveSession({phase:PHASE_ARCADE});
        e.preventDefault();
      } else if (k === 'Enter' || k === ' ') {
        launchGame(selected);
        e.preventDefault();
      }
    }
  });

  window.addEventListener('keyup', e => {
    const lower = e.key.toLowerCase();
    if (lower in moveKeys) {
      moveKeys[lower] = false;
      e.preventDefault();
    }
  });

  setInterval(() => { blinkOn = !blinkOn; if(!gameOpen) drawMenu(); }, 500);

  // =====================================================================
  // Game overlay + camera zoom transition
  // =====================================================================
  let gameOpen = false;
  let cameraAnimating = false;
  const overlay = document.getElementById('game-overlay');
  const frame = document.getElementById('game-frame');
  const backBtn = document.getElementById('back-btn');
  const openTabBtn = document.getElementById('open-tab-btn');

  let savedCameraPos = null;
  let savedTarget = null;
  let overlayFadeTimer = null;
  const _worldPos = new THREE.Vector3();
  const _worldQuat = new THREE.Quaternion();

  // eases the camera from where it is now to a target position/lookAt over
  // `duration` ms, then calls onComplete. Used for the zoom-into-the-CRT
  // effect on launch, and to zoom back out on close.
  function animateCameraTo(targetPos, targetLookAt, duration, onComplete){
    cameraAnimating = true;
    controls.enabled = false;
    const startPos = camera.position.clone();
    const startTarget = controls.target.clone();
    const startTime = performance.now();
    function step(now){
      const t = Math.min((now - startTime) / duration, 1);
      const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // easeInOutQuad
      camera.position.lerpVectors(startPos, targetPos, ease);
      controls.target.lerpVectors(startTarget, targetLookAt, ease);
      controls.update();
      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        cameraAnimating = false;
        if (onComplete) onComplete();
        if (!gameOpen) controls.enabled = true;
      }
    }
    requestAnimationFrame(step);
  }

  function launchGame(index){
    const game = GAMES[index];
    if (!game || gameOpen || cameraAnimating) return;
    gameOpen = true;
    phase = PHASE_GAME;
    saveSession({phase:PHASE_GAME, gameIndex:index});

    savedCameraPos = camera.position.clone();
    savedTarget = controls.target.clone();

    // start loading the real file from the repo (e.g. "games/Terminal.html")
    // right away so it's ready by the time the zoom-in finishes
    frame.src = game.file;
    saveSession({phase:PHASE_GAME, gameIndex:index});

    screenMesh.getWorldPosition(_worldPos);
    screenMesh.getWorldQuaternion(_worldQuat);
    const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(_worldQuat);
    const zoomPos = _worldPos.clone().addScaledVector(forward, 0.72);

    animateCameraTo(zoomPos, _worldPos.clone(), 700, () => {
      openTabBtn.href = game.file;
      overlay.style.display = 'flex';
      backBtn.classList.add('active');
      openTabBtn.classList.add('active');
      clearTimeout(overlayFadeTimer);
      overlayFadeTimer = setTimeout(() => {
        backBtn.classList.remove('active');
        openTabBtn.classList.remove('active');
      }, 1800);
    });
  }

  function closeGame(){
    if (!gameOpen || cameraAnimating) return;
    clearTimeout(overlayFadeTimer);
    overlay.style.display = 'none';
    frame.src = 'about:blank';
    const backPos = savedCameraPos || camera.position.clone();
    const backTarget = savedTarget || controls.target.clone();
    animateCameraTo(backPos, backTarget, 700, () => {
      gameOpen = false;
      phase = PHASE_ARCADE;
      document.getElementById('crosshair-hint').innerHTML =
        'ARCADE MODE<br>arrow keys / scroll / joystick &bull; click a game to play &bull; ESC to return';
      saveSession({phase:PHASE_ARCADE, gameIndex:selected});
      renderer.domElement.focus();
    });
  }
  backBtn.addEventListener('click', closeGame);

  window.addEventListener('beforeunload', () => {
    saveSession({phase: gameOpen ? PHASE_GAME : phase, gameIndex:selected});
  });

  // =====================================================================
  // Texture self-healing: some browsers (notably mobile Safari) silently
  // discard the pixel data of off-screen canvases that aren't attached to
  // the page, and a backgrounded tab can also lose its WebGL context —
  // both would otherwise leave the floor/wall/marquee blank. Redraw them
  // whenever that's likely to have happened.
  // =====================================================================
  function refreshStaticTextures(){
    drawGridTexture();    gridTexture.needsUpdate = true;
    drawWallTexture();    wallTexture.needsUpdate = true;
    drawMarqueeTexture(); marqueeTexture.needsUpdate = true;
    screenTexture.needsUpdate = true;
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refreshStaticTextures();
  });

  renderer.domElement.addEventListener('webglcontextlost', e => {
    e.preventDefault();
  }, false);
  renderer.domElement.addEventListener('webglcontextrestored', () => {
    refreshStaticTextures();
  }, false);

  // belt-and-braces: redraw once a moment after first paint too
  setTimeout(refreshStaticTextures, 500);

  // =====================================================================
  // Resize + render loop
  // =====================================================================
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  let lastFrame = performance.now();
  let saveAccumulator = 0;

  function updatePlayer(dt){
    if(phase!==PHASE_ROOM || cameraAnimating) return;

    // Correct controls: W forward, S backward, A left, D right.
    const input=new THREE.Vector2(
      (moveKeys.d?1:0)-(moveKeys.a?1:0),
      (moveKeys.w?1:0)-(moveKeys.s?1:0)
    );
    walking=input.lengthSq()>0;

    if(walking){
      input.normalize();
      const forward=new THREE.Vector3();
      camera.getWorldDirection(forward);
      forward.y=0;
      if(forward.lengthSq()<0.001) forward.set(0,0,-1);
      forward.normalize();

      const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();
      const moveDir=new THREE.Vector3()
        .addScaledVector(forward,input.y)
        .addScaledVector(right,input.x)
        .normalize();

      playerVelocity.x=THREE.MathUtils.lerp(playerVelocity.x,moveDir.x*2.55,Math.min(1,dt*10));
      playerVelocity.z=THREE.MathUtils.lerp(playerVelocity.z,moveDir.z*2.55,Math.min(1,dt*10));

      const desiredYaw=Math.atan2(moveDir.x,moveDir.z);
      let delta=desiredYaw-player.rotation.y;
      delta=Math.atan2(Math.sin(delta),Math.cos(delta));
      player.rotation.y+=delta*Math.min(1,dt*12);
    }else{
      playerVelocity.x*=Math.max(0,1-dt*12);
      playerVelocity.z*=Math.max(0,1-dt*12);
    }

    player.position.x+=playerVelocity.x*dt;
    player.position.z+=playerVelocity.z*dt;

    // Ballistic jump physics.
    jumpVelocity+=GRAVITY*dt;
    player.position.y+=jumpVelocity*dt;
    if(player.position.y<=FLOOR_Y){
      player.position.y=FLOOR_Y;
      jumpVelocity=0;
    }

    player.position.x=THREE.MathUtils.clamp(player.position.x,-5.2,5.2);
    player.position.z=THREE.MathUtils.clamp(player.position.z,-1.8,5.3);

    const cab=cabinetWorldPosition();
    const dx=player.position.x-cab.x, dz=player.position.z-cab.z, d=Math.hypot(dx,dz);
    if(d<0.72 && d>0.001){
      player.position.x=cab.x+(dx/d)*0.72;
      player.position.z=cab.z+(dz/d)*0.72;
    }

    // Translate camera + target together. This follows the player but preserves
    // the user's current orbit angle and zoom distance exactly.
    const desiredTarget=player.position.clone().add(new THREE.Vector3(0,1.12,0));
    const deltaTarget=desiredTarget.clone().sub(controls.target);
    controls.target.add(deltaTarget);
    camera.position.add(deltaTarget);
    controls.update();

    if(walking){
      walkTime+=dt*10;
      const swing=Math.sin(walkTime)*0.52;
      legL.rotation.x=swing; legR.rotation.x=-swing;
      armL.rotation.x=-swing*.45; armR.rotation.x=swing*.45;
      torso.position.y=1.12+Math.abs(Math.sin(walkTime*2))*.012;
    }else{
      const damp=Math.max(0,1-dt*10);
      legL.rotation.x*=damp; legR.rotation.x*=damp;
      armL.rotation.x*=damp; armR.rotation.x*=damp;
      torso.position.y+=(1.12-torso.position.y)*Math.min(1,dt*8);
    }
  }

  function animate(){
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min((now - lastFrame) / 1000, 0.05);
    lastFrame = now;

    updatePlayer(dt);
    controls.update();

    if (!joystickDragging) stickTilt.rotation.x *= 0.82;
    screenGlow.intensity = 1.2 + Math.sin(Date.now() * 0.004) * 0.2;
    updateRoomProximity();

    saveAccumulator += dt;
    if (saveAccumulator > 2) {
      saveAccumulator = 0;
      if (phase === PHASE_ROOM) saveSession({phase:PHASE_ROOM});
    }

    renderer.render(scene, camera);
  }

  // wait for the pixel font so the CRT text doesn't redraw mid-flicker, then go
  function restoreSavedSession(){
    const saved = readSession();
    if (!saved) return false;

    if (saved.selected != null) {
      selected = Math.max(0, Math.min(Number(saved.selected) || 0, GAMES.length - 1));
      drawMenu();
    }

    // The requested behavior: reopening the site returns to the screen/buttons,
    // never to the very beginning, once a session has reached the arcade.
    if (saved.phase === PHASE_ARCADE || saved.phase === PHASE_GAME) {
      if (saved.player) player.position.set(saved.player.x || 0, saved.player.y || 0, saved.player.z || 3.8);
      restoreScreen.classList.add('show');
      phase = PHASE_ARCADE;
      controls.enableZoom = false;
      powerOnArcade();
      setTimeout(() => {
        restoreScreen.classList.remove('show');
        enterArcadeView(true);
      }, 550);
      return true;
    }

    if (saved.player) player.position.set(saved.player.x || 0, saved.player.y || 0, saved.player.z || 3.8);
    if (saved.camera && saved.target) {
      camera.position.set(saved.camera.x, saved.camera.y, saved.camera.z);
      controls.target.set(saved.target.x, saved.target.y, saved.target.z);
      controls.update();
    }
    return false;
  }

  // Clicking the canvas in room mode should only activate the arcade when
  // the player is actually close enough to it.
  renderer.domElement.addEventListener('pointermove', e => {
    if (phase === PHASE_ROOM) {
      updateRoomProximity();
    }
  });

  function reveal(){
    document.getElementById('fallback').style.display = 'none';
    appEl.style.display = 'block';
    drawMenu();
    const restored = restoreSavedSession();
    if (!restored) {
      phase = PHASE_ROOM;
      arcadePowered=false;
      setRoomLighting(false);
      roomGlow.intensity=0;
      marqueeMaterial.opacity = 0.18;
      marqueeMaterial.needsUpdate = true;
    }
    animate();
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(reveal).catch(reveal);
  } else {
    reveal();
  }

})();
</script>
</body>
</html>
