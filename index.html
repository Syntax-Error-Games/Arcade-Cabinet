<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
</head>
<body>
    <script>
        // Open the target URL in a new about:blank window
        // The 'replace' makes it navigate the blank tab to your URL
        var newTab = window.open('about:blank');
        if (newTab) {
            newTab.location.replace('https://syntax-error-games.github.io/Arcade-Fabinet/');
            
            // Attempt to close this tab (only works if this page was opened via JS)
            // If user navigated here directly, this will fail silently
            window.close();
            
            // Fallback: clear this page since we can't close it
            document.body.innerHTML = '';
            document.title = '';
        } else {
            // Popup blocked - fallback to normal redirect
            window.location.href = 'https://syntax-error-games.github.io/Arcade-Fabinet/';
        }
    </script>
</body>
</html>
